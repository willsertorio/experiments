<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Velocity Ascent</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a1a2e;}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0;
function resize(){W=window.innerWidth;H=window.innerHeight;cv.width=W;cv.height=H;}
window.addEventListener('resize',resize);resize();

var PXM=10, GRAV=2000, WB=54, WR=14;
var segs=[],hazards=[],genX=0,genY=320;
function clampY(y){return Math.max(-160,Math.min(660,y));}
function addSeg(x1,y1,x2,y2,t){segs.push({x1:x1,y1:y1,x2:x2,y2:y2,type:t});}
function R(a,b){return a+Math.random()*(b-a);}

function genChunk(){
  var tier=Math.floor((genX/PXM)/50);
  var pool=['flat','ramp','gap'];
  if(tier>=1)pool.push('platform','gap','ramp');
  if(tier>=2)pool.push('hazard','doubleRamp','gap','platform');
  if(tier>=3)pool.push('gap','platform','hazard','doubleRamp','gap');
  var c=pool[(Math.random()*pool.length)|0];
  if(c==='flat'){
    var len=R(200,380),dy=R(-30,30);
    addSeg(genX,genY,genX+len,clampY(genY+dy),'ground');genX+=len;genY=clampY(genY+dy);
  }else if(c==='ramp'){
    var h=R(50,90+tier*25),l1=R(140,220);
    addSeg(genX,genY,genX+l1,clampY(genY-h),'ground');genX+=l1;genY=clampY(genY-h);
    var top=R(60,140);addSeg(genX,genY,genX+top,genY,'ground');genX+=top;
    var l2=R(140,240);addSeg(genX,genY,genX+l2,clampY(genY+h),'ground');genX+=l2;genY=clampY(genY+h);
  }else if(c==='gap'){
    var ap=R(100,180);addSeg(genX,genY,genX+ap,genY,'ground');genX+=ap;
    var w=R(60,90)+tier*35+R(0,40);
    genX+=w;genY=clampY(genY+R(10,70));
  }else if(c==='platform'){
    var ap2=R(80,140);addSeg(genX,genY,genX+ap2,genY,'ground');genX+=ap2;
    var w2=R(150,220)+tier*15,py=clampY(genY-R(50,90));
    addSeg(genX+20,py,genX+w2-20,py,'platform');
    genX+=w2;genY=clampY(genY+R(30,80));
  }else if(c==='hazard'){
    var len2=R(220,320);addSeg(genX,genY,genX+len2,genY,'ground');
    var rr=R(11,16);hazards.push({x:genX+len2/2,y:genY-rr,r:rr});
    genX+=len2;
  }else{ // doubleRamp
    for(var i=0;i<2;i++){
      var hh=R(40,70+tier*10),ll=R(110,150);
      addSeg(genX,genY,genX+ll,clampY(genY-hh),'ground');genX+=ll;genY=clampY(genY-hh);
      var gw=R(50,80)+tier*10;genX+=gw;genY=clampY(genY+R(10,40));
    }
  }
}
function ensureTerrain(x){while(genX<x+2200)genChunk();}
function groundAt(x){
  var lo=0,hi=segs.length-1;
  while(lo<=hi){
    var m=(lo+hi)>>1,s=segs[m];
    if(x<s.x1)hi=m-1;else if(x>s.x2)lo=m+1;
    else{var t=(x-s.x1)/((s.x2-s.x1)||1);return{y:s.y1+(s.y2-s.y1)*t,slope:Math.atan2(s.y2-s.y1,s.x2-s.x1)};}
  }
  return null;
}

// ---- audio ----
var AC=null,engOsc=null,engGain=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engOsc=AC.createOscillator();engOsc.type='sawtooth';
    engGain=AC.createGain();engGain.gain.value=0;
    engOsc.connect(engGain);engGain.connect(AC.destination);
    engOsc.frequency.value=200;engOsc.start();
  }catch(e){AC=null;}
}
function crashSound(){
  if(!AC)return;
  var len=AC.sampleRate*0.25,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var src=AC.createBufferSource();src.buffer=buf;
  var f=AC.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(3000,AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(120,AC.currentTime+0.25);
  var g=AC.createGain();g.gain.value=0.5;
  src.connect(f);f.connect(g);g.connect(AC.destination);src.start();
  var o=AC.createOscillator(),og=AC.createGain();
  o.frequency.value=60;og.gain.setValueAtTime(0.6,AC.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.2);
  o.connect(og);og.connect(AC.destination);o.start();o.stop(AC.currentTime+0.2);
}
function landSound(v){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=80;
  g.gain.setValueAtTime(Math.min(0.5,v),AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.1);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.12);
}

// ---- input ----
var keys={acc:false,brk:false,lf:false,lb:false};
var tAcc=false,tBrk=false,tLean=0,tLeanT=0;
var touches={};
var lastTap=0;
function keyHandler(e,down){
  var k=e.code;
  if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','KeyD','KeyA','KeyW','KeyS','KeyR','Space'].indexOf(k)>=0)e.preventDefault();
  if(down)initAudio();
  if(k==='ArrowRight'||k==='KeyD')keys.acc=down;
  if(k==='ArrowLeft'||k==='KeyA')keys.brk=down;
  if(k==='ArrowUp'||k==='KeyW')keys.lf=down;
  if(k==='ArrowDown'||k==='KeyS')keys.lb=down;
  if(k==='KeyR'&&down)restart();
  if(down&&state==='ready'&&(keys.acc||keys.brk))state='play';
}
window.addEventListener('keydown',function(e){keyHandler(e,true);});
window.addEventListener('keyup',function(e){keyHandler(e,false);});

cv.addEventListener('touchstart',function(e){
  e.preventDefault();initAudio();
  var now=performance.now();
  if(now-lastTap<300){restart();lastTap=0;return;}
  lastTap=now;
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    touches[t.identifier]={x:t.clientX,y:t.clientY,half:t.clientX>W/2};
    if(t.clientX>W/2)tAcc=true;else tBrk=true;
  }
  if(state==='ready')state='play';
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i],rec=touches[t.identifier];
    if(!rec)continue;
    var dy=t.clientY-rec.y;
    if(dy<-40){tLean=1;tLeanT=0.3;rec.y=t.clientY;}
    else if(dy>40){tLean=-1;tLeanT=0.3;rec.y=t.clientY;}
  }
},{passive:false});
function endTouch(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i],rec=touches[t.identifier];
    if(rec){if(rec.half)tAcc=false;else tBrk=false;delete touches[t.identifier];}
  }
  // recompute from remaining
  tAcc=false;tBrk=false;
  for(var id in touches){if(touches[id].half)tAcc=true;else tBrk=true;}
}
cv.addEventListener('touchend',endTouch,{passive:false});
cv.addEventListener('touchcancel',endTouch,{passive:false});

// ---- game state ----
var state='ready';
var bike,parts=[],particles=[],shake=0,squash=0,wasGround=false;
var camX=0,camY=0,dist=0,best=0,startX=100,crashTimer=0;

function resetBike(){
  bike={x:startX,y:genYatStart()-60,vx:0,vy:0,a:0,av:0,penF:0,penR:0,maxX:startX};
}
function genYatStart(){var g=groundAt(startX);return g?g.y:320;}
function restart(){
  segs=[];hazards=[];genX=0;genY=320;
  addSeg(0,320,600,320,'ground');genX=600;
  ensureTerrain(0);
  parts=[];particles=[];shake=0;squash=0;wasGround=false;crashTimer=0;
  resetBike();
  camX=bike.x-W*0.35;camY=bike.y-H*0.55;
  dist=0;state='ready';
}
function doCrash(){
  if(state!=='play')return;
  state='crashed';crashTimer=0;
  crashSound();shake=14;
  var ca=Math.cos(bike.a),sa=Math.sin(bike.a);
  parts=[
    {x:bike.x,y:bike.y,vx:bike.vx,vy:bike.vy-250,a:bike.a,av:R(-6,6),type:'body'},
    {x:bike.x+ca*WB/2,y:bike.y+sa*WB/2,vx:bike.vx+R(-100,150),vy:bike.vy-R(150,350),a:0,av:R(-9,9),type:'wheel'},
    {x:bike.x-ca*WB/2,y:bike.y-sa*WB/2,vx:bike.vx+R(-150,100),vy:bike.vy-R(150,350),a:0,av:R(-9,9),type:'wheel'},
    {x:bike.x+sa*30,y:bike.y-ca*30,vx:bike.vx+R(-80,120),vy:bike.vy-R(200,400),a:bike.a,av:R(-8,8),type:'rider'}
  ];
  for(var i=0;i<24;i++){
    particles.push({x:bike.x,y:bike.y,vx:R(-350,350),vy:R(-450,100),life:R(0.4,1),
      col:['#e94560','#ffffff','#ffd166','#4ecca3'][(Math.random()*4)|0]});
  }
}
restart();

function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}

function step(dt){
  if(state==='crashed'){
    crashTimer+=dt;
    for(var i=0;i<parts.length;i++){var p=parts[i];p.vy+=GRAV*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.av*dt;}
    for(var j=particles.length-1;j>=0;j--){var q=particles[j];q.vy+=GRAV*0.6*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)particles.splice(j,1);}
    return;
  }
  if(state!=='play')return;
  if(tLeanT>0){tLeanT-=dt;if(tLeanT<=0)tLean=0;}
  var acc=(keys.acc||tAcc),brk=(keys.brk||tBrk);
  var lean=((keys.lf?1:0)-(keys.lb?1:0))+tLean;
  lean=Math.max(-1,Math.min(1,lean));

  var b=bike;
  b.vy+=GRAV*dt;
  var ca=Math.cos(b.a),sa=Math.sin(b.a);
  var onGround=false,slopeSum=0,slopeN=0;
  var I=WB*WB/5;

  for(var w=0;w<2;w++){
    var s=(w===0?-1:1)*WB/2;
    var rx=ca*s,ry=sa*s;
    var wx=b.x+rx,wy=b.y+ry;
    var gr=groundAt(wx);
    var pen=0;
    if(gr&&wy+WR>gr.y){
      pen=wy+WR-gr.y;
      var vwy=b.vy+b.av*rx; // vertical vel of wheel point
      var F=pen*220-vwy*14;
      if(F<0)F=0;if(F>9000)F=9000;
      b.vy-=F*dt;
      b.av+=(-rx*F)*dt/I;
      onGround=true;slopeSum+=gr.slope;slopeN++;
      if(w===0)b.penR=pen;else b.penF=pen;
      // engine on rear wheel (w=0)
      if(w===0&&acc){
        var ta=gr.slope;
        b.vx+=Math.cos(ta)*950*dt;
        b.vy+=Math.sin(ta)*950*dt;
      }
    }else{if(w===0)b.penR=0;else b.penF=0;}
  }
  if(brk){
    var spd=b.vx*ca+b.vy*sa;
    var dec=850*dt;
    var ns=spd-dec;
    if(ns<-250)ns=-250;
    b.vx+=ca*(ns-spd);b.vy+=sa*(ns-spd);
  }
  // lean torque (manual balance, no auto-righting)
  b.av+=-lean*(onGround?9:15)*dt;
  b.av*= (1-Math.min(1,(onGround?1.4:0.25)*dt));
  if(onGround){
    var slopeA=slopeSum/slopeN;
    // gentle ground alignment only from suspension geometry; no auto balance torque added
  }
  var prevVy=b.vy;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.av*dt;

  // landing feedback
  if(!wasGround&&onGround){
    var imp=prevVy;
    if(imp>450){shake=Math.min(12,imp/120);squash=Math.min(1,imp/1300);landSound(imp/1600);}
    else if(imp>150)landSound(0.08);
  }
  wasGround=onGround;
  squash=Math.max(0,squash-3*dt);
  shake=Math.max(0,shake-30*dt);

  // crash checks
  var hx=b.x+sa*36,hy=b.y-ca*36;
  var gh=groundAt(hx);
  if(gh&&hy>gh.y-3){doCrash();return;}
  var gc=groundAt(b.x);
  if(gc&&b.y>gc.y-4){doCrash();return;}
  if(onGround){
    var sa2=slopeSum/slopeN;
    if(Math.abs(wrap(b.a-sa2))>1.35){doCrash();return;}
  }
  for(var h=0;h<hazards.length;h++){
    var hz=hazards[h];
    if(Math.abs(hz.x-b.x)>120)continue;
    var dx=b.x-hz.x,dy=b.y-hz.y;
    if(dx*dx+dy*dy<(hz.r+10)*(hz.r+10)){doCrash();return;}
    for(var w2=0;w2<2;w2++){
      var s2=(w2===0?-1:1)*WB/2;
      var wx2=b.x+ca*s2-hz.x,wy2=b.y+sa*s2-hz.y;
      if(wx2*wx2+wy2*wy2<(hz.r+WR-2)*(hz.r+WR-2)){doCrash();return;}
    }
  }
  if(b.y>1500){doCrash();return;}

  if(b.x>b.maxX)b.maxX=b.x;
  dist=Math.max(0,(b.maxX-startX)/PXM);
  if(dist>best)best=dist;
  ensureTerrain(b.x);

  // engine sound
  if(AC&&engOsc){
    var spd2=Math.abs(b.vx);
    var f=200+Math.min(1,spd2/900)*400+lean*30;
    engOsc.frequency.setTargetAtTime(f,AC.currentTime,0.05);
    engGain.gain.setTargetAtTime(acc?0.06:(spd2>30?0.03:0.012),AC.currentTime,0.08);
  }
}

// ---- rendering ----
function hash(n){var x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);}

function draw(){
  // sky
  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#0d0d1f');grd.addColorStop(1,'#1a1a2e');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,255,255,0.5)';
  var sStart=Math.floor(camX*0.3/120);
  for(var i=0;i<40;i++){
    var si=sStart+i;
    var sx=si*120+hash(si)*100-camX*0.3;
    var sy=hash(si*3.7)*H*0.6;
    if(sx>-5&&sx<W+5)ctx.fillRect(sx,sy,2,2);
  }
  var shx=(Math.random()-0.5)*shake,shy=(Math.random()-0.5)*shake;
  var ox=-camX+shx,oy=-camY+shy;

  // terrain
  var x0=camX-60,x1=camX+W+60;
  for(var s2=0;s2<segs.length;s2++){
    var sg=segs[s2];
    if(sg.x2<x0||sg.x1>x1)continue;
    if(sg.type==='platform'){
      ctx.strokeStyle='#2a5db0';ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(sg.x1+ox,sg.y1+oy);ctx.lineTo(sg.x2+ox,sg.y2+oy);ctx.stroke();
      ctx.strokeStyle='#7fb2ff';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sg.x1+ox,sg.y1+oy-3);ctx.lineTo(sg.x2+ox,sg.y2+oy-3);ctx.stroke();
      // support posts
      ctx.strokeStyle='#0f3460';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(sg.x1+ox+4,sg.y1+oy);ctx.lineTo(sg.x1+ox+4,sg.y1+oy+40);
      ctx.moveTo(sg.x2+ox-4,sg.y2+oy);ctx.lineTo(sg.x2+ox-4,sg.y2+oy+40);ctx.stroke();
    }else{
      ctx.strokeStyle='#c8c8d8';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(sg.x1+ox,sg.y1+oy);ctx.lineTo(sg.x2+ox,sg.y2+oy);ctx.stroke();
      ctx.strokeStyle='rgba(78,204,163,0.35)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(sg.x1+ox,sg.y1+oy+5);ctx.lineTo(sg.x2+ox,sg.y2+oy+5);ctx.stroke();
    }
  }
  // hazards
  for(var h2=0;h2<hazards.length;h2++){
    var hz=hazards[h2];
    if(hz.x<x0||hz.x>x1)continue;
    ctx.fillStyle='#e94560';
    ctx.beginPath();ctx.arc(hz.x+ox,hz.y+oy,hz.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff7a93';
    ctx.beginPath();ctx.arc(hz.x+ox-hz.r*0.25,hz.y+oy-hz.r*0.25,hz.r*0.35,0,Math.PI*2);ctx.fill();
  }

  if(state==='crashed'){
    for(var p2=0;p2<parts.length;p2++){
      var pt=parts[p2];
      ctx.save();ctx.translate(pt.x+ox,pt.y+oy);ctx.rotate(pt.a);
      if(pt.type==='body'){ctx.fillStyle='#ffffff';ctx.fillRect(-24,-5,48,10);}
      else if(pt.type==='wheel'){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,WR,0,Math.PI*2);ctx.stroke();}
      else{ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-26);ctx.stroke();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,-32,6,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
    for(var q2=0;q2<particles.length;q2++){
      var qq=particles[q2];
      ctx.globalAlpha=Math.max(0,qq.life);
      ctx.fillStyle=qq.col;
      ctx.beginPath();ctx.arc(qq.x+ox,qq.y+oy,3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }else{
    drawBike(ox,oy);
  }

  // speed lines
  var spd=Math.abs(bike?vxSafe():0);
  if(spd>500&&state==='play'){
    ctx.strokeStyle='rgba(255,255,255,'+Math.min(0.35,(spd-500)/1200)+')';
    ctx.lineWidth=1;
    for(var l=0;l<8;l++){
      var ly=hash(l*7.3+Math.floor(performance.now()/60))*H;
      var lx=hash(l*3.1)*W;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+40+spd/15,ly);ctx.stroke();
    }
  }
  drawHUD();
}
function vxSafe(){return bike.vx;}

function drawBike(ox,oy){
  var b=bike;
  ctx.save();
  ctx.translate(b.x+ox,b.y+oy+ (squash*4));
  ctx.rotate(b.a);
  var sq=1-squash*0.25;
  var lean=((keys.lf?1:0)-(keys.lb?1:0))+tLean;
  var ca=1,sa=0;
  // wheels
  var fPen=Math.min(10,b.penF),rPen=Math.min(10,b.penR);
  var fx=WB/2,fy=-fPen*0.6,rx2=-WB/2,ry2=-rPen*0.6;
  ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(fx,fy,WR,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(rx2,ry2,WR,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#e94560';
  ctx.beginPath();ctx.arc(fx,fy,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(rx2,ry2,3,0,Math.PI*2);ctx.fill();
  // frame
  ctx.strokeStyle='#ffffff';ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(rx2,ry2);ctx.lineTo(-8,-14*sq);ctx.lineTo(14,-14*sq);ctx.lineTo(fx,fy);
  ctx.moveTo(-8,-14*sq);ctx.lineTo(8,-2);
  ctx.stroke();
  // handlebar
  ctx.beginPath();ctx.moveTo(14,-14*sq);ctx.lineTo(20,-24*sq);ctx.stroke();
  // rider (lean tilt)
  var rt=-lean*0.55;
  ctx.save();
  ctx.translate(-4,-14*sq);ctx.rotate(rt);
  ctx.strokeStyle='#ffffff';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(2,-20);ctx.stroke(); // torso
  ctx.beginPath();ctx.moveTo(2,-20);ctx.lineTo(22,-8);ctx.stroke(); // arms
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(10,4);ctx.stroke(); // legs
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(3,-27,6,0,Math.PI*2);ctx.fill(); // head
  ctx.restore();
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle='#ffffff';
  ctx.textAlign='center';
  ctx.font='bold 28px monospace';
  ctx.fillText(Math.floor(dist)+'m',W/2,40);
  ctx.textAlign='left';
  ctx.font='16px monospace';
  ctx.fillStyle='#9a9ab8';
  ctx.fillText('BEST '+Math.floor(best)+'m',16,30);
  // speed bar
  var spd=Math.abs(bike.vx);
  ctx.textAlign='right';
  ctx.fillText(Math.floor(spd/PXM*3.6)+' km/h',W-16,30);
  ctx.fillStyle='#0f3460';ctx.fillRect(W-166,38,150,8);
  ctx.fillStyle='#4ecca3';ctx.fillRect(W-166,38,Math.min(150,spd/900*150),8);
  // lean indicator
  var lean=((keys.lf?1:0)-(keys.lb?1:0))+tLean;
  var cx=W/2,cy=64;
  ctx.strokeStyle='#9a9ab8';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
  var la=bike.a-lean*0.6;
  ctx.beginPath();ctx.moveTo(cx-Math.sin(la)*-10,cy-Math.cos(la)*10);
  ctx.lineTo(cx+Math.sin(la)*-10,cy+Math.cos(la)*10);ctx.stroke();

  if(state==='ready'){
    ctx.textAlign='center';
    ctx.fillStyle='rgba(26,26,46,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff';ctx.font='bold 42px monospace';
    ctx.fillText('VELOCITY ASCENT',W/2,H*0.35);
    ctx.font='18px monospace';ctx.fillStyle='#9a9ab8';
    ctx.fillText('D / Right: accelerate    A / Left: brake',W/2,H*0.35+44);
    ctx.fillText('W / Up: lean forward     S / Down: lean back',W/2,H*0.35+72);
    ctx.fillText('Touch: right=gas left=brake swipe=lean double-tap=restart',W/2,H*0.35+100);
    ctx.fillStyle='#4ecca3';
    ctx.fillText('Press accelerate to ride',W/2,H*0.35+140);
  }else if(state==='crashed'&&crashTimer>0.6){
    ctx.textAlign='center';
    ctx.fillStyle='#e94560';ctx.font='bold 36px monospace';
    ctx.fillText('CRASHED',W/2,H*0.35);
    ctx.fillStyle='#ffffff';ctx.font='22px monospace';
    ctx.fillText('Distance: '+Math.floor(dist)+'m    Best: '+Math.floor(best)+'m',W/2,H*0.35+40);
    ctx.fillStyle='#9a9ab8';ctx.font='16px monospace';
    ctx.fillText('Press R or double-tap to restart',W/2,H*0.35+72);
  }
}

// ---- main loop ----
var last=performance.now(),acc2=0;
var STEP=1/60;
var running=true;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){running=false;if(AC&&engGain)engGain.gain.setTargetAtTime(0,AC.currentTime,0.05);}
  else{running=true;last=performance.now();acc2=0;requestAnimationFrame(loop);}
});
function loop(now){
  if(!running)return;
  var dt=(now-last)/1000;last=now;
  if(dt>0.25)dt=0.25;
  acc2+=dt;
  while(acc2>=STEP){step(STEP);acc2-=STEP;}
  // camera
  var tx=bike.x-W*0.35,ty=bike.y-H*0.55;
  camX+=(tx-camX)*Math.min(1,8*dt);
  camY+=(ty-camY)*Math.min(1,5*dt);
  if(AC&&engGain&&state==='crashed')engGain.gain.setTargetAtTime(0,AC.currentTime,0.05);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
