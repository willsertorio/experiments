<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Design — selected tasks</title>
<style>
:root{
  --ink:#0c0e11;
  --panel:#14171c;
  --panel-2:#191d23;
  --line:#252b33;
  --line-soft:#1e232a;
  --text:#e4e8ee;
  --text-dim:#8b95a3;
  --text-faint:#5c6672;
  --cyan:#5ad1e8;
  --rose:#e8735a;
  --green:#7fd18a;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Inter var","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:3px}

.shell{display:grid;grid-template-columns:320px 1fr;height:100vh}

.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
.brand b{color:var(--text);font-weight:600}
.count{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--text-dim)}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:block;width:100%;text-align:left;padding:13px 18px;border-bottom:1px solid var(--line-soft);border-left:2px solid transparent}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{background:var(--panel-2);border-left-color:var(--cyan)}
.row-id{font-family:var(--mono);font-size:11px;color:var(--text-faint);display:block;margin-bottom:5px}
.row-score{float:right;color:var(--text-dim)}
.row[aria-current="true"] .row-score{color:var(--cyan)}
.row-txt{font-size:12.5px;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row[aria-current="true"] .row-txt{color:var(--text)}

.main{overflow-y:auto;min-height:0}
.wrap{max-width:1180px;padding:32px 40px 80px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
h1{font-size:19px;font-weight:500;line-height:1.5;margin:0 0 32px;max-width:78ch}
h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);
   font-weight:400;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}

.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:34px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:15px 16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.card-h span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.card-h b{font-family:var(--mono);font-size:17px;font-weight:500}
.bar{display:flex;gap:2px;height:5px}
.tick{flex:1;border-radius:1px;background:var(--green)}
.tick.f{background:var(--rose)}
.pct{margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--text-faint)}

.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:34px}
.shot{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.shot-lbl{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.shot-lbl span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.shot-frame{position:relative;aspect-ratio:16/10;background:#0a0c0f;cursor:zoom-in;display:block;width:100%;padding:0;border:none}
.shot-frame img{width:100%;height:100%;object-fit:contain;display:block}
.shot-frame .fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:16px;
  font-family:var(--mono);font-size:11px;color:var(--text-faint);line-height:1.6}
.shot-frame.err .fallback{display:grid}
.shot-frame.err img{visibility:hidden}


details.rub{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
details.rub>summary{padding:13px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-dim);cursor:pointer;list-style:none}
details.rub>summary::-webkit-details-marker{display:none}
details.rub>summary::before{content:"\25B8  "; color:var(--text-faint)}
details.rub[open]>summary::before{content:"\25BE  "}
details.rub>summary:hover{color:var(--text)}
table{width:100%;border-collapse:collapse;border-top:1px solid var(--line)}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
   font-weight:400;text-align:left;padding:9px 16px;border-bottom:1px solid var(--line)}
th.c,td.c{text-align:center;width:64px}
td{padding:10px 16px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
.mark{font-family:var(--mono);font-size:13px}
.mark.y{color:var(--green)}
.mark.n{color:var(--rose)}

.box{position:fixed;inset:0;background:rgba(6,8,10,.94);display:none;place-items:center;z-index:50;padding:40px}
.box.on{display:grid}
.box{padding:56px 40px}
.box img{max-width:100%;max-height:100%;object-fit:contain}
.box-cap{position:absolute;top:20px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.box-x{position:absolute;top:14px;right:20px;font-family:var(--mono);font-size:13px;color:var(--text-dim);padding:8px 12px}
.box-x:hover{color:var(--text)}
.box video{max-width:100%;max-height:100%;background:#000;border-radius:4px;outline:none}
.box-note{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-family:var(--mono);
  font-size:11px;color:var(--text-faint)}
.box-note a{color:var(--text-dim)}
.vid-err{display:none;text-align:center;font-family:var(--mono);font-size:12px;color:var(--text-dim);line-height:1.9}
.box.failed .vid-err{display:block}
.box.failed video{display:none}

@media(max-width:1080px){
  .shell{grid-template-columns:1fr;height:auto}
  .side{border-right:none;border-bottom:1px solid var(--line);max-height:44vh}
  .wrap{padding:26px 22px 60px}
  .ledger,.shots{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <video id="boxVid" controls playsinline preload="metadata" style="display:none"></video>
  <div class="vid-err" id="boxErr"></div>
  <div class="box-note" id="boxNote"></div>
</div>

<script>
const TASKS = JSON.parse(document.getElementById('data').textContent);


const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let active = 0;

// sidebar order: weakest model answer first
const ORDER = TASKS.map((t, i) => i);

function drawList(){
  $('#count').textContent = `${TASKS.length} selected tasks`;
  $('#list').innerHTML = ORDER.map(i => TASKS[i]).map((t) => `
    <button class="row" data-i="${TASKS.indexOf(t)}" aria-current="${TASKS.indexOf(t) === active}">
      <span class="row-id">#${t.task_id}</span>
      <div class="row-txt">${esc(t.prompt)}</div>
    </button>`).join('');
}

function ledger(name, s){
  if(!s.total) return '';
  const pct = Math.round(s.pass_ / s.total * 100);
  const ticks = Array.from({length: s.total}, (_, i) =>
    `<i class="tick${i < s.pass_ ? '' : ' f'}"></i>`).join('');
  return `<div class="card">
    <div class="card-h"><span>${name}</span><b>${s.pass_}<span style="color:var(--text-faint)">/${s.total}</span></b></div>
    <div class="bar">${ticks}</div>
    <div class="pct">${pct}% of rubrics met</div>
  </div>`;
}

function shot(lbl, url, cap, target, verb, extra){
  if(!url && !target) return `<div class="shot"><div class="shot-lbl"><span>${lbl}</span></div>
    <div class="shot-frame err"><div class="fallback">No screenshot in export</div></div></div>`;

  const mono = 'style="font-family:var(--mono);font-size:11px"';
  const actions = target
    ? `<span class="lbl-actions">${url ? `<button class="zoom" data-full="${esc(url)}" data-cap="${esc(cap)}">zoom</button>` : ''}
        ${extra ? `<a href="${esc(extra.href)}" target="_blank" rel="noopener" ${mono}>${extra.label} &#8599;</a>` : ''}</span>`
    : `<a href="${esc(url)}" target="_blank" rel="noopener" ${mono}>open &#8599;</a>`;

  const open = target
    ? `<a class="shot-frame live" data-verb="${esc(verb)}" href="${esc(target)}" target="_blank" rel="noopener">`
    : `<button class="shot-frame" data-full="${esc(url)}" data-cap="${esc(cap)}">`;

  return `<div class="shot">
    <div class="shot-lbl"><span>${target ? '<i class="live-dot"></i>' : ''}${lbl}</span>${actions}</div>
    ${open}
      <img src="${esc(url)}" alt="${esc(cap)}" loading="lazy"
        onerror="this.closest('.shot-frame').classList.add('err')">
      <div class="fallback">${target ? 'Screenshot did not load.<br>The link still works.' : 'Image did not load.<br>Sign in to the Revelo<br>labeling app, then reload.'}</div>
    ${target ? '</a>' : '</button>'}</div>`;
}

function drawDetail(){
  const t = TASKS[active];
  const g = t.grading || [];
  $('#detail').innerHTML = `
    <div class="eyebrow">Task ${t.task_id} &middot; original ${t.original_task_id} &middot; ${(t.reviewed_at || '').slice(0,10)}</div>
    <h1>${esc(t.prompt)}</h1>

    <h2>Rubric score by build</h2>
    <div class="ledger">
      ${ledger('Model answer', t.scores.model)}
      ${ledger('Primitives', t.scores.primitives)}
      ${ledger('Assets', t.scores.assets)}
    </div>

    <h2>Screenshots</h2>
    <div class="shots">
      ${shot('Model answer', t.shot_model, 'Model answer — task ' + t.task_id, null, null, null)}
      ${shot('Refined &middot; primitives', t.shot_primitives, 'Primitives — task ' + t.task_id, null, null, null)}
      ${shot('Refined &middot; assets', t.shot_assets, 'Assets — task ' + t.task_id, null, null, null)}
    </div>

    ${g.length ? `<details class="rub"><summary>Rubric detail &mdash; ${g.length} criteria</summary>
      <table><thead><tr><th>Criterion</th><th class="c">Model</th><th class="c">Prim</th><th class="c">Assets</th></tr></thead>
      <tbody>${g.map(r => `<tr>
        <td>${esc(r.rubric)}</td>
        <td class="c"><span class="mark ${r.m === 1 ? 'y' : 'n'}">${r.m === 1 ? '\u2713' : '\u2715'}</span></td>
        <td class="c"><span class="mark ${r.p === 1 ? 'y' : 'n'}">${r.p === 1 ? '\u2713' : '\u2715'}</span></td>
        <td class="c"><span class="mark ${r.a === 1 ? 'y' : 'n'}">${r.a === 1 ? '\u2713' : '\u2715'}</span></td>
      </tr>`).join('')}</tbody></table></details>` : ''}
  `;
  $('.main').scrollTop = 0;
}

function closeBox(){
  const v = $('#boxVid');
  v.pause(); v.removeAttribute('src'); v.load();
  $('#box').classList.remove('on', 'failed');
  $('#boxNote').innerHTML = '';
}

// the three shots of the current task, in display order — drives arrow paging
function shotList(){
  const t = TASKS[active];
  return [
    {src: t.shot_model,      cap: 'Model answer — task ' + t.task_id},
    {src: t.shot_primitives, cap: 'Primitives — task ' + t.task_id},
    {src: t.shot_assets,     cap: 'Assets — task ' + t.task_id},
  ].filter(s => s.src);
}
let shotIdx = 0;

function showShot(i){
  const list = shotList();
  if(!list.length) return;
  shotIdx = (i + list.length) % list.length;
  const s = list[shotIdx];
  $('#boxImg').src = s.src;
  $('#boxCap').textContent = s.cap;
  $('#boxNote').innerHTML = list.length > 1
    ? `${shotIdx + 1} / ${list.length} &nbsp;&middot;&nbsp; <span style="color:var(--text-faint)">\u2190 \u2192 to switch</span>`
    : '';
}

function openImage(src, cap){
  $('#boxVid').style.display = 'none';
  $('#boxImg').style.display = '';
  const i = shotList().findIndex(s => s.src === src);
  $('#box').classList.add('on');
  showShot(i >= 0 ? i : 0);
}

function openVideo(src, name, cap){
  const v = $('#boxVid');
  $('#boxImg').style.display = 'none';
  $('#boxImg').removeAttribute('src');
  v.style.display = '';
  $('#boxCap').textContent = cap;
  const local = src.startsWith('apps/');
  $('#boxErr').innerHTML = `This video could not be played in the page.<br>
    <a href="${src}" target="_blank" rel="noopener">Open it directly &#8599;</a>` +
    (local ? '' : `<br><span style="color:var(--text-faint)">Usually means you're not signed in to the labeling app.</span>`);
  $('#boxNote').innerHTML = `${name} &nbsp;&middot;&nbsp;
    <a href="${src}" target="_blank" rel="noopener">open in new tab &#8599;</a>`;
  v.onerror = () => $('#box').classList.add('failed');
  v.src = src;
  $('#box').classList.add('on');
  v.play().catch(() => {});
}

function render(){ drawList(); drawDetail(); }

document.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if(row){ active = +row.dataset.i; render(); return; }

  const play = e.target.closest('[data-video]');
  if(play){ e.preventDefault(); openVideo(play.dataset.video, play.dataset.vname, play.dataset.cap); return; }

  const zoom = e.target.closest('.zoom');
  if(zoom){ openImage(zoom.dataset.full, zoom.dataset.cap); return; }

  const frame = e.target.closest('.shot-frame');
  if(frame && !frame.classList.contains('live') && !frame.classList.contains('err')){
    openImage(frame.dataset.full, frame.dataset.cap); return; }

  if(e.target.closest('#boxX') || e.target.id === 'box') closeBox();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeBox();
  if($('#box').classList.contains('on')){
    if($('#boxImg').style.display !== 'none'){
      if(e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j'){ showShot(shotIdx + 1); e.preventDefault(); }
      if(e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'k'){ showShot(shotIdx - 1); e.preventDefault(); }
    }
    return;
  }
  const pos = ORDER.indexOf(active);
  if((e.key === 'j' || e.key === 'ArrowDown') && pos < ORDER.length - 1){ active = ORDER[pos + 1]; render(); e.preventDefault(); }
  if((e.key === 'k' || e.key === 'ArrowUp') && pos > 0){ active = ORDER[pos - 1]; render(); e.preventDefault(); }
});

render();
</script>
</body>
</html>
