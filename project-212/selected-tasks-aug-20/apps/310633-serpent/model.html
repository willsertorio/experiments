<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------- utils ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y,s){const h=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,s){return vnoise(x,y,s)*0.6+vnoise(x*2.3,y*2.3,s+13)*0.28+vnoise(x*5.1,y*5.1,s+29)*0.12;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function drawSpaced(ctx,text,cx,y,spacing){
  const chars=[...text];const widths=chars.map(ch=>ctx.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+spacing*(chars.length-1);
  let x=cx-total/2;
  chars.forEach((ch,i)=>{ctx.fillText(ch,x,y);x+=widths[i]+spacing;});
}

/* ---------------- renderer / scene ---------------- */
const canvas=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050706);
scene.fog=new THREE.FogExp2(0x050706,0.045);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.02,80);

const MAX_ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
function tex(c,srgb=true){const t=new THREE.CanvasTexture(c);t.anisotropy=MAX_ANISO;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;}

/* ---------------- procedural textures ---------------- */
function skinTextures(seed){
  const w=2048,h=1024;
  const col=cnv(w,h),c=col.getContext('2d');
  const bmp=cnv(w,h),b=bmp.getContext('2d');
  const rnd=mulberry32(seed);
  // base
  const g=c.createLinearGradient(0,0,w*0.25,h);
  g.addColorStop(0,'#ddd2b4');g.addColorStop(0.5,'#cfc3a3');g.addColorStop(1,'#c4b691');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  b.fillStyle='#808080';b.fillRect(0,0,w,h);
  // soft mottling
  for(let i=0;i<60;i++){
    const r=60+rnd()*260;
    c.fillStyle=rnd()<0.5?`rgba(178,165,128,${0.05+rnd()*0.09})`:`rgba(228,218,190,${0.05+rnd()*0.09})`;
    c.beginPath();c.ellipse(rnd()*w,rnd()*h,r,r*0.6,rnd()*Math.PI,0,7);c.fill();
  }
  // faded python saddles
  c.save();c.filter='blur(16px)';
  let bx=-120;
  while(bx<w+120){
    const bw=140+rnd()*170,bh=h*(0.30+rnd()*0.24),by=h*(0.14+rnd()*0.5);
    c.fillStyle=`rgba(146,124,86,${0.10+rnd()*0.09})`;
    c.beginPath();
    const n=9;
    for(let k=0;k<=n;k++){const a=k/n*Math.PI*2;const rr=1+(rnd()-0.5)*0.55;
      const px=bx+bw/2+Math.cos(a)*bw/2*rr,py=by+bh/2+Math.sin(a)*bh/2*rr;
      k===0?c.moveTo(px,py):c.lineTo(px,py);}
    c.closePath();c.fill();
    // pale center inside some saddles
    if(rnd()<0.5){c.fillStyle=`rgba(214,203,172,${0.10+rnd()*0.06})`;
      c.beginPath();c.ellipse(bx+bw/2,by+bh/2,bw*0.22,bh*0.2,0,0,7);c.fill();}
    bx+=bw*(0.85+rnd()*0.5);
  }
  c.restore();
  // scale shingle grid
  const sW=44,sH=34,rowH=sH*0.78;
  const scalePath=(ctx,cx,cy,sw,sh)=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy-sh*0.52);
    ctx.bezierCurveTo(cx+sw*0.52,cy-sh*0.3,cx+sw*0.55,cy+sh*0.14,cx,cy+sh*0.54);
    ctx.bezierCurveTo(cx-sw*0.55,cy+sh*0.14,cx-sw*0.52,cy-sh*0.3,cx,cy-sh*0.52);
    ctx.closePath();
  };
  let row=0;
  for(let y=-sH;y<h+sH;y+=rowH,row++){
    const off=(row%2)*sW/2;
    for(let x=-sW+off;x<w+sW;x+=sW){
      const cx=x+(rnd()-0.5)*3,cy=y+(rnd()-0.5)*3;
      const j=(rnd()-0.5)*16;
      // drop shadow
      c.save();c.translate(0,2.6);scalePath(c,cx,cy,sW,sH);
      c.fillStyle='rgba(96,82,56,0.28)';c.fill();c.restore();
      // fill
      const lg=c.createRadialGradient(cx,cy-sH*0.18,1,cx,cy,sW*0.66);
      lg.addColorStop(0,`rgb(${236+j|0},${226+j|0},${198+j*0.8|0})`);
      lg.addColorStop(0.75,`rgb(${208+j|0},${196+j|0},${162+j*0.8|0})`);
      lg.addColorStop(1,`rgb(${186+j|0},${172+j|0},${138+j*0.8|0})`);
      scalePath(c,cx,cy,sW,sH);c.fillStyle=lg;c.fill();
      c.strokeStyle='rgba(120,103,72,0.5)';c.lineWidth=1.3;c.stroke();
      // keel
      c.beginPath();c.moveTo(cx,cy-sH*0.3);
      c.quadraticCurveTo(cx+1.5,cy,cx,cy+sH*0.36);
      c.strokeStyle='rgba(120,103,72,0.22)';c.lineWidth=1;c.stroke();
      // top sheen
      c.beginPath();c.moveTo(cx-sW*0.28,cy-sH*0.22);
      c.quadraticCurveTo(cx,cy-sH*0.44,cx+sW*0.28,cy-sH*0.22);
      c.strokeStyle='rgba(255,250,235,0.30)';c.lineWidth=1.1;c.stroke();
      // bump
      const bg=b.createRadialGradient(cx,cy-sH*0.1,1,cx,cy,sW*0.62);
      bg.addColorStop(0,'#e8e8e8');bg.addColorStop(0.8,'#909090');bg.addColorStop(1,'#3a3a3a');
      scalePath(b,cx,cy,sW,sH);b.fillStyle=bg;b.fill();
      b.strokeStyle='#101010';b.lineWidth=2;b.stroke();
    }
  }
  // speckle
  for(let i=0;i<9000;i++){
    c.fillStyle=rnd()<0.5?`rgba(70,58,38,${0.03+rnd()*0.05})`:`rgba(255,250,235,${0.03+rnd()*0.05})`;
    c.fillRect(rnd()*w,rnd()*h,1.4,1.4);
  }
  // edge vignette
  const ev=c.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,w*0.62);
  ev.addColorStop(0,'rgba(60,50,32,0)');ev.addColorStop(1,'rgba(60,50,32,0.16)');
  c.fillStyle=ev;c.fillRect(0,0,w,h);
  return {map:tex(col),bump:tex(bmp,false)};
}

function substrateTexture(){
  const s=512,c=cnv(s,s),x=c.getContext('2d'),rnd=mulberry32(77);
  x.fillStyle='#241b12';x.fillRect(0,0,s,s);
  const cols=['#33261a','#2b2016','#3d2d1e','#241a10','#463522'];
  for(let i=0;i<2600;i++){
    x.save();x.translate(rnd()*s,rnd()*s);x.rotate(rnd()*Math.PI);
    x.fillStyle=cols[(rnd()*cols.length)|0];
    x.globalAlpha=0.5+rnd()*0.5;
    x.fillRect(-3-rnd()*7,-1.2-rnd()*2,6+rnd()*14,2.4+rnd()*4);
    x.restore();
  }
  x.globalAlpha=1;
  const t=tex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,2);return t;
}

function wallTexture(){
  const s=512,c=cnv(s,s),x=c.getContext('2d'),rnd=mulberry32(41);
  x.fillStyle='#161c15';x.fillRect(0,0,s,s);
  for(let i=0;i<240;i++){
    const r=20+rnd()*90;
    x.fillStyle=rnd()<0.5?`rgba(30,38,28,${0.06+rnd()*0.1})`:`rgba(10,13,10,${0.06+rnd()*0.12})`;
    x.beginPath();x.ellipse(rnd()*s,rnd()*s,r,r*0.7,rnd()*Math.PI,0,7);x.fill();
  }
  for(let i=0;i<36;i++){ // faint vertical streaks
    x.fillStyle=`rgba(8,10,8,${0.04+rnd()*0.06})`;
    x.fillRect(rnd()*s,0,1+rnd()*3,s);
  }
  for(let i=0;i<3000;i++){
    x.fillStyle=`rgba(0,0,0,${0.05+rnd()*0.08})`;
    x.fillRect(rnd()*s,rnd()*s,1.4,1.4);
  }
  const t=tex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,1.4);return t;
}

function floorTexture(){
  const s=512,c=cnv(s,s),x=c.getContext('2d'),rnd=mulberry32(9);
  x.fillStyle='#0e100e';x.fillRect(0,0,s,s);
  for(let i=0;i<180;i++){
    const r=14+rnd()*70;
    x.fillStyle=rnd()<0.5?`rgba(24,27,23,${0.08+rnd()*0.1})`:`rgba(5,6,5,${0.1+rnd()*0.12})`;
    x.beginPath();x.ellipse(rnd()*s,rnd()*s,r,r*0.6,rnd()*Math.PI,0,7);x.fill();
  }
  x.strokeStyle='rgba(0,0,0,0.35)';x.lineWidth=2;
  for(let i=0;i<=4;i++){x.beginPath();x.moveTo(i*128,0);x.lineTo(i*128,s);x.stroke();
    x.beginPath();x.moveTo(0,i*128);x.lineTo(s,i*128);x.stroke();}
  const t=tex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,6);return t;
}

function condensationTexture(){
  const w=1024,h=512,c=cnv(w,h),x=c.getContext('2d'),rnd=mulberry32(23);
  x.fillStyle='#000';x.fillRect(0,0,w,h);
  // wiped arcs
  x.strokeStyle='rgba(255,255,255,0.05)';x.lineWidth=46;
  for(let i=0;i<3;i++){x.beginPath();x.arc(w*(0.3+i*0.25),h*1.15,w*0.32,Math.PI*1.15,Math.PI*1.85);x.stroke();}
  // streaks
  for(let i=0;i<44;i++){
    const sx=rnd()*w,sy=rnd()*h*0.4,len=h*(0.25+rnd()*0.6);
    const grd=x.createLinearGradient(0,sy,0,sy+len);
    grd.addColorStop(0,'rgba(255,255,255,0)');
    grd.addColorStop(0.4,`rgba(255,255,255,${0.05+rnd()*0.08})`);
    grd.addColorStop(1,'rgba(255,255,255,0)');
    x.strokeStyle=grd;x.lineWidth=1+rnd()*2;
    x.beginPath();x.moveTo(sx,sy);
    x.bezierCurveTo(sx+(rnd()-0.5)*8,sy+len*0.3,sx+(rnd()-0.5)*8,sy+len*0.7,sx+(rnd()-0.5)*5,sy+len);
    x.stroke();
  }
  // droplets, heavier toward bottom
  for(let i=0;i<1500;i++){
    const yb=Math.pow(rnd(),0.6),py=yb*h,px=rnd()*w,r=0.5+rnd()*2.2+(yb*1.5);
    const g=x.createRadialGradient(px-r*0.3,py-r*0.3,0.1,px,py,r);
    g.addColorStop(0,`rgba(255,255,255,${0.25+rnd()*0.4})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();
  }
  return tex(c,false);
}

function dotTexture(){
  const s=64,c=cnv(s,s),x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,244,220,1)');g.addColorStop(0.4,'rgba(255,244,220,0.4)');g.addColorStop(1,'rgba(255,244,220,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  return tex(c,false);
}
function coneGradientTexture(){
  const c=cnv(128,256),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'rgba(255,236,200,0.85)');g.addColorStop(0.5,'rgba(255,232,190,0.28)');g.addColorStop(1,'rgba(255,232,190,0)');
  x.fillStyle=g;x.fillRect(0,0,128,256);
  return tex(c,false);
}
function poolTexture(){
  const s=256,c=cnv(s,s),x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,4,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,228,175,0.55)');g.addColorStop(0.55,'rgba(255,222,165,0.16)');g.addColorStop(1,'rgba(255,222,165,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  return tex(c,false);
}
function dripTexture(){
  const c=cnv(32,256),x=c.getContext('2d');
  x.strokeStyle='rgba(235,244,246,0.9)';x.lineWidth=2.4;x.lineCap='round';
  x.shadowColor='rgba(235,244,246,0.8)';x.shadowBlur=4;
  x.beginPath();x.moveTo(16,10);x.bezierCurveTo(19,80,13,160,16,246);x.stroke();
  // fade ends
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.2,'rgba(0,0,0,0)');
  g.addColorStop(0.8,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');
  x.globalCompositeOperation='destination-out';x.shadowBlur=0;
  x.fillStyle=g;x.fillRect(0,0,32,256);
  return tex(c,false);
}
function plaqueTexture(){
  const w=512,h=128,c=cnv(w,h),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#4a3a22');g.addColorStop(0.5,'#6b5636');g.addColorStop(1,'#3c2f1c');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(240,220,170,0.5)';x.lineWidth=2;x.strokeRect(8,8,w-16,h-16);

function makeSheet(seed,W,H,px,py,pz,rotZ,rotY){
  const {map,bump}=skinTextures(seed);
  const geo=new THREE.PlaneGeometry(W,H,80,48);
  const mids=[[0.34+hash2(seed,1,3)*0.1,0.56],[0.62+hash2(seed,2,5)*0.1,0.42]];
  const disp=(u,v)=>{
    const env=Math.sin(Math.PI*u)*Math.sin(Math.PI*v);
    let z=(fbm(u*3.2,v*3.2,seed)-0.5)*2*0.055*env
        +(fbm(u*9,v*9,seed+40)-0.5)*2*0.014*env
        +Math.pow(Math.abs(u-0.5)*2,3)*0.02;
    mids.forEach(([mu,mv])=>{
      const d2=(u-mu)*(u-mu)+(v-mv)*(v-mv);
      z*=1-0.92*Math.exp(-d2/0.004);
    });
    return z;
  };
  const pos=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++){pos.setZ(i,disp(uv.getX(i),uv.getY(i)));}
  geo.computeVertexNormals();
  const mat=new THREE.MeshPhysicalMaterial({
    map,bumpMap:bump,bumpScale:0.6,
    roughness:0.6,metalness:0,
    sheen:0.7,sheenRoughness:0.45,sheenColor:new THREE.Color(0xffe9c4),
    side:THREE.DoubleSide
  });
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(px,py,pz);mesh.rotation.z=rotZ;mesh.rotation.y=rotY;
  mesh.castShadow=true;mesh.receiveShadow=true;
  sheetGroup.add(mesh);
  // pins
  const pinUVs=[[0.045,0.955],[0.5,0.968],[0.955,0.955],[0.045,0.05],[0.955,0.05],[0.5,0.04],...mids];
  pinUVs.forEach(([u,v])=>{
    const pin=new THREE.Mesh(pinGeo,pinMat);
    pin.position.set((u-0.5)*W,(v-0.5)*H,disp(u,v)+0.006);
    mesh.add(pin);
  });
  return mesh;
}

const cubeRT=new THREE.WebGLCubeRenderTarget(256,{type:THREE.HalfFloatType,generateMipmaps:true,minFilter:THREE.LinearMipmapLinearFilter});
const cubeCam=new THREE.CubeCamera(0.05,50,cubeRT);
cubeCam.position.set(0,1.5,0.55);
scene.add(cubeCam);
glass.visible=false;cond.visible=false;particles.visible=false;drips.forEach(d=>d.mesh.visible=false);
cubeCam.update(renderer,scene);
glass.visible=true;cond.visible=true;particles.visible=true;drips.forEach(d=>d.mesh.visible=true);
const cubeTex=cubeRT.texture;
glassMat.envMap=cubeTex;glassMat.needsUpdate=true;
condMat.envMap=cubeTex;condMat.needsUpdate=true;
waterMat.envMap=cubeTex;waterMat.envMapIntensity=1.5;waterMat.needsUpdate=true;
pinMat.envMap=cubeTex;pinMat.envMapIntensity=0.9;pinMat.needsUpdate=true;
frameMat.envMap=cubeTex;frameMat.envMapIntensity=0.35;frameMat.needsUpdate=true;
cFloor.material.envMap=cubeTex;cFloor.material.envMapIntensity=0.3;cFloor.material.needsUpdate=true;

/* ---------------- controls ---------------- */
const closeT=new THREE.Vector3(-0.55,1.45,-0.02);
const farT=new THREE.Vector3(0,1.35,-0.32);
let theta=0.17,phi=1.31,radius=0.62;
let tTheta=0.17,tPhi=1.31,tRadius=0.34;
let lastInteract=-10,swayAmp=0;
const pointers=new Map();let pinchD=0;

canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()];
    pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  }
  document.body.classList.add('drag');
  lastInteract=performance.now()/1000;
});
canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(pointers.size===1){
    tTheta=clamp(tTheta-dx*0.0042,-1.2,1.2);
    tPhi=clamp(tPhi-dy*0.003,0.6,1.58);
  }else if(pointers.size===2){
    const ps=[...pointers.values()];
    const d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);
    if(pinchD>0)tRadius=clamp(tRadius*pinchD/d,0.3,4.3);
    pinchD=d;
  }
  lastInteract=performance.now()/1000;
});
const endPointer=e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchD=0;
  if(pointers.size===0)document.body.classList.remove('drag');
  lastInteract=performance.now()/1000;
};
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  tRadius=clamp(tRadius*Math.exp(e.deltaY*0.0011),0.3,4.3);
  lastInteract=performance.now()/1000;
},{passive:false});

/* ---------------- post ---------------- */
const size=new THREE.Vector2(innerWidth,innerHeight);
const rt=new THREE.WebGLRenderTarget(size.x,size.y,{samples:4,type:THREE.HalfFloatType});
const composer=new EffectComposer(renderer,rt);
composer.setPixelRatio(Math.min(devicePixelRatio,1.75));
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(size,0.42,0.55,0.8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

/* ---------------- UI data ---------------- */
const tempEl=document.getElementById('temp'),humEl=document.getElementById('hum'),mistEl=document.getElementById('mist');
setInterval(()=>{
  tempEl.textContent=(27.2+Math.random()*0.7).toFixed(1)+'°C';
  humEl.textContent='RH '+(82+Math.random()*5).toFixed(0)+'%';
},1900);
if(window.lucide)lucide.createIcons();

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();
let elapsed=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  const now=performance.now()/1000;

  // idle sway
  if(now-lastInteract>4)swayAmp=Math.min(1,swayAmp+dt*0.25);
  else swayAmp=Math.max(0,swayAmp-dt*1.5);
  const sTheta=Math.sin(elapsed*0.23)*0.016*swayAmp;
  const sPhi=Math.sin(elapsed*0.17+1.2)*0.009*swayAmp;

  // damping
  const k=1-Math.exp(-dt*6.5);
  theta+=(tTheta-theta)*k;
  phi+=(tPhi-phi)*k;
  radius+=(tRadius-radius)*k;

  const m=smoothstep(0.5,3.4,radius);
  const target=new THREE.Vector3().lerpVectors(closeT,farT,m);

  const th=theta+sTheta,ph=clamp(phi+sPhi,0.55,1.62);
  const sp=Math.sin(ph);
  let cx=target.x+radius*sp*Math.sin(th);
  let cy=target.y+radius*Math.cos(ph);
  let cz=target.z+radius*sp*Math.cos(th);
  cz=Math.max(cz,0.07);
  cx=clamp(cx,-3.3,3.3);
  cy=clamp(cy,0.32,2.95);
  camera.position.set(cx,cy,cz);
  camera.lookAt(target);

  // misting cycle
  const mist=Math.pow(Math.max(0,Math.sin(elapsed*0.075+2.0)),6);
  pMat.opacity=0.18+mist*0.34;
  const misting=mist>0.32;
  if(mistEl.dataset.on!==String(misting)){
    mistEl.dataset.on=String(misting);
    mistEl.textContent=misting?'MISTING CYCLE — ACTIVE':'MISTING CYCLE — STANDBY';
    mistEl.classList.toggle('text-[#8fd0a8]',misting);
  }

  // particles drift
  for(let i=0;i<P;i++){
    const i3=i*3;
    pPos[i3]=pBase[i3]+Math.sin(elapsed*0.3+pPhase[i])*0.06;
    pPos[i3+1]=FLOOR_Y+0.08+((pBase[i3+1]+elapsed*pSpeed[i])%TH);
    pPos[i3+2]=pBase[i3+2]+Math.cos(elapsed*0.22+pPhase[i]*1.7)*0.05;
  }
  pGeo.attributes.position.needsUpdate=true;

  // drips
  drips.forEach(d=>{
    d.y-=d.speed*dt*(1+mist*2.4);
    const rel=(d.y-FLOOR_Y)/TH;
    d.mesh.material.opacity=0.24*smoothstep(0,0.15,rel)*smoothstep(1,0.85,rel);
    d.mesh.position.y=d.y;
    if(d.y<FLOOR_Y+0.25){
      d.y=FLOOR_Y+TH-0.1-Math.random()*0.4;
      d.mesh.position.x=-2+Math.random()*4;
    }
  });

  composer.render();
}
animate();

/* fade in */
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const f=document.getElementById('fade');
  f.style.opacity='0';
  setTimeout(()=>f.remove(),2200);
}));
</script>
</body>
</html>
