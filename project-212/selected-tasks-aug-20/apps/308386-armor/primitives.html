<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.domElement.style.cursor = 'grab';
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.052);

const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 80);
camera.position.set(2.3, 1.74, 7.1); // intro start, tweened inward

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.14, 0);          // just under the breastplate
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.3;
controls.maxDistance = 8.5;
controls.minPolarAngle = 0.32;
controls.maxPolarAngle = 1.82;            // stay above the floor
controls.autoRotate = false;
controls.addEventListener('start', () => { gsap.killTweensOf(camera.position); });

/* subtle environment so the steel has something to reflect */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ============================================================
   POST-PROCESSING (bloom for the window glare)
============================================================ */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   PROCEDURAL STONE TEXTURES
============================================================ */
function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function makeStoneTextures({ size = 1024, rows = 10, tile = 4.5, baseL = 16, dark = false } = {}) {
  const cCol = document.createElement('canvas'); cCol.width = cCol.height = size;
  const cBmp = document.createElement('canvas'); cBmp.width = cBmp.height = size;
  const col = cCol.getContext('2d'), bmp = cBmp.getContext('2d');
  col.fillStyle = dark ? '#0c0c0e' : '#111114'; col.fillRect(0, 0, size, size);
  bmp.fillStyle = '#000'; bmp.fillRect(0, 0, size, size);

  const rowH = size / rows;
  const gap = Math.max(4, size * 0.006);
  for (let r = 0; r < rows; r++) {
    const bricks = 4 + Math.floor(Math.random() * 2);
    const bw = size / bricks;
    const off = (r % 2) * bw * 0.5;
    for (let b = -1; b <= bricks; b++) {
      const x = b * bw + off + (Math.random() - 0.5) * 8;
      const y = r * rowH + (Math.random() - 0.5) * 5;
      const w = bw - gap - Math.random() * 10;
      const h = rowH - gap - Math.random() * 4;
      const L = baseL + (Math.random() - 0.5) * 10;
      const grad = col.createLinearGradient(x, y, x + w * 0.3, y + h);
      grad.addColorStop(0, `hsl(${222 + Math.random() * 14}, ${5 + Math.random() * 7}%, ${L + 5}%)`);
      grad.addColorStop(1, `hsl(${220 + Math.random() * 16}, ${4 + Math.random() * 6}%, ${Math.max(4, L - 6)}%)`);
      col.fillStyle = grad;
      roundedRect(col, x + gap / 2, y + gap / 2, w, h, 7); col.fill();
      const bl = 120 + Math.random() * 70;
      bmp.fillStyle = `rgb(${bl},${bl},${bl})`;
      roundedRect(bmp, x + gap / 2, y + gap / 2, w, h, 7); bmp.fill();
    }
  }
  /* speckle + mottling */
  for (let i = 0; i < 5200; i++) {
    const a = Math.random() * 0.05;
    col.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.6})`;
    col.fillRect(Math.random() * size, Math.random() * size, 1.4, 1.4);
  }
  for (let i = 0; i < 7; i++) {
    const gx = Math.random() * size, gy = Math.random() * size, gr = 140 + Math.random() * 260;
    const g = col.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, 'rgba(0,0,0,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    col.fillStyle = g; col.fillRect(0, 0, size, size);
  }
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const texCol = new THREE.CanvasTexture(cCol);
  texCol.colorSpace = THREE.SRGBColorSpace;
  texCol.wrapS = texCol.wrapT = THREE.RepeatWrapping;
  texCol.repeat.set(1 / tile, 1 / tile);
  texCol.anisotropy = Math.min(8, maxAniso);
  const texBmp = new THREE.CanvasTexture(cBmp);
  texBmp.wrapS = texBmp.wrapT = THREE.RepeatWrapping;
  texBmp.repeat.copy(texCol.repeat);
  texBmp.anisotropy = texCol.anisotropy;
  return { map: texCol, bumpMap: texBmp };
}

/* ============================================================
   MATERIALS
============================================================ */
const steel = new THREE.MeshStandardMaterial({
  color: 0xccd2d9, metalness: 1.0, roughness: 0.29, envMapIntensity: 0.38, side: THREE.DoubleSide
});
const steelDark = new THREE.MeshStandardMaterial({
  color: 0x878d94, metalness: 0.95, roughness: 0.42, envMapIntensity: 0.25, side: THREE.DoubleSide
});
const visorSteel = new THREE.MeshStandardMaterial({
  color: 0x9fa8b1, metalness: 1.0, roughness: 0.31, envMapIntensity: 0.42, side: THREE.DoubleSide
});
const brass = new THREE.MeshStandardMaterial({
  color: 0x9a7a3a, metalness: 1.0, roughness: 0.34, envMapIntensity: 0.6
});
const leather = new THREE.MeshStandardMaterial({ color: 0x2b1a0e, roughness: 0.9, metalness: 0.0 });
const wood = new THREE.MeshStandardMaterial({ color: 0x201205, roughness: 0.82, metalness: 0.0 });
const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

/* ============================================================
   THE ROOM — floor, walls, high window
============================================================ */
const WALL_Z = -2.75, LEFT_X = -3.2, RIGHT_X = 3.4;
const WIN = { cx: LEFT_X, cy: 3.22, cz: -1.15, w: 0.72, sill: 2.5, arch: 3.6, apex: 3.94 };

const floorTex = makeStoneTextures({ rows: 8, tile: 6, baseL: 12, dark: true });
floorTex.map.repeat.set(46 / 6, 46 / 6);
floorTex.bumpMap.repeat.set(46 / 6, 46 / 6);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(46, 46),
  new THREE.MeshStandardMaterial({ map: floorTex.map, bumpMap: floorTex.bumpMap, bumpScale: 0.7, roughness: 0.88, metalness: 0.02, envMapIntensity: 0.1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallTex = makeStoneTextures({ rows: 10, tile: 4.5, baseL: 17 });
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex.map, bumpMap: wallTex.bumpMap, bumpScale: 1.3, roughness: 0.95, metalness: 0.0, envMapIntensity: 0.16 });

/* plane walls need their own tiling (their UVs run 0..1) */
function planeWallMat(w, h) {
  const m = wallTex.map.clone(); m.repeat.set(w / 4.5, h / 4.5); m.needsUpdate = true;
  const b = wallTex.bumpMap.clone(); b.repeat.set(w / 4.5, h / 4.5); b.needsUpdate = true;
  return new THREE.MeshStandardMaterial({ map: m, bumpMap: b, bumpScale: 1.3, roughness: 0.95, metalness: 0.0, envMapIntensity: 0.16 });
}

/* back wall — right behind the harness */
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(15, 6.5), planeWallMat(15, 6.5));
backWall.position.set(0, 3.25, WALL_Z);
backWall.receiveShadow = true;
scene.add(backWall);

/* right wall, lost in darkness */
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(9, 6.5), planeWallMat(9, 6.5));
rightWall.rotation.y = -Math.PI / 2;
rightWall.position.set(RIGHT_X, 3.25, 0.6);
rightWall.receiveShadow = true;
scene.add(rightWall);

/* left wall, with a tall narrow lancet cut high into it */
function lancetHole(path, cx, w, sill, arch, apex) {
  const l = cx - w / 2, r = cx + w / 2;
  path.moveTo(l, sill);
  path.lineTo(l, arch);
  path.quadraticCurveTo(l, apex - 0.04, cx, apex);
  path.quadraticCurveTo(r, apex - 0.04, r, arch);
  path.lineTo(r, sill);
  path.closePath();
}
{
  const shape = new THREE.Shape();
  shape.moveTo(-4.6, 0); shape.lineTo(2.75, 0); shape.lineTo(2.75, 6.5); shape.lineTo(-4.6, 6.5); shape.closePath();
  const hole = new THREE.Path();
  lancetHole(hole, -WIN.cz, WIN.w, WIN.sill, WIN.arch, WIN.apex); // local x maps to world -z
  shape.holes.push(hole);
  const leftWall = new THREE.Mesh(new THREE.ShapeGeometry(shape, 24), wallMat);
  leftWall.rotation.y = Math.PI / 2;
  leftWall.position.set(LEFT_X, 0, 0);
  leftWall.receiveShadow = true;
  scene.add(leftWall);
}

/* window glass — a cool bright sky beyond */
function lancetShape(cx, w, sill, arch, apex) {
  const s = new THREE.Shape();
  const l = cx - w / 2, r = cx + w / 2;
  s.moveTo(l, sill); s.lineTo(l, arch);
  s.quadraticCurveTo(l, apex - 0.04, cx, apex);
  s.quadraticCurveTo(r, apex - 0.04, r, arch);
  s.lineTo(r, sill); s.closePath();
  return s;
}
{
  const gc = document.createElement('canvas'); gc.width = 128; gc.height = 256;
  const g = gc.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.45, '#d3e2ff'); grad.addColorStop(1, '#7d97c4');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 256);
  const hot = g.createRadialGradient(64, 70, 4, 64, 70, 120);
  hot.addColorStop(0, 'rgba(255,255,255,0.95)'); hot.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hot; g.fillRect(0, 0, 128, 256);
  const skyTex = new THREE.CanvasTexture(gc); skyTex.colorSpace = THREE.SRGBColorSpace;

  const glassGeo = new THREE.ShapeGeometry(lancetShape(-WIN.cz, WIN.w - 0.05, WIN.sill + 0.03, WIN.arch, WIN.apex - 0.03), 20);
  const glass = new THREE.Mesh(glassGeo, new THREE.MeshBasicMaterial({ map: skyTex, fog: false }));
  glass.material.color.setRGB(1.5, 1.65, 2.0);
  glass.rotation.y = Math.PI / 2;
  glass.position.set(LEFT_X + 0.02, 0, 0);
  scene.add(glass);

  /* stone sill + reveals */
  const sill = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.07, WIN.w + 0.22), wallMat);
  sill.position.set(LEFT_X + 0.05, WIN.sill - 0.035, WIN.cz);
  scene.add(sill);
  const revealGeo = new THREE.BoxGeometry(0.1, WIN.arch - WIN.sill, 0.06);
  for (const s of [-1, 1]) {
    const rev = new THREE.Mesh(revealGeo, wallMat);
    rev.position.set(LEFT_X + 0.03, (WIN.sill + WIN.arch) / 2, WIN.cz + s * (WIN.w / 2 + 0.03));
    scene.add(rev);
  }
  /* soft halo hugging the opening */
  const hc = document.createElement('canvas'); hc.width = hc.height = 128;
  const hg = hc.getContext('2d');
  const hgr = hg.createRadialGradient(64, 64, 2, 64, 64, 64);
  hgr.addColorStop(0, 'rgba(190,212,255,0.85)'); hgr.addColorStop(1, 'rgba(190,212,255,0)');
  hg.fillStyle = hgr; hg.fillRect(0, 0, 128, 128);
  const halo = new THREE.Mesh(
    new THREE.PlaneGeometry(1.9, 2.7),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(hc), transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
  );
  halo.rotation.y = Math.PI / 2;
  halo.position.set(LEFT_X + 0.06, WIN.cy, WIN.cz);
  scene.add(halo);
}

/* ============================================================
   THE HARNESS — full plate on its stand
============================================================ */
const armour = new THREE.Group();
scene.add(armour);

/* Every major piece hangs off its own pivot group so the tweak panel can
   scale and swing it about a sensible joint instead of the floor origin. */
const PARTS = {};
function makePart(name, ax, ay, az) {
  const outer = new THREE.Group();
  outer.position.set(ax, ay, az);
  outer.userData.anchor = new THREE.Vector3(ax, ay, az);
  const inner = new THREE.Group();
  inner.position.set(-ax, -ay, -az);
  outer.add(inner);
  armour.add(outer);
  PARTS[name] = outer;
  return inner;
}
const gStand   = makePart('stand',   0, 0,     0);
const gCuirass = makePart('cuirass', 0, 0.92,  0);
const gFauld   = makePart('fauld',   0, 1.005, 0);
const gGorget  = makePart('gorget',  0, 1.462, 0);
const gHelm    = makePart('helm',    0, 1.565, 0);
const gPauldron = {}, gArm = {}, gLeg = {};
for (const s of [1, -1]) {
  const k = s > 0 ? 'R' : 'L';
  gPauldron[s] = makePart('pauldron' + k, s * 0.19,  1.47, 0);
  gArm[s]      = makePart('arm' + k,      s * 0.238, 1.43, 0);
  gLeg[s]      = makePart('leg' + k,      s * 0.108, 0.9,  0);
}

function lathe(profile, mat, seg = 48) {
  const pts = profile.map(p => new THREE.Vector2(p[0], p[1]));
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts, seg), mat);
  m.castShadow = true;
  return m;
}
function addMesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  return m;
}

/* the stand — dark oak post, crossbar and base */
{
  const base = addMesh(new THREE.CylinderGeometry(0.32, 0.36, 0.05, 28), wood, 0, 0.025, 0);
  const post = addMesh(new THREE.CylinderGeometry(0.032, 0.038, 1.56, 12), wood, 0, 0.83, -0.02);
  const bar = addMesh(new THREE.BoxGeometry(0.88, 0.05, 0.05), wood, 0, 1.45, -0.01);
  base.receiveShadow = true;
  gStand.add(base, post, bar);
}

/* cuirass — shaped breastplate with a central tapul ridge */
{
  const prof = [
    [0.152, 0.00], [0.168, 0.05], [0.186, 0.13], [0.201, 0.22], [0.211, 0.32],
    [0.208, 0.40], [0.196, 0.47], [0.172, 0.53], [0.140, 0.58], [0.118, 0.62], [0.112, 0.65]
  ];
  const pts = prof.map(p => new THREE.Vector2(p[0], p[1]));
  const geo = new THREE.LatheGeometry(pts, 64);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    x *= 1.30; z *= 0.78;                                   // torso ellipse
    const t = THREE.MathUtils.clamp((y - 0.08) / 0.44, 0, 1);
    const s = Math.sin(t * Math.PI);
    if (z > 0) {
      z += s * 0.055 * (z / 0.21);                          // chest swells forward
      z += Math.exp(-Math.pow(x / 0.028, 2)) * 0.013 * s;   // tapul ridge
    }
    pos.setXYZ(i, x, y, z);
  }
  geo.computeVertexNormals();
  const cuirass = new THREE.Mesh(geo, steel);
  cuirass.position.y = 0.92;
  cuirass.castShadow = true;

/* ============================================================
   VOLUMETRIC SHAFT — two soft cones of daylight
============================================================ */
const shaftUniformsList = [];
function makeShaftCone(rFloor, rWin, intensity) {
  const geo = new THREE.CylinderGeometry(rFloor, rWin, shaftLen, 36, 1, true);
  const uniforms = {
    uTime: { value: 0 },
    uLen: { value: shaftLen },
    uColor: { value: new THREE.Color(0xcfdcff) },
    uIntensity: { value: intensity }
  };
  shaftUniformsList.push(uniforms);
  const mat = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      uniform float uLen;
      varying vec3 vN; varying vec3 vW; varying float vAlong;
      void main(){
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vW = wp.xyz;
        vAlong = position.y / uLen + 0.5;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform float uTime; uniform vec3 uColor; uniform float uIntensity;
      varying vec3 vN; varying vec3 vW; varying float vAlong;
      void main(){
        vec3 V = normalize(cameraPosition - vW);
        float soft = pow(abs(dot(normalize(vN), V)), 1.35);
        float caps = smoothstep(0.0, 0.07, vAlong) * (1.0 - smoothstep(0.88, 1.0, vAlong));
        float grad = mix(1.0, 0.42, vAlong) + smoothstep(0.86, 1.0, vAlong) * 0.35;
        float shimmer = 0.82 + 0.18 * sin(vW.y * 7.0 - uTime * 0.55 + sin(vW.x * 4.0 + uTime * 0.3));
        gl_FragColor = vec4(uColor, soft * caps * grad * shimmer * uIntensity);
      }`
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(SHAFT_MID);
  mesh.quaternion.copy(shaftQuat);
  mesh.renderOrder = 5;
  scene.add(mesh);
  return mesh;
}
makeShaftCone(0.98, 0.36, 0.085);

/* ============================================================
   DUST — motes drifting down through the beam
============================================================ */
let dustUniforms;
{
  const COUNT = 700;
  const pos = new Float32Array(COUNT * 3);
  const seed = new Float32Array(COUNT * 3);
  const size = new Float32Array(COUNT);
  for (let i = 0; i < COUNT; i++) {
    const y = Math.random() * shaftLen;
    const rAt = THREE.MathUtils.lerp(0.3, 0.88, y / shaftLen);
    const rf = 0.4 + Math.random() * 0.95;
    const a = Math.random() * Math.PI * 2;
    const rr = rAt * rf * Math.sqrt(Math.random());
    pos[i * 3] = Math.cos(a) * rr;
    pos[i * 3 + 1] = y - shaftLen / 2;
    pos[i * 3 + 2] = Math.sin(a) * rr;
    seed[i * 3] = Math.random();
    seed[i * 3 + 1] = Math.random();
    seed[i * 3 + 2] = rf;
    size[i] = 3.5 + Math.random() * 6.5;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));

  dustUniforms = {
    uTime: { value: 0 },
    uLen: { value: shaftLen },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uColor: { value: new THREE.Color(0xe4ebff) },
    uOpacity: { value: 0.5 }
  };
  const mat = new THREE.ShaderMaterial({
    uniforms: dustUniforms,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
      attribute vec3 aSeed; attribute float aSize;
      uniform float uTime; uniform float uLen; uniform float uPixelRatio;
      varying float vAlpha;
      void main(){
        vec3 p = position;
        float ph = aSeed.x * 6.28318;
        float sp = 0.028 + aSeed.y * 0.055;
        float y01 = mod(p.y + uLen * 0.5 + uTime * sp, uLen);
        p.y = y01 - uLen * 0.5;
        p.x += sin(uTime * (0.14 + aSeed.y * 0.22) + ph) * 0.085;
        p.z += cos(uTime * (0.11 + aSeed.x * 0.19) + ph * 1.7) * 0.085;
        float ends = smoothstep(0.12, 0.85, y01) * (1.0 - smoothstep(uLen - 1.5, uLen - 0.25, y01));
        float flicker = 0.5 + 0.5 * sin(uTime * (0.5 + aSeed.y * 0.8) + ph * 3.1);
        vAlpha = clamp(ends * flicker / pow(aSeed.z, 1.25), 0.0, 1.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = min(aSize * uPixelRatio * (1.15 / -mv.z), 9.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity;
      varying float vAlpha;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        float a = (1.0 - smoothstep(0.04, 0.5, d)) * vAlpha * uOpacity;
        gl_FragColor = vec4(uColor, a);
      }`
  });
  const dust = new THREE.Points(geo, mat);
  dust.position.copy(SHAFT_MID);
  dust.quaternion.copy(shaftQuat);
  dust.renderOrder = 6;
  scene.add(dust);
}

/* ============================================================
   INTERACTION — click the helm to raise / lower the visor
============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let visorOpen = false, downX = 0, downY = 0;

function setPointer(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
}
function helmHit(e) {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObjects(pickTargets, true).length > 0;
}
function toggleVisor() {
  visorOpen = !visorOpen;
  gsap.to(visorPivot.rotation, {
    x: visorOpen ? -1.82 : 0,
    duration: visorOpen ? 1.25 : 0.9,
    ease: visorOpen ? 'power3.inOut' : 'power2.in'
  });
}
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) < 6 && helmHit(e)) toggleVisor();
});
let hoverQueued = false;
renderer.domElement.addEventListener('pointermove', e => {
  if (hoverQueued) return;
  hoverQueued = true;
  requestAnimationFrame(() => {
    renderer.domElement.style.cursor = helmHit(e) ? 'pointer' : 'grab';
    hoverQueued = false;
  });
});

/* ============================================================
   RESIZE / ANIMATE
============================================================ */
const BASE_FOV = 44;
function fitCamera() {
  camera.aspect = innerWidth / innerHeight;
  /* widen on narrower viewports so the window and rack stay in frame */
  camera.fov = camera.aspect < 1.5 ? Math.min(74, BASE_FOV * (1.5 / camera.aspect)) : BASE_FOV;
  camera.updateProjectionMatrix();
}
fitCamera();
addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  dustUniforms.uPixelRatio.value = renderer.getPixelRatio();
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();
  for (const u of shaftUniformsList) u.uTime.value = t;
  dustUniforms.uTime.value = t;
  composer.render();
}
animate();

    ['pauldronSpread', 'Spread', -0.1, 0.18, 0.005, -0.005, 'm'],
    ['pauldronLift', 'Lift', -30, 30, 1, 24, '\u00b0']
  ]],
  ['Arms', [
    ['armSize', 'Size', 0.7, 1.5, 0.01, 1.06],
    ['armSpread', 'Spread', -0.08, 0.2, 0.005, 0.035, 'm'],
    ['armSwing', 'Swing', -25, 25, 1, 0, '\u00b0']
  ]],
  ['Cuirass', [
    ['cuirassSize', 'Size', 0.75, 1.4, 0.01, 0.88],
    ['cuirassDepth', 'Chest depth', 0.7, 1.6, 0.01, 0.9],
    ['cuirassLean', 'Lean', -15, 15, 1, 0, '\u00b0']
  ]],
  ['Fauld & tassets', [
    ['fauldSize', 'Size', 0.7, 1.5, 0.01, 1.02],
    ['fauldDrop', 'Drop', -0.06, 0.1, 0.005, 0.04, 'm']
  ]],
  ['Legs', [
    ['legSize', 'Size', 0.7, 1.4, 0.01, 1.03],
    ['legSpread', 'Stance', -0.05, 0.14, 0.005, -0.03, 'm'],
    ['legAngle', 'Angle', -12, 12, 1, 1, '\u00b0']
  ]]
];

const DEFAULTS = {};
for (const [, items] of CONTROLS) for (const c of items) DEFAULTS[c[0]] = c[5];
const STORE = 'vigil.armour.tweaks';
const tweaks = Object.assign({}, DEFAULTS);
/* Always starts collapsed: the panel would otherwise sit over the weapon rack,
   so every fresh load shows the room unobstructed. Slider values still persist. */
let panelOpen = false;
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved) for (const k in DEFAULTS) if (typeof saved[k] === 'number') tweaks[k] = saved[k];
} catch (e) { /* ignore a bad blob */ }

const DEG = Math.PI / 180;
function place(p, s, rx, ry, rz, dx = 0, dy = 0) {
  p.scale.setScalar(s);
  p.rotation.set(rx, ry, rz);
  const a = p.userData.anchor;
  p.position.set(a.x + dx, a.y + dy, a.z);
}
function applyTweaks() {
  const v = tweaks;
  armour.scale.setScalar(v.allSize);
  armour.rotation.y = v.allTurn * DEG;
  place(PARTS.helm, v.helmSize, v.helmTilt * DEG, v.helmTurn * DEG, 0);
  place(PARTS.gorget, v.gorgetSize, 0, 0, 0);
  place(PARTS.fauld, v.fauldSize, 0, 0, 0, 0, -v.fauldDrop);
  const cu = PARTS.cuirass;
  cu.scale.set(v.cuirassSize, v.cuirassSize, v.cuirassSize * v.cuirassDepth);
  cu.rotation.set(v.cuirassLean * DEG, 0, 0);
  for (const s of [1, -1]) {
    const k = s > 0 ? 'R' : 'L';
    place(PARTS['pauldron' + k], v.pauldronSize, 0, 0, s * v.pauldronLift * DEG, s * v.pauldronSpread);
    place(PARTS['arm' + k], v.armSize, 0, 0, s * v.armSwing * DEG, s * v.armSpread);
    place(PARTS['leg' + k], v.legSize, 0, 0, s * v.legAngle * DEG, s * v.legSpread);
  }
}

const twBody = document.getElementById('tw-body');
const readouts = {}, inputs = {};
const fmt = (n, step, unit) => (step < 0.01 ? n.toFixed(3) : step < 1 ? n.toFixed(2) : Math.round(n)) + (unit || '');
for (const [group, items] of CONTROLS) {
  const sec = document.createElement('div');
  sec.className = 'pt-3 pb-1';
  const gh = document.createElement('p');
  gh.className = 'font-cinzel text-[9px] tracking-[0.3em] text-[#d6c08c]/55 uppercase mb-2';
  gh.textContent = group;
  sec.appendChild(gh);
  for (const [key, label, min, max, step, , unit] of items) {
    const row = document.createElement('div');
    row.className = 'mb-2.5';
    const top = document.createElement('div');
    top.className = 'flex items-baseline justify-between mb-1';
    const lb = document.createElement('span');
    lb.className = 'font-cormorant text-[13px] text-[#b9bcc2]';
    lb.textContent = label;
    const val = document.createElement('span');
    val.className = 'font-cormorant italic text-[12px] text-[#8b9097] tabular-nums';
    val.textContent = fmt(tweaks[key], step, unit);
    top.append(lb, val);
    const inp = document.createElement('input');
    inp.type = 'range';
    inp.dataset.k = key;
    inp.min = min; inp.max = max; inp.step = step; inp.value = tweaks[key];
    inp.addEventListener('input', () => {
      tweaks[key] = parseFloat(inp.value);
      val.textContent = fmt(tweaks[key], step, unit);
      applyTweaks();
      save();
    });
    readouts[key] = val; inputs[key] = inp;
    row.append(top, inp);
    sec.appendChild(row);
  }
  twBody.appendChild(sec);
}

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify(tweaks)); } catch (e) { /* private mode */ }
  }, 250);
}
function syncInputs() {
  for (const [, items] of CONTROLS) for (const [key, , , , step, , unit] of items) {
    inputs[key].value = tweaks[key];
    readouts[key].textContent = fmt(tweaks[key], step, unit);
  }
}

const twPanel = document.getElementById('tw-panel');
const twChev = document.getElementById('tw-chev');
function drawPanelState() {
  twPanel.style.display = panelOpen ? '' : 'none';
  twChev.innerHTML = panelOpen ? '&minus;' : '+';
}
drawPanelState();
document.getElementById('tw-toggle').addEventListener('click', () => {
  panelOpen = !panelOpen;
  drawPanelState();
});
document.getElementById('tw-reset').addEventListener('click', () => {
  Object.assign(tweaks, DEFAULTS);
  syncInputs(); applyTweaks(); save();
});
const copyBtn = document.getElementById('tw-copy');
copyBtn.addEventListener('click', () => {
  const changed = {};
  for (const k in tweaks) if (tweaks[k] !== DEFAULTS[k]) changed[k] = tweaks[k];
  const text = Object.keys(changed).length
    ? JSON.stringify(changed, null, 2)
    : 'all defaults';
  const done = () => {
    copyBtn.textContent = 'Copied';
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  } else fallback(text, done);
});
function fallback(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* nothing else to try */ }
  ta.remove();
}

applyTweaks();

/* intro — camera drifts in from the dark, UI fades up */
const camGoal = { x: 1.42, y: 1.54, z: 4.62 };
gsap.to(camera.position, { ...camGoal, duration: 2.2, ease: 'power2.inOut', delay: 0.35 });
gsap.to('#loader', { autoAlpha: 0, duration: 0.9, delay: 0.5, ease: 'power2.out' });
gsap.to('#ui', { opacity: 1, duration: 1.4, delay: 1.1, ease: 'power2.out' });
gsap.to('#tweaks', { opacity: 1, duration: 1.2, delay: 1.3, ease: 'power2.out' });
</script>
