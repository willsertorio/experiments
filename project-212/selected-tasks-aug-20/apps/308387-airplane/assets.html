<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { LUTPass } from 'three/addons/postprocessing/LUTPass.js';
import { LUTCubeLoader } from 'three/addons/loaders/LUTCubeLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* ============================== CONSTANTS / STATE ============================== */
const FT = 0.3048, KT = 1.94384, D2R = Math.PI/180, R2D = 180/Math.PI;
const WORLD = 40960, HWORLD = WORLD/2, HN = 768;           // terrain extent / heightmap res
const SUN_AZ = 120*D2R, SUN_EL = 26*D2R;                    // morning sun, ESE
const sunDir = new THREE.Vector3(Math.sin(SUN_AZ)*Math.cos(SUN_EL), Math.sin(SUN_EL), -Math.cos(SUN_AZ)*Math.cos(SUN_EL)).normalize();

const LAKE  = {x:-4800, z:6300, rx:900, rz:1250, level:600};
const STRIP = {x:-4300, z:5200, hdg:60*D2R, elev:640, len:720, w:24};
const VILLAGES = [
  {x:-4400, z:4600, elev:680, r:250, name:'Weesen'},    // lakeside, ~6.5 km off the left wing at the start
  {x:-450, z:1500, elev:862, r:200, name:'Amden'},
  {x:2000,  z:80,   elev:1082, r:170, name:'Celerina'}
];
const RIVER = [ // x, z, floor elevation
  [5200,-2600,1500],[3800,-1200,1280],[2200,200,1080],[400,1400,900],
  [-1400,2200,820],[-2500,2500,780],[-3600,3400,756],[-4400,5200,635],
  [-5200,7400,560],[-6000,11000,470],[-6800,16000,400]
];
const PEAKS = [
  {x:1704, z:7408, h:4350, r:5300, s:1.58, p:0.7, horn:1},   // hero massif: 8.5 km off the nose at the start
  {x:6200, z:-4200, h:4350, r:5600, s:1.55, p:0.7, horn:1},
  {x:3600, z:-5600, h:3980, r:4600, s:1.70, p:2.1},
  {x:9200, z:-1800, h:3820, r:4800, s:1.70, p:4.0},
  {x:5200, z:-600,  h:3520, r:3400, s:1.80, p:1.2},
  {x:10800,z:-5200, h:3560, r:4200, s:1.80, p:2.8}
];
const CHAINS = [
  {pts:[[-14000,-9000],[-7000,-7500],[-1000,-8000],[3600,-5600]], amp:2700, w:3400},
  {pts:[[9200,-1800],[13500,-2600],[17000,-800]], amp:2500, w:3800},
  {pts:[[-13500,9500],[-6000,12500],[2500,14500]], amp:2400, w:4400}
];

// Sim state (filled by flight model later; positions in meters, angles rad)
const S = {
  pos: new THREE.Vector3(-6000, 8500*FT, 11000),
  hdg: 56*D2R, pitch: 2.4*D2R, roll: 0,
  v: 52, gamma: 0, chi: 56*D2R,
  rollRate: 0, yawRate: 0, ball: 0, aoa: 2.4*D2R,
  throttle: 0.72, mixture: 0.85, carbHeat: false, rpm: 2350,
  elev: 0, ail: 0, rud: 0, trim: 0, stickF: 0, flapT: 0, flap: 0,
  mags: 3, master: true, fuelL: 26, fuelR: 26,
  baro: 29.92, hiDrift: 0, brake: false,
  stall: false, onGround: false, realism: false, assist: true,
  vsFpm: 0, iasKt: 0, altFt: 8500, gs: 0, oilT: 180, oilP: 75, amp: 12,
  time: 0, buffet: 0, view: 1, photo: false, quality: 2, engineOn: true
};

/* ============================== UTILITIES / NOISE ============================== */
function hash2i(ix, iz){
  let n = (Math.imul(ix,374761393) + Math.imul(iz,668265263))|0;
  n = Math.imul(n ^ (n>>>13), 1274126175);
  return ((n ^ (n>>>16))>>>0)/4294967296;
}
function vnoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z), fx = x-ix, fz = z-iz;
  const ux = fx*fx*fx*(fx*(fx*6-15)+10), uz = fz*fz*fz*(fz*(fz*6-15)+10);
  const a = hash2i(ix,iz), b = hash2i(ix+1,iz), c = hash2i(ix,iz+1), d = hash2i(ix+1,iz+1);
  return a + (b-a)*ux + (c-a)*uz + (a-b-c+d)*ux*uz;
}
function fbm(x, z, oct){
  let s=0, a=1, f=1, n=0;
  for(let i=0;i<oct;i++){ s += a*vnoise(x*f, z*f); n += a; a *= 0.5; f *= 2.03; }
  return s/n;
}
function ridged(x, z, oct){
  let s=0, a=1, f=1, n=0;
  for(let i=0;i<oct;i++){ const r = vnoise(x*f, z*f); const v = 1-Math.abs(2*r-1); s += a*v*v; n += a; a *= 0.5; f *= 2.11; }
  return s/n;
}
function distSeg(px, pz, ax, az, bx, bz){
  const dx=bx-ax, dz=bz-az, L2 = dx*dx+dz*dz;
  let t = L2>0 ? ((px-ax)*dx + (pz-az)*dz)/L2 : 0; t = Math.max(0, Math.min(1, t));
  const cx = ax+dx*t, cz = az+dz*t;
  return {d: Math.hypot(px-cx, pz-cz), t};
}
function smooth(a, b, x){ const t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); }
function lerp(a, b, t){ return a+(b-a)*t; }
function borderProfile(theta){
  return 2300 + 1150*fbm(Math.cos(theta)*2.3+7.3, Math.sin(theta)*2.3+3.1, 4);
}
// closest point on river path -> {d, floor, tglobal}
function valleyAt(x, z){
  let best = {d:1e9, floor:600, tg:0};
  let acc = 0; const lens = [];
  for(let i=0;i<RIVER.length-1;i++){
    const L = Math.hypot(RIVER[i+1][0]-RIVER[i][0], RIVER[i+1][1]-RIVER[i][1]); lens.push(L); acc += L;
  }
  for(let i=0;i<RIVER.length-1;i++){
    const A = RIVER[i], B = RIVER[i+1];
    const r = distSeg(x, z, A[0], A[1], B[0], B[1]);
    if(r.d < best.d){
      let t0 = 0; for(let j=0;j<i;j++) t0 += lens[j];
      best = {d: r.d, floor: lerp(A[2], B[2], r.t), tg: (t0 + lens[i]*r.t)/acc};
    }
  }
  return best;
}

/* ============================== RENDERER / SCENES ============================== */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const worldScene = new THREE.Scene();
const cockpitScene = new THREE.Scene();

/* ============================== IBL / CDN ASSETS ==============================
   Every remote asset is attempted with fallbacks and the scene stays correct if they
   all fail. ASSETS records what actually resolved; check the console for the report. */
const ASSETS = {env:null, envSource:'', lut:null, lutSource:'', metalNrm:null, metalRough:null};
const CDN3 = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/';
const PH = 'https://dl.polyhaven.org/file/ph-assets/';
function firstThatLoads(loader, urls, label){
  return new Promise(resolve=>{
    let i = 0;
    const next = ()=>{
      if(i >= urls.length){ console.warn('[assets] '+label+': none reachable, using procedural fallback'); resolve(null); return; }
      const url = urls[i++];
      loader.load(url, d=>{ console.log('[assets] '+label+' <- '+url); d.__src = url; resolve(d); }, undefined, ()=>next());
    };
    next();
  });
}
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
// Procedural fallback sky built from this scene's OWN colours, so the sun position and
// sky tint always agree with the analytic sun even with no network at all.
function proceduralEnv(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0.00, '#4b83cf');
  grd.addColorStop(0.42, '#a6c6e6');
  grd.addColorStop(0.52, '#e6ebf0');
  grd.addColorStop(0.68, '#8d9484');
  grd.addColorStop(1.00, '#474c42');
  g.fillStyle = grd; g.fillRect(0,0,512,256);
  const sx = (0.5 + SUN_AZ/(Math.PI*2))*512, sy = (0.5 - SUN_EL/Math.PI)*256;
  const sg = g.createRadialGradient(sx, sy, 2, sx, sy, 80);
  sg.addColorStop(0, '#fffdf2');
  sg.addColorStop(0.22, 'rgba(255,246,220,0.6)');
  sg.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = sg; g.fillRect(0,0,512,256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
(async ()=>{
  // A soft open-sky map on purpose: IBL provides ambient and reflections while the
  // analytic sun stays the key light. A map with its own hard sun would double the
  // highlight and point it the wrong way, since r160 has no environmentRotation.
  const hdr = await firstThatLoads(new RGBELoader(), [
    PH + 'HDRIs/hdr/1k/kloofendal_43d_clear_puresky_1k.hdr',
    PH + 'HDRIs/hdr/1k/qwantani_puresky_1k.hdr',
    CDN3 + 'textures/equirectangular/quarry_01_1k.hdr',
    CDN3 + 'textures/equirectangular/venice_sunset_1k.hdr',
    CDN3 + 'textures/equirectangular/royal_esplanade_1k.hdr'
  ], 'HDRI environment');
  const src = hdr || proceduralEnv();
  ASSETS.envSource = hdr ? hdr.__src : 'procedural';
  src.mapping = THREE.EquirectangularReflectionMapping;
  ASSETS.env = pmrem.fromEquirectangular(src).texture;
  worldScene.environment = ASSETS.env;
  cockpitScene.environment = ASSETS.env;
  src.dispose();
})();
const camWorld = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.5, 400000);
const camPanel = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.02, 60);

const sunLightW = new THREE.DirectionalLight(0xfff0d8, 2.8); sunLightW.position.copy(sunDir).multiplyScalar(100); worldScene.add(sunLightW);
const hemiW = new THREE.HemisphereLight(0xbcd6ff, 0x55614a, 0.85); worldScene.add(hemiW);
const sunLightC = new THREE.DirectionalLight(0xfff0d8, 2.6); cockpitScene.add(sunLightC); cockpitScene.add(sunLightC.target);
const hemiC = new THREE.HemisphereLight(0xcfe0f5, 0x5d636c, 2.4); cockpitScene.add(hemiC);

/* ============================== SKY ============================== */
{
  const skyGeo = new THREE.SphereGeometry(350000, 32, 16);
  // The cloud photo is a RECTILINEAR frame, not an equirectangular panorama, so it cannot be
  // wrapped on the dome directly -- spherical UVs would smear it and leave a seam. Instead its
  // two axes are used for what they physically are: its vertical axis is real elevation (pale
  // haze at the bottom, deep blue at the top, which is how sky actually gradates), and its
  // horizontal axis is swept round azimuth on MirroredRepeat so the joins fold back on
  // themselves. It also contains no sun, so the analytic disc and glow stay on top and the sky
  // keeps agreeing with the directional light and the terrain shading.
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms: {
      uSun: {value: sunDir}, uSkyTex: {value: null},
      uSkyMix: {value: 0},        // 0 until the photo decodes, so there is no black-sky flash
      uAzScale: {value: 2.4}      // one photo width per 150 deg of azimuth
    },
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vD; uniform vec3 uSun;
      uniform sampler2D uSkyTex; uniform float uSkyMix; uniform float uAzScale;
      void main(){
        float h = clamp(vD.y, -0.08, 1.0);
        vec3 zen = vec3(0.10,0.30,0.62);
        vec3 mid = vec3(0.42,0.62,0.86);
        vec3 hor = vec3(0.83,0.88,0.95);
        vec3 col = mix(hor, mid, smoothstep(0.0,0.18,h));
        col = mix(col, zen, smoothstep(0.12,0.65,h));
        if(uSkyMix > 0.001){
          float az = atan(vD.x, -vD.z);
          float el = asin(clamp(vD.y, -1.0, 1.0))/1.5707963;
          vec2 uv = vec2(az/6.2831853*uAzScale, pow(clamp(el, 0.0, 1.0), 0.85));
          vec3 ph = texture2D(uSkyTex, uv).rgb;
          // Graded off full midday saturation and warmed a touch, so a noon photo sits with
          // this scene's warm 26-deg sun instead of fighting it.
          ph = mix(vec3(dot(ph, vec3(0.299,0.587,0.114))), ph, 0.88)*vec3(1.04,1.00,0.93);
          // Hand back to the analytic gradient at the horizon, so the sky still meets the
          // terrain on exactly the haze colour the terrain shader fades into.
          col = mix(col, ph, smoothstep(0.015, 0.20, h)*uSkyMix);
        }
        float sd = max(dot(vD, uSun), 0.0);
        col += vec3(1.0,0.85,0.6)*pow(sd, 600.0)*6.0;      // disc
        col += vec3(1.0,0.80,0.55)*pow(sd, 24.0)*0.35;     // glow
        col += vec3(1.0,0.72,0.45)*pow(sd, 5.0)*0.12*(1.0-smoothstep(0.0,0.35,h));
        col = mix(col, vec3(0.98,0.93,0.85), smoothstep(0.02,-0.08,h)*0.6); // below-horizon haze
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  new THREE.TextureLoader().load('uploads/pexels-photo-912110.jpeg', t=>{
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.MirroredRepeatWrapping;      // azimuth folds back instead of seaming
    t.wrapT = THREE.ClampToEdgeWrapping;         // elevation must not wrap at the zenith
    t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    t.needsUpdate = true;
    skyMat.uniforms.uSkyTex.value = t;
    skyMat.uniforms.uSkyMix.value = 0.9;
    ASSETS.sky = 'uploads/pexels-photo-912110.jpeg';
    console.log('[assets] sky photo <- uploads/pexels-photo-912110.jpeg (' + t.image.width + 'x' + t.image.height + ')');
  }, undefined, ()=>console.warn('[assets] sky photo failed - keeping the analytic gradient'));
  const sky = new THREE.Mesh(skyGeo, skyMat);
  sky.frustumCulled = false;
  worldScene.add(sky);
  worldScene.userData.sky = sky;
  worldScene.userData.skyMat = skyMat;
}

/* ============================== HEIGHTFIELD ============================== */
const hmap = new Uint8Array(HN*HN*4);
const hmapF = new Float32Array(HN*HN);
function genHeight(){
  for(let j=0;j<HN;j++){
    const wz = (j/(HN-1)-0.5)*WORLD;
    for(let i=0;i<HN;i++){
      const wx = (i/(HN-1)-0.5)*WORLD;
      // domain-warped ridged base
      const wxq = wx + 1500*(fbm(wx*0.000045+3.1, wz*0.000045+8.7, 3)-0.5)*2;
      const wzq = wz + 1500*(fbm(wx*0.000045+9.4, wz*0.000045+2.2, 3)-0.5)*2;
      let h = 2350*Math.pow(ridged(wxq*0.00011, wzq*0.00011, 5), 1.55) + 480*fbm(wx*0.0006, wz*0.0006, 3);
      // ridge chains
      for(const c of CHAINS){
        let dmin = 1e9;
        for(let k=0;k<c.pts.length-1;k++){
          const r = distSeg(wx, wz, c.pts[k][0], c.pts[k][1], c.pts[k+1][0], c.pts[k+1][1]);
          dmin = Math.min(dmin, r.d);
        }
        const m = Math.max(0, 1-dmin/c.w);
        const serr = 0.55 + 0.75*ridged(wx*0.00035+11.7, wz*0.00035+5.3, 3);
        h = Math.max(h, c.amp*m*m*serr + 300*m);
      }
      // hero peaks
      for(const p of PEAKS){
        const dx = wx-p.x, dz = wz-p.z, d = Math.hypot(dx, dz);
        if(d < p.r){
          let f = Math.pow(1-d/p.r, p.s);
          if(p.horn){
            const th = Math.atan2(dz, dx);
            f *= 1 + 0.16*Math.cos(4*th + p.p)*(1-d/p.r);   // 4-arête horn
          }
          f *= 0.82 + 0.36*ridged(wx*0.0009+p.p, wz*0.0009, 3);
          const pk = p.h*f + 400*(1-d/p.r);
          h = Math.max(h, pk);
        }
      }
      // valley carve along river
      const v = valleyAt(wx, wz);
      const vw = 520 + 1150*v.tg;
      const m = 1 - smooth(vw*0.18, vw, v.d);
      const floor = v.floor + 26*fbm(wx*0.001, wz*0.001, 2);
      h = lerp(h, Math.min(h, floor + (v.d/vw)*(v.d/vw)*180), m);
      // river channel
      h -= 3.5*(1-smooth(0, 16, v.d));
      // lake
      const ldx = (wx-LAKE.x)/LAKE.rx, ldz = (wz-LAKE.z)/LAKE.rz;
      let dd = Math.sqrt(ldx*ldx + ldz*ldz);
      dd *= 0.88 + 0.26*fbm(wx*0.0013+31.7, wz*0.0013+5.3, 3);   // ragged shoreline, not a drawn ellipse
      // One continuous basin profile through the waterline: level-18 at the centre, exactly
      // level at dd=1, rising beyond. Carving the bed to level-3 and the rim to level+3 left
      // a 6 m cliff ring at dd=1 -- it staircased the shoreline at texel size, and lit
      // face-on by the low sun it clipped to white, reading as a snow ring round the lake.
      if(dd < 1.4){
        const bedH = LAKE.level + 18*(dd*dd - 1);
        if(dd < 1) h = Math.min(h, bedH);
        else h = lerp(h, Math.max(h, bedH), 1-smooth(1.0, 1.4, dd));
      }
      // airstrip plateau
      {
        const sdx = wx-STRIP.x, sdz = wz-STRIP.z;
        const ca = Math.cos(STRIP.hdg), sa = Math.sin(STRIP.hdg);
        const lx = sdx*ca - sdz*sa, lz = sdx*sa + sdz*ca;
        const mS = (1-smooth(STRIP.len/2, STRIP.len/2+90, Math.abs(lx))) * (1-smooth(60, 170, Math.abs(lz)));
        h = lerp(h, STRIP.elev, mS*0.96);
      }
      // villages
      for(const vl of VILLAGES){
        const d = Math.hypot(wx-vl.x, wz-vl.z);

    }

/* ============================== ROADS + VEHICLES ============================== */
const roadPts = [];
{
  // The valley road follows the river, offset to one bank. The lake sits in that valley, so
  // the road has to go AROUND it. Projecting each inside-point radially doesn't work: the
  // direction flips either side of the centre, so a crossing becomes a straight chord
  // between two near-opposite shore points. Instead, find each contiguous run of samples
  // inside the basin and replace it with an arc along the shore, sweeping the short way
  // from where the road enters to where it leaves.
  const LKM = 1.20;
  const nrm = (x,z)=>[(x-LAKE.x)/(LAKE.rx*LKM), (z-LAKE.z)/(LAKE.rz*LKM)];
  const lakeR = (x,z)=>{ const [a,b] = nrm(x,z); return Math.hypot(a,b); };
  const ang = (x,z)=>{ const [a,b] = nrm(x,z); return Math.atan2(b,a); };
  const onShore = th => [LAKE.x + Math.cos(th)*LAKE.rx*LKM, LAKE.z + Math.sin(th)*LAKE.rz*LKM];
  const raw = [];
  for(let i=0;i<RIVER.length;i++){
    const A = RIVER[Math.max(0,i-1)], B = RIVER[Math.min(RIVER.length-1,i+1)];
    let dx = B[0]-A[0], dz = B[1]-A[1]; const L = Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const side = (i%4<2)? 1 : -1;
    raw.push([RIVER[i][0] + (-dz)*75*side, RIVER[i][1] + dx*75*side]);
  }
  const pts = [];
  for(let i=0;i<raw.length-1;i++)
    for(let k=0;k<12;k++){
      const t = k/12;
      pts.push([raw[i][0]+(raw[i+1][0]-raw[i][0])*t, raw[i][1]+(raw[i+1][1]-raw[i][1])*t]);
    }
  pts.push(raw[raw.length-1]);
  const inside = pts.map(p=>lakeR(p[0],p[1]) < 1);
  for(let i=0;i<pts.length;i++){
    if(!inside[i]) continue;
    let j = i; while(j < pts.length && inside[j]) j++;      // run is [i, j)
    const th0 = ang(...(pts[i-1] || pts[i]));
    const th1 = ang(...(pts[j]   || pts[j-1]));
    let d = th1 - th0;
    while(d >  Math.PI) d -= 2*Math.PI;                     // sweep the short way round
    while(d < -Math.PI) d += 2*Math.PI;
    const n = j - i;
    for(let k=0;k<n;k++) pts[i+k] = onShore(th0 + d*((k+1)/(n+1)));
    i = j - 1;
  }
  for(const [x,z] of pts) roadPts.push(new THREE.Vector3(x, 0, z));
  for(const p of roadPts) p.y = terrainHeight(p.x, p.z)+0.45;
}
const roadLen = []; { let a=0; for(let i=0;i<roadPts.length-1;i++){ a += roadPts[i].distanceTo(roadPts[i+1]); roadLen.push(a);} }
function roadPoint(s, out){
  s = Math.max(0, Math.min(roadLen[roadLen.length-1]-0.01, s));
  let i = 0; while(i < roadLen.length-1 && roadLen[i+1] < s) i++;
  const t = (s - (i? roadLen[i-1] : 0))/(roadLen[i] - (i? roadLen[i-1] : 0) || 1);
  const A = roadPts[i], B = roadPts[i+1];
  out.pos.lerpVectors(A, B, t);
  out.dir.subVectors(B, A).normalize();
  return out;
}

    let dx = B.x-A.x, dz = B.z-A.z; const L = Math.hypot(dx,dz)||1;

function loftGeo(stations, exp=0.62, n=14, t0=0, t1=Math.PI*2, capS=true, capE=true){
  // A partial theta range must NOT wrap the last vertex back to the first: that closing
  // quad slices straight across the section (it is what turned the window glass into a
  // dark sheet spanning the cabin). Open arcs get an extra vertex and no wrap instead.
  const closed = Math.abs((t1-t0) - Math.PI*2) < 1e-6;
  const m = closed ? n : n+1;        // vertices per station
  const lim = closed ? n : m-1;      // quads per station gap
  const pos = [], idx = [];
  for(let s=0;s<stations.length;s++){
    const st = stations[s];
    for(let i=0;i<m;i++){
      const th = t0 + (t1-t0)*(closed ? i/n : i/(m-1));
      const c = Math.cos(th), sn = Math.sin(th);
      const x = st.cx + st.rx*Math.sign(c)*Math.pow(Math.abs(c), exp);
      const y = st.cy + st.ry*Math.sign(sn)*Math.pow(Math.abs(sn), exp);
      pos.push(x, y, st.z);
    }
  }
  for(let s=0;s<stations.length-1;s++){
    for(let i=0;i<lim;i++){
      const a = s*m+i, b = s*m+(i+1)%m, c = a+m, d = b+m;
      idx.push(a,b,c, b,d,c);
    }
  }
  if(capS){ const c0 = pos.length/3; const st = stations[0]; pos.push(st.cx, st.cy, st.z);
    for(let i=0;i<lim;i++) idx.push(c0, (i+1)%m, i); }
  if(capE){ const c1 = pos.length/3; const st = stations[stations.length-1]; pos.push(st.cx, st.cy, st.z);
    const off = (stations.length-1)*m; for(let i=0;i<lim;i++) idx.push(c1, off+i, off+(i+1)%m); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function colorize(geo, fn){

    cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
}

let ktx2Shared = null;
function makeGLTFLoader(){
  const l = new GLTFLoader();

function installAirframe(gl){

    const m = o.material;
    if(!m) return;
    if(m.map){ m.map.anisotropy = 8; m.map.colorSpace = THREE.SRGBColorSpace; }
    m.envMapIntensity = 1.15;
    m.side = THREE.FrontSide;
    // Only override shading constants when the asset carries no PBR maps of its own. The
    // Tripo scan ships flat roughness 0.9 / metalness 0, which reads as chalk; a properly
    // authored model has metalnessMap/roughnessMap and must be left alone.
    if(!m.roughnessMap && !m.metalnessMap){ m.roughness = 0.45; m.metalness = 0.08; }
    if(/window|glass|canopy/i.test(m.name||'')){
      m.transparent = true; m.opacity = 0.42; m.roughness = 0.06;
      m.metalness = 0.0; m.side = THREE.DoubleSide; m.depthWrite = false;
    }

  if(propNode){
    const p = propNode.position;
    if(Math.abs(p.z) >= Math.abs(p.x)){ holder.rotation.y = p.z > 0 ? Math.PI : 0; spanAxis = size.x; }
    else { holder.rotation.y = p.x > 0 ? -Math.PI/2 : Math.PI/2; spanAxis = size.z; }
  } else {
    if(size.z > size.x) holder.rotation.y = -Math.PI/2;
    spanAxis = Math.max(size.x, size.z);
  }
  holder.scale.setScalar(11.0/spanAxis);

  // panel can be fitted to THIS model rather than to the old procedural cabin.

                  new THREE.Matrix4().multiplyMatrices(invH, o.matrixWorld));
      const b = o.geometry.boundingBox.clone().applyMatrix4(M);
      const n = o.material.name || 'unnamed';

    // just forward of the seat back. Hide the model's moulded instruments so our live
    // six-pack is the only panel in the cabin.

    if(seat){

        seat.min.x + (seat.max.x - seat.min.x)*0.25,
        seat.max.y - 0.12,
        seat.max.z - 0.36);

        ' y['+b.min.y.toFixed(2)+','+b.max.y.toFixed(2)+']'+

/* ---- procedural propeller: ogive spinner + two twisted blades + motion-blur disc ---- */
function buildProp(R, spinR, spinL){
  const grp = new THREE.Group();
  const prof = [];
  for(let i=0;i<=12;i++){ const t = i/12; prof.push(new THREE.Vector2(spinR*Math.pow(t,0.58), -spinL*(1-t))); }
  const spinner = new THREE.Mesh(new THREE.LatheGeometry(prof, 24),
    new THREE.MeshPhysicalMaterial({color:0xa81f26, metalness:0.10, roughness:0.34,
      clearcoat:0.65, clearcoatRoughness:0.14, envMapIntensity:0.85}));
  spinner.rotation.x = Math.PI/2;                  // lathe axis Y -> aircraft forward -Z
  grp.add(spinner);
  // blade: 4-point aerofoil section swept along the radius, tapering and untwisting
  const N = 18, SEC = 4;
  const pos = [], col = [], idx = [];
  const body = new THREE.Color(0x15171b), tip = new THREE.Color(0xe8bb14);
  const r0 = spinR*0.72;
  for(let i=0;i<=N;i++){
    const t = i/N;
    const r = r0 + (R-r0)*t;
    const chord = (0.050 + 0.112*Math.sin(Math.PI*Math.pow(t,0.68)))*(1-0.30*t);
    const th = 0.020*(1-t) + 0.0035;
    const tw = (33 - 28*t)*Math.PI/180;
    const ct = Math.cos(tw), st = Math.sin(tw);
    const sect = [[chord*0.60,0], [-chord*0.36, th*0.5], [-chord*0.44,0], [-chord*0.36,-th*0.5]];
    for(const [u,v] of sect){
      pos.push(u*ct - v*st, r, u*st + v*ct);
      const c = t > 0.87 ? tip : body;
      col.push(c.r, c.g, c.b);
    }
  }
  for(let i=0;i<N;i++){
    const a = i*SEC, b = (i+1)*SEC;
    for(let k=0;k<SEC;k++){
      const k2 = (k+1)%SEC;
      idx.push(a+k, b+k, a+k2, a+k2, b+k, b+k2);
    }
  }
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  bg.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  bg.setIndex(idx); bg.computeVertexNormals();
  const bladeMat = new THREE.MeshPhysicalMaterial({vertexColors:true, metalness:0.88,

  const discMat = propDisc.material.clone();

    gltfAC.userData.prop = null;
    console.log('[gltf] using asset propeller node');
  } else {
  // Replace the scan's welded-in spinner and blades. All of this is measured in the
  // model's OWN local space: the aircraft group is translated thousands of metres as it
  // flies, so world-space bounds taken here race the flight loop and come back empty.
  holder.updateMatrix(); root.updateMatrix();
  const M = new THREE.Matrix4().multiplyMatrices(holder.matrix, root.matrix);
  const parts = [], rawBox = new THREE.Box3();
  root.traverse(o=>{
    if(!o.isMesh) return;
    o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrix);
    parts.push([o, b]); rawBox.union(b);
  });
  const full = rawBox.clone().applyMatrix4(M);
  const cutZ = full.min.z + 0.34;                 // forward 0.34 m is spinner + blades
  const hid = new THREE.Box3(), c3 = new THREE.Vector3();
  for(const [o, b] of parts){
    const wb = b.clone().applyMatrix4(M);
    wb.getCenter(c3);
    if(c3.z < cutZ){ o.visible = false; hid.union(wb); }
  }
  const hs = hid.isEmpty() ? new THREE.Vector3(0.3,0.3,0.25) : hid.getSize(new THREE.Vector3());
  const hc = hid.isEmpty() ? new THREE.Vector3(0, full.min.y*0.2, full.min.z+0.2) : hid.getCenter(new THREE.Vector3());
  const spinR = Math.max(0.11, Math.min(hs.x, hs.y)*0.5);
  const spinL = Math.max(0.20, hs.z);
  const gprop = buildProp(0.95, spinR, spinL);
  gprop.position.set(hc.x, hc.y, (hid.isEmpty()? full.min.z+0.3 : hid.max.z));
  gltfAC.add(gprop);
  gltfAC.userData.prop = gprop;

              ' at '+[gprop.position.x,gprop.position.y,gprop.position.z].map(v=>v.toFixed(2)).join(','));
  }
  gltfReady = true;
  console.log('[gltf] meshes='+meshes+' raw size='+[size.x,size.y,size.z].map(v=>v.toFixed(2)).join(' x ')+

// interpolate the fuselage section at any z, so glass and decals can be built ON the skin
// rather than guessed at — a flat plane over a tapering tailcone floats off it
function fusAt(z){
  if(z <= FUS_ST[0].z) return FUS_ST[0];
  for(let i=1;i<FUS_ST.length;i++){
    if(z <= FUS_ST[i].z){
      const p = FUS_ST[i-1], q = FUS_ST[i], t = (z-p.z)/(q.z-p.z);
      return {cx:p.cx+(q.cx-p.cx)*t, cy:p.cy+(q.cy-p.cy)*t,
              rx:p.rx+(q.rx-p.rx)*t, ry:p.ry+(q.ry-p.ry)*t};
    }
  }
  return FUS_ST[FUS_ST.length-1];
}
function skinPt(z, th, off){
  const st = fusAt(z), c = Math.cos(th), s = Math.sin(th);
  const rx = st.rx+off, ry = st.ry+off;
  return [st.cx + rx*Math.sign(c)*Math.pow(Math.abs(c),0.62),
          st.cy + ry*Math.sign(s)*Math.pow(Math.abs(s),0.62), z];
}
// glass band that hugs the skin at a given offset
function glassBand(zs, th0, th1, off){
  return loftGeo(zs.map(z=>{ const st = fusAt(z);
    return {z, cx:st.cx, cy:st.cy, rx:st.rx+off, ry:st.ry+off}; }),
    0.62, 12, th0, th1, false, false);
}
// curved decal patch lying on the skin. thA/thB may be numbers or functions of t (0..1
// along z), which is what lets a cheatline sweep upward toward the tail.
function skinDecal(map, z0, z1, thA, thB, off, flipU, NZ){
  const fA = typeof thA === 'function' ? thA : ()=>thA;
  const fB = typeof thB === 'function' ? thB : ()=>thB;
  NZ = NZ || 12;
  const NT = 4, pos = [], uv = [], idx = [];
  for(let i=0;i<=NZ;i++){
    const tz = i/NZ, z = z0 + (z1-z0)*tz, a = fA(tz), b = fB(tz);
    for(let j=0;j<=NT;j++){
      const tt = j/NT;
      pos.push(...skinPt(z, a + (b-a)*tt, off));
      uv.push(flipU ? 1-tz : tz, tt);
    }
  }
  for(let i=0;i<NZ;i++) for(let j=0;j<NT;j++){
    const a = i*(NT+1)+j, b = a+1, c = a+NT+1, d = c+1;
    idx.push(a,c,b, b,c,d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({map, transparent:true,
    side:THREE.DoubleSide, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-2}));
}

// Scanned control yoke. The asset is a raw single-mesh scan with no named parts and no
// agreed axis convention, so it is fitted algorithmically: rotate into cockpit axes, scale
// by measured horn span, then anchor the grips where the procedural hub used to sit. Every
// number below is a real dimension, not a magic offset, so a different scan re-fits itself.
// Measured from the scan itself (vertex banding along each axis): model +Y runs mount->handle,
// model Z is the horn span, model X the horn sweep. The cyclic rotation below sends
// span->cockpit X, column->cockpit Z (handle aft toward the pilot), sweep->cockpit Y.
// Span and grip distance are set against THIS cabin rather than a real C172: the procedural
// interior rides 1.2 m forward to meet the glTF dash, so the yoke is sized to subtend the
// same share of the frame a real one does next to this panel, and its column then lands on
// the panel plane instead of floating.
const YOKE_FIT = { rot:[Math.PI/2, Math.PI/2, 0], span:0.38, gripZ:0.25, hubY:0.0 };
makeGLTFLoader().load('uploads/cessna-control-yoke-3d-model-fast-medium.glb', gl=>{
  const o = gl.scene;
  o.rotation.set(YOKE_FIT.rot[0], YOKE_FIT.rot[1], YOKE_FIT.rot[2]);
  o.updateMatrixWorld(true);
  const raw = new THREE.Box3().setFromObject(o), rs = raw.getSize(new THREE.Vector3());
  const s = YOKE_FIT.span / rs.x;
  o.scale.setScalar(s);
  o.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(o), ctr = box.getCenter(new THREE.Vector3());
  o.position.set(-ctr.x, YOKE_FIT.hubY - ctr.y, YOKE_FIT.gripZ - box.max.z);
  o.traverse(n=>{
    if(!n.isMesh) return;
    n.frustumCulled = false;
    const m = n.material; if(!m) return;
    if(m.map){ m.map.anisotropy = 8; m.map.colorSpace = THREE.SRGBColorSpace; }
    m.envMapIntensity = 0.9;
    m.side = THREE.FrontSide;
    // The scan ships metalness 1 / roughness 1 with a photogrammetry MR map, which renders
    // as a black silhouette in a shaded cabin — and at high env intensity it mirrors the sky
    // and turns blue. Clamp both factors (the maps still modulate) and self-light it through
    // its OWN albedo, so the lift keeps the scanned detail instead of flooding it with colour.
    m.roughness = 0.62; m.metalness = 0.12;
    m.emissiveMap = m.map;
    m.emissive = new THREE.Color(0x686d75); m.emissiveIntensity = 1;
  });
  yokeProc.visible = false;
  yokeGroup.add(o);
  console.log('[yoke] scanned model fitted — raw '+[rs.x,rs.y,rs.z].map(v=>v.toFixed(3)).join(' x ')+
              ' scale='+s.toFixed(4)+' span='+YOKE_FIT.span+'m');
}, undefined, e=>console.warn('[yoke] load failed, keeping procedural yoke', e));

    const m = new THREE.Mesh(pg, glassMat);

  }
  for(const s of [-1,1]){
    pane([0,0.28,-0.52], [s*0.78,0.25,-0.50], [s*0.66,0.73,-0.18], [0,0.71,-0.20]);   // windshield half

/* ============================== INSTRUMENTS ============================== */
const GAUGES = [];
const INS = { ias:89, vsi:0, ball:0, comp: S.hdg, bug: 56*D2R, hiDrift: 0 };
function faceCanvas(size, fn){
  const c = document.createElement('canvas'); c.width = c.height = size;
  fn(c.getContext('2d'), size);
  return c;
}
function pol(cx, cy, r, aDeg){ const a = aDeg*D2R; return [cx + r*Math.sin(a), cy - r*Math.cos(a)]; }
// gauge-space arc: takes dial degrees in any order (a reversed range makes ctx.arc sweep the long way)
function arcSeg(ctx, c, R, a0, a1, col, w){
  ctx.beginPath();
  ctx.arc(c, c, R, (Math.min(a0,a1)-90)*D2R, (Math.max(a0,a1)-90)*D2R);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function needle(ctx, cx, cy, aDeg, len, w, tail, col){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(aDeg*D2R);
  ctx.beginPath();
  ctx.moveTo(-w, tail); ctx.lineTo(-w*0.35, -len*0.55); ctx.lineTo(0, -len); ctx.lineTo(w*0.35, -len*0.55); ctx.lineTo(w, tail);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}
function sheenStatic(ctx, cx, cy, r, k){
  k = (k === undefined) ? 1 : k;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  // keep this weak: a strong off-centre highlight plus a dark opposite rim reads
  // as the dial being misregistered inside its bezel, especially on small gauges
  const g = ctx.createRadialGradient(cx-r*0.30, cy-r*0.36, r*0.1, cx, cy, r*1.25);
  g.addColorStop(0, `rgba(255,255,255,${0.055*k})`);
  g.addColorStop(0.55, `rgba(255,255,255,${0.012*k})`);
  g.addColorStop(1, `rgba(0,0,0,${0.045*k})`);
  ctx.fillStyle = g; ctx.fillRect(cx-r, cy-r, r*2, r*2);
  // the pilot-side window, reflected in the glass: a narrow raked streak, not a blob
  ctx.translate(cx - r*0.34, cy - r*0.40);
  ctx.rotate(-0.40);
  ctx.scale(1, 0.22);
  const w = ctx.createRadialGradient(0, 0, 0, 0, 0, r*0.60);
  w.addColorStop(0, `rgba(228,240,255,${0.17*k})`);
  w.addColorStop(0.55, `rgba(228,240,255,${0.06*k})`);
  w.addColorStop(1, 'rgba(228,240,255,0)');
  ctx.fillStyle = w;
  ctx.beginPath(); ctx.arc(0, 0, r*0.60, 0, 7); ctx.fill();
  ctx.restore();
}
function glareStreak(ctx, cx, cy, r, ang, inten){
  if(inten < 0.02) return;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  ctx.translate(cx, cy); ctx.rotate(ang);
  const g = ctx.createLinearGradient(-r, 0, r, 0);
  g.addColorStop(0, 'rgba(255,252,240,0)');
  g.addColorStop(0.5, `rgba(255,252,240,${0.16*inten})`);
  g.addColorStop(1, 'rgba(255,252,240,0)');
  ctx.fillStyle = g; ctx.fillRect(-r*1.6, -r*1.6, r*3.2, r*3.2);
  ctx.restore();
}
function bezel(ctx, s, label){
  const c = s/2;
  ctx.beginPath(); ctx.arc(c, c, s*0.492, 0, 7);
  const g = ctx.createRadialGradient(c, c, s*0.40, c, c, s*0.5);
  g.addColorStop(0, '#26282d'); g.addColorStop(0.8, '#3c4048'); g.addColorStop(1, '#101114');
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.arc(c, c, s*0.465, 0, 7); ctx.fillStyle = '#0d0e11'; ctx.fill();
  if(label){ ctx.fillStyle = '#aab0ba'; ctx.font = `600 ${s*0.052}px Helvetica`; ctx.textAlign = 'center'; ctx.fillText(label, c, s*0.72); }
}
function makeGauge(key, size, radius, drawer, faceFn, overFn){
  const face = faceCanvas(size, (ctx, s)=>{ bezel(ctx, s); if(faceFn) faceFn(ctx, s); });
  const over = overFn ? faceCanvas(size, (ctx,s)=>overFn(ctx,s)) : null;
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 40), new THREE.MeshBasicMaterial({map: tex}));
  const p = LAYOUT.pos[key];
  mesh.position.set(p[0], p[1], 0.012);
  panelGroup.add(mesh);
  const G = {key, size, canvas, ctx, tex, face, over, draw: drawer, tick: 0};
  GAUGES.push(G);
  return G;
}
function renderGauge(G, gl){
  const {ctx, size:s} = G, c = s/2;
  ctx.clearRect(0, 0, s, s);
  ctx.drawImage(G.face, 0, 0);
  G.draw(ctx, s, c);
  if(G.over) ctx.drawImage(G.over, 0, 0);
  sheenStatic(ctx, c, c, s*0.465, s < 400 ? 0.5 : 1);
  glareStreak(ctx, c, c, s*0.465, gl.a, gl.i);
  G.tex.needsUpdate = true;
}

/* ---- faces ---- */
function arcFace(ctx, s, vmin, vmax, a0, sweep, nums, minor, arcs, unit, fmt){
  const c = s/2, R = s*0.40;
  const A = v => a0 + (v-vmin)/(vmax-vmin)*sweep;
  ctx.lineCap = 'butt';
  for(const [v0, v1, col, w] of arcs){
    ctx.beginPath();
    ctx.arc(c, c, R, (A(v0)-90)*D2R, (A(v1)-90)*D2R);
    ctx.strokeStyle = col; ctx.lineWidth = s*0.028*w; ctx.stroke();
  }
  for(let v = Math.ceil(vmin/minor)*minor; v <= vmax; v += minor){
    const isN = nums.some(n=>Math.abs(n-v) < minor*0.1);
    const [x1,y1] = pol(c, c, R, A(v)), [x2,y2] = pol(c, c, R - (isN? s*0.064 : s*0.036), A(v));
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle = '#e8ecf2'; ctx.lineWidth = isN? s*0.012 : s*0.007; ctx.stroke();
    if(isN){
      const [tx,ty] = pol(c, c, R - s*0.125, A(v));
      ctx.fillStyle = '#f2f5fa'; ctx.font = `700 ${s*0.082}px Helvetica`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(fmt ? fmt(v) : String(v), tx, ty);
    }
  }
  if(unit){ ctx.fillStyle = '#a8b0bc'; ctx.font = `600 ${s*0.055}px Helvetica`; ctx.textAlign='center'; ctx.fillText(unit, c, s*0.60); }
}

/* TURN COORDINATOR */
makeGauge('tc', 512, LAYOUT.big, (ctx, s, c)=>{
  // airplane silhouette rolls with turn rate
  const defl = THREE.MathUtils.clamp(S.yawRate/(3.0*D2R), -1.6, 1.6)*14;
  ctx.save(); ctx.translate(c, c - s*0.02); ctx.rotate(defl*D2R);
  ctx.fillStyle = '#f2f4f8';
  ctx.fillRect(-s*0.17, -s*0.012, s*0.34, s*0.024);
  ctx.fillRect(-s*0.012, -s*0.05, s*0.024, s*0.10);
  ctx.fillRect(-s*0.05, s*0.028, s*0.10, s*0.014);
  ctx.restore();
  // inclinometer
  const tx = c, ty = c + s*0.30, tw = s*0.30, th = s*0.055;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx-tw, ty); ctx.quadraticCurveTo(tx, ty+th*1.7, tx+tw, ty);
  ctx.lineTo(tx+tw, ty-th); ctx.quadraticCurveTo(tx, ty+th*0.6, tx-tw, ty-th);
  ctx.closePath();
  ctx.fillStyle = 'rgba(120,170,210,0.25)'; ctx.fill();
  ctx.strokeStyle = '#e8ecf2'; ctx.lineWidth = s*0.008; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx, ty-th-s*0.01); ctx.lineTo(tx, ty-th*0.2); ctx.stroke();
  const bx = tx + THREE.MathUtils.clamp(INS.ball,-1.2,1.2)*tw*0.62;
  ctx.beginPath(); ctx.arc(bx, ty-th*0.35, s*0.032, 0, 7);
  ctx.fillStyle = '#0a0a0c'; ctx.fill();
  ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx-s*0.010, ty-th*0.35-s*0.012, s*0.010, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  ctx.restore();
}, (ctx, s)=>{

/* instrument per-frame update */
let frameN = 0;
function updateInstruments(dt){
  frameN++;
  // smoothing / gyro behaviors
  const ias = S.iasKt;
  INS.ias += (ias - INS.ias)*Math.min(1, dt/0.75);
  INS.vsi += (S.vsFpm - INS.vsi)*Math.min(1, dt/1.5);
  INS.ball += (S.ball - INS.ball)*Math.min(1, dt/0.55);
  const compErr = -S.yawRate*0.30;
  let dh = wrapPi((S.hdg + compErr) - INS.comp);
  INS.comp += dh*Math.min(1, dt*1.9);
  INS.hiDrift += 0.05*D2R*dt;  // ~3°/min precession — sped up so the drift is observable
  // glare from relative sun bearing
  const relAz = Math.atan2(Math.sin(SUN_AZ - S.hdg), Math.cos(SUN_AZ - S.hdg));
  const gl = { a: -relAz*0.7, i: Math.max(0, 1-Math.abs(relAz)/1.35) };
  for(const G of GAUGES){
    if(G.draw.length === 0){ G.draw(); continue; }          // compass/gps style
    const small = ['fuel','oil','amp','clock'].includes(G.key);
    if(small && frameN%3) continue;
    renderGauge(G, gl);
  }
}
/* ============================== FLIGHT MODEL ============================== */
const MASS = 1043, WING_S = 16.2, GRAV = 9.81;
const FLAP_CL = [0, 0.32, 0.62, 0.85], FLAP_CD = [0, 0.02, 0.06, 0.12];
const input = { elev:0, ail:0, rud:0 };
const keys = {};
let mouseYoke = false;
function airDensity(h){ return 1.225*Math.pow(Math.max(0.1, 1-2.2558e-5*h), 4.256); }
function wrapPi(a){
  if(!isFinite(a)) return 0;
  a %= 2*Math.PI;
  if(a > Math.PI) a -= 2*Math.PI;
  if(a < -Math.PI) a += 2*Math.PI;
  return a;
}

const START = {x:-6000, y:8500*FT, z:11000, hdg:56*D2R, v:52};
function resetFlight(msg){
  if(S._resetting) return;
  S._resetting = true;
  const f = document.getElementById('fade');
  f.style.opacity = 1;
  setTimeout(()=>{
    S._resetting = false;
    S.pos.set(START.x, START.y, START.z);
    S.hdg = S.chi = START.hdg; S.v = START.v; S.gamma = 0;
    S.pitch = 2.4*D2R; S.roll = 0; S.rollRate = 0; S.yawRate = 0; S.ball = 0;
    S.throttle = 0.72; S.trim = 0; S.flapT = 0; S.flap = 0; S.onGround = false; S.stall = false;
    f.style.opacity = 0;
    if(msg) showMsg(msg);
  }, 480);
}
let msgT = null;
function showMsg(t){
  const m = document.getElementById('msg');
  m.textContent = t; m.style.opacity = 1;
  clearTimeout(msgT); msgT = setTimeout(()=> m.style.opacity = 0, 3200);
}
function toast(t){
  const m = document.getElementById('toast');
  m.textContent = t; m.style.opacity = 1;
  clearTimeout(m._t); m._t = setTimeout(()=> m.style.opacity = 0, 2200);
}

function updateFlight(dt){
  // --- control smoothing (yoke has mass) ---
  const rt = Math.min(1, dt*7);
  S.elev += (input.elev - S.elev)*rt;
  S.ail  += (input.ail  - S.ail )*rt;
  S.rud  += (input.rud  - S.rud )*rt;
  S.flap += ((S.master ? S.flapT/3 : S.flap) - S.flap)*Math.min(1, dt*1.4);

  const rho = airDensity(S.pos.y), sigma = rho/1.225;
  // --- engine ---
  const mixOpt = 0.55 + 0.35*sigma;
  let mixF = 1 - 0.10*Math.max(0, S.mixture-mixOpt) - 0.55*Math.max(0, mixOpt-0.15-S.mixture);
  if(S.mixture < 0.22) mixF = 0;
  const fuelOK = (S.fuelL + S.fuelR) > 0.02;
  S.engineOn = S.mags >= 1 && fuelOK && mixF > 0;
  let rpmT;
  if(S.engineOn){
    rpmT = 600 + S.throttle*2500*(0.85+0.15*sigma)*Math.sqrt(Math.max(0.2,mixF));
    if(S.carbHeat) rpmT -= 90;
  } else {
    rpmT = THREE.MathUtils.clamp(S.v*9, 0, 1100); // windmilling
  }
  S.rpm += (rpmT - S.rpm)*Math.min(1, dt*1.1);
  const power = S.engineOn ? 119000*sigma*S.throttle*mixF : 0;
  const thrust = power*0.82/Math.max(S.v, 16);

  // --- angle of attack / attitude ---
  const CLF = [0,0.32,0.62,0.85][Math.round(S.flap*3)];
  const CDF = [0,0.02,0.06,0.12][Math.round(S.flap*3)];
  const aoaT = THREE.MathUtils.clamp(2.2*D2R + S.trim*5*D2R + S.elev*9*D2R + (S.throttle-0.55)*1.1*D2R, -3*D2R, 16.5*D2R);
  S.aoa = aoaT;
  // stick load: the elevator the pilot must hold beyond what trim already carries.
  // Trimming toward the current AoA drives this to zero without changing attitude.
  S.stickF = THREE.MathUtils.clamp((aoaT - (2.2*D2R + S.trim*5*D2R))/(9*D2R), -1, 1);
  const aStall = 14*D2R;
  S.stall = aoaT > aStall && !S.onGround;
  S.buffet = S.stall ? 1 : Math.max(0, (aoaT - 11.5*D2R)/(aStall-11.5*D2R))*0.5;
  const pitchT = S.gamma + aoaT - (S.stall ? 3.5*D2R : 0);
  const pd = pitchT - S.pitch;
  S.pitch += THREE.MathUtils.clamp(pd*Math.min(1, dt*5), -1.2*dt, 1.2*dt);

  // --- roll ---
  const rollRateT = S.ail*1.05*Math.min(1, S.v/28);
  S.rollRate += (rollRateT - S.rollRate)*Math.min(1, dt*4.5);
  if(S.assist && Math.abs(S.ail) < 0.06) S.rollRate += (-S.roll*0.55 - S.rollRate*0.35)*dt*2.2;
  if(S.stall) S.rollRate += (hash2i(Math.floor(S.time*13),5)-0.5)*2.6*dt;
  S.roll = THREE.MathUtils.clamp(S.roll + S.rollRate*dt, -1.35, 1.35);

  // --- aero forces ---
  const q = 0.5*rho*S.v*S.v;
  let CL = 4.6*aoaT + 0.30 + CLF;
  const CLstall = 4.6*aStall + 0.30 + CLF;
  if(aoaT > aStall) CL = Math.max(0.55, CLstall - (aoaT-aStall)*4.5);
  const L = q*WING_S*CL;
  const CD = 0.038 + 0.052*CL*CL + CDF;
  const D = q*WING_S*CD;

  // thermals & ridge turbulence
  const terr = terrainHeight(S.pos.x, S.pos.z);
  const agl = S.pos.y - terr;
  let gustAcc = 0;
  if(agl < 1400){
    const n = terrainNormal(S.pos.x, S.pos.z, 60);
    const sunFace = Math.max(0, n.dot(sunDir)-0.55);
    const patch = vnoise(S.pos.x*0.0008 + S.time*0.02, S.pos.z*0.0008);
    if(patch > 0.52 && terr < 2400) gustAcc += sunFace*3.2*Math.min(1, agl/400)*(1-agl/1500);
    if(agl < 500 && (1-n.y) > 0.30) gustAcc += (vnoise(S.time*0.9, S.pos.x*0.01)-0.5)*2.4*(1-agl/500);
  }
  gustAcc += (vnoise(S.time*0.45, S.pos.z*0.002)-0.5)*0.35;

  // --- translation ---
  const dv = (thrust - D - MASS*GRAV*Math.sin(S.gamma))/MASS;
  const dg = (L*Math.cos(S.roll) - MASS*GRAV*Math.cos(S.gamma))/MASS + gustAcc; // m/s^2
  S.v = Math.max(S.onGround? 0 : 8, S.v + dv*dt);
  if(!S.onGround) S.gamma = THREE.MathUtils.clamp(S.gamma + (dg/Math.max(12,S.v))*dt, -0.7, 0.7);

  // --- yaw / track ---
  const dchiL = L*Math.sin(S.roll)/(MASS*Math.max(12,S.v)*Math.cos(S.gamma));
  let rudEff = S.rud + (S.assist ? -S.ball*0.7 : 0);
  rudEff = THREE.MathUtils.clamp(rudEff, -1, 1);
  const dchi = dchiL + rudEff*0.022*Math.min(1, S.v/40);
  S.chi += dchi*dt;
  S.yawRate += (dchi - S.yawRate)*Math.min(1, dt*3);
  const ballRaw = (GRAV*Math.sin(S.roll)*Math.cos(S.gamma) - S.v*dchi*Math.cos(S.gamma))/GRAV + rudEff*0.35*Math.min(1,S.v/45);
  S.ball = THREE.MathUtils.clamp(ballRaw, -1.3, 1.3);
  const beta = rudEff*0.10;
  S.hdg = S.chi + beta;

  // --- integrate position ---
  const cg = Math.cos(S.gamma);
  S.pos.x += Math.sin(S.chi)*cg*S.v*dt;
  S.pos.z += -Math.cos(S.chi)*cg*S.v*dt;
  S.pos.y += Math.sin(S.gamma)*S.v*dt;

  // --- ground / water ---
  const terr2 = terrainHeight(S.pos.x, S.pos.z);
  const ldx = (S.pos.x-LAKE.x)/LAKE.rx, ldz = (S.pos.z-LAKE.z)/LAKE.rz;
  const inLake = ldx*ldx+ldz*ldz < 1 && terr2 < LAKE.level;
  const floorY = inLake ? LAKE.level : terr2;
  if(S.onGround){
    S.pos.y = floorY + 1.25;
    S.gamma = 0;
    const fric = 0.6 + (S.brake ? 5.5 : 0);
    S.v = Math.max(0, S.v - fric*dt);
    S.chi += rudEff*0.25*dt*Math.min(1, S.v/20);
    S.hdg = S.chi;
    S.roll *= 1 - Math.min(1, dt*4);
    if(L > MASS*GRAV*1.02 && S.v > 24){ S.onGround = false; showMsg('AIRBORNE'); }
  } else if(S.pos.y < floorY + 1.25){
    const vs = Math.sin(S.gamma)*S.v;
    const slope = 1 - terrainNormal(S.pos.x, S.pos.z, 20).y;
    if(vs > -3.3 && S.v < 42 && slope < 0.18 && !inLake){
      S.onGround = true; S.pos.y = floorY + 1.25; S.gamma = 0;
      showMsg('TOUCHDOWN — gentle as morning');
    } else {
      resetFlight(inLake ? 'The lake is colder than it looks — back to cruise' : 'The mountain always wins — back to cruise');
    }
  }
  if(Math.abs(S.pos.x) > 19500 || Math.abs(S.pos.z) > 19500){
    const toC = Math.atan2(-S.pos.x, S.pos.z);
    let dh = wrapPi(toC - S.chi);
    S.chi += THREE.MathUtils.clamp(dh, -1, 1)*0.25*dt;
    if(!S._boundMsg || S.time - S._boundMsg > 20){ S._boundMsg = S.time; toast('Haze ahead — easing back toward the valley'); }
  }
  S.chi = wrapPi(S.chi);
  S.hdg = wrapPi(S.hdg);
  if(!isFinite(S.v)) S.v = 52;
  if(!isFinite(S.pos.x) || !isFinite(S.pos.y) || !isFinite(S.pos.z)) S.pos.set(START.x, START.y, START.z);
  S.pos.y = Math.min(S.pos.y, 6100);

  // --- derived instrument data ---
  S.iasKt = S.v*Math.sqrt(sigma)*KT;
  S.altFt = S.pos.y/FT;
  S.vsFpm = Math.sin(S.gamma)*S.v*196.85;
  S.gs = S.v*cg*KT;
  if(S.engineOn){
    const burn = (2.2 + 9.0*S.throttle*sigma)*3/3600*dt; // sped up so needles live
    S.fuelL = Math.max(0, S.fuelL - burn/2);
    S.fuelR = Math.max(0, S.fuelR - burn/2);
  }
  S.oilT += ((S.engineOn? 175 + S.throttle*45 : 60) - S.oilT)*Math.min(1, dt*0.01);
  S.oilP += ((S.engineOn? 30 + S.rpm/2700*55 : 0) - S.oilP)*Math.min(1, dt*0.5);
  S.amp = !S.master ? -2 : (S.rpm > 900 && S.engineOn ? 14 : -9);
}

/* ============================== CONTROLS ============================== */
const GAMEKEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','BracketLeft','BracketRight','Space'];
addEventListener('keydown', e=>{
  if(GAMEKEYS.includes(e.code)) e.preventDefault();
  if(e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  initAudio();
  switch(e.code){
    case 'KeyF': S.flapT = Math.min(3, S.flapT+1); toast('FLAPS '+[0,10,20,30][S.flapT]+'°'); break;
    case 'KeyV': S.flapT = Math.max(0, S.flapT-1); toast('FLAPS '+[0,10,20,30][S.flapT]+'°'); break;
    case 'KeyC': S.carbHeat = !S.carbHeat; toast('CARB HEAT '+(S.carbHeat?'ON':'COLD')); break;
    case 'KeyU': S.master = !S.master; toast('MASTER '+(S.master?'ON':'OFF')); break;
    case 'KeyE': S.mags = (S.mags+1)%5; if(S.mags===4){ setTimeout(()=>{ if(S.mags===4) S.mags = 3; }, 900); }
      toast('MAGNETOS '+['OFF','R','L','BOTH','START'][S.mags]); break;
    case 'KeyD': INS.hiDrift = 0; INS.bug = S.hdg; toast('DG SLAVED TO COMPASS'); break;
    case 'KeyR': S.realism = !S.realism; S.assist = !S.realism; document.getElementById('bReal').textContent = S.realism?'REALISM':'ASSIST'; toast(S.realism?'REALISM — full hand flying':'STABILITY ASSIST ON'); break;
    case 'KeyQ': S.quality = (S.quality+2)%3; applyQuality(); break;
    case 'KeyM': toggleAudio(); break;
    case 'KeyH': toggleHelp(); break;
    case 'KeyY': mouseYoke = !mouseYoke; toast(mouseYoke?'MOUSE YOKE ON':'MOUSE YOKE OFF'); break;
    case 'KeyN':
      if(!gltfReady){ toast('GLTF STILL LOADING'); break; }
      useGltf = !useGltf; toast(useGltf?'AIRFRAME: GLTF':'AIRFRAME: PROCEDURAL'); break;
    case 'KeyP': setView(S.view===5?1:5); break;
    case 'BracketLeft': S.baro = Math.max(28.1, S.baro-0.01); break;
    case 'BracketRight': S.baro = Math.min(31.0, S.baro+0.01); break;
    case 'Minus': INS.bug -= 3*D2R; break;
    case 'Equal': INS.bug += 3*D2R; break;
    case 'Digit1': setView(1); break; case 'Digit2': setView(2); break; case 'Digit3': setView(3); break;
    case 'Digit4': setView(4); break; case 'Digit5': setView(5); break;
  }
});
addEventListener('keyup', e=>{ keys[e.code] = false; if(e.code==='KeyB') S.brake = false; });
addEventListener('keydown', e=>{ if(e.code==='KeyB') S.brake = true; });

const look = {yaw: 0, pitch: -0.185};
addEventListener('wheel', e=>{
  if(S.view===5) photoOrb.d = THREE.MathUtils.clamp(photoOrb.d*(1+Math.sign(e.deltaY)*0.08), 4, 70);
});
const photoOrb = {az: 2.6, el: 0.25, d: 14};
// Look and orbit by DRAGGING, in every view. This used to request pointer lock on any
// click: the cursor vanished and from then on the smallest mouse motion panned the view,
// which read as the aeroplane swinging away on its own with no way to recover. Pointer
// lock is also blocked inside an embedded frame, so it only ever misbehaved in a real tab.
let drag = false, dragX = 0, dragY = 0;
renderer.domElement.addEventListener('pointerdown', e=>{
  initAudio();
  drag = true; dragX = e.clientX; dragY = e.clientY;
  renderer.domElement.style.cursor = 'grabbing';
});
addEventListener('pointerup', ()=>{ drag = false; renderer.domElement.style.cursor = ''; });
addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY;
  dragX = e.clientX; dragY = e.clientY;
  if(S.view === 5){
    photoOrb.az -= dx*0.006;
    photoOrb.el = THREE.MathUtils.clamp(photoOrb.el + dy*0.004, -1.2, 1.4);
  } else if(mouseYoke){
    input.ail = THREE.MathUtils.clamp(input.ail + dx*0.006, -1, 1);
    input.elev = THREE.MathUtils.clamp(input.elev + dy*0.006, -1, 1);
  } else {
    look.yaw = THREE.MathUtils.clamp(look.yaw + dx*0.004, -2.6, 2.6);
    look.pitch = THREE.MathUtils.clamp(look.pitch - dy*0.0035, -0.55, 0.85);
  }
});

function pollControls(dt){
  if(!mouseYoke){
    input.ail = (keys.ArrowLeft? -1:0) + (keys.ArrowRight? 1:0);
    input.elev = (keys.ArrowUp? 1:0) + (keys.ArrowDown? -1:0);
  }
  input.rud = (keys.KeyZ? -1:0) + (keys.KeyX? 1:0);
  if(keys.KeyW) S.throttle = Math.min(1, S.throttle + 0.35*dt);
  if(keys.KeyS) S.throttle = Math.max(0, S.throttle - 0.35*dt);
  if(keys.KeyT){ S.trim = Math.min(1, S.trim + 0.22*dt); }
  if(keys.KeyG){ S.trim = Math.max(-1, S.trim - 0.22*dt); }
  if(keys.KeyK) S.mixture = Math.max(0, S.mixture - 0.25*dt);
  if(keys.KeyL) S.mixture = Math.min(1, S.mixture + 0.25*dt);
  if(mouseYoke && !drag){ input.ail *= 1-Math.min(1,dt*3); input.elev *= 1-Math.min(1,dt*3); }
}

/* ============================== CAMERAS ============================== */
const acEuler = new THREE.Euler(0,0,0,'YXZ');
const acQuat = new THREE.Quaternion();
const camEuler = new THREE.Euler(0,0,0,'YXZ');
const eyeLocal = new THREE.Vector3();
const chaseSm = new THREE.Vector3(START.x, START.y+4, START.z+14);
let lookSmooth = {yaw:0, pitch:-0.185};
function setView(v){
  S.view = v;
  if(v===1){ look.yaw = 0; look.pitch = -0.05; }
  if(v===2){ look.yaw = -1.45; look.pitch = 0.05; }
  if(v===3){ look.yaw = 0; look.pitch = 0.10; }
  // snap the exterior cameras on entry: both smooth toward a target, and after time spent
  // in another view they start kilometres behind and crawl in, which reads as a frozen camera
  if(v===4){
    const back = new THREE.Vector3(0, 3.4, 12.8).applyQuaternion(
      new THREE.Quaternion().setFromEuler(new THREE.Euler(S.pitch*0.35, -S.hdg, -S.roll*0.3, 'YXZ')));
    chaseSm.copy(S.pos).add(back);
  }
  if(v===5){
    const o = photoOrb;
    camWorld.position.set(
      Math.sin(o.az)*Math.cos(o.el), Math.sin(o.el), Math.cos(o.az)*Math.cos(o.el)
    ).multiplyScalar(o.d).add(S.pos);
  }
  const names = ['','COCKPIT','LEFT WING','OVER THE NOSE','CHASE','PHOTO — drag to orbit, wheel zoom'];
  toast('VIEW: '+names[v]);
  document.getElementById('btns').style.display = v===5? 'none':'flex';
  document.getElementById('help').style.display = v===5? 'none': helpShown? 'block':'none';
}
function updateCameras(dt){
  // wider FOV inside the cockpit: fits the whole panel plus a real over-the-nose view
  const fovT = S.view <= 3 ? 76 : 62;
  if(camWorld.fov !== fovT){
    camWorld.fov = camPanel.fov = fovT;
    camWorld.updateProjectionMatrix(); camPanel.updateProjectionMatrix();
  }
  acEuler.set(S.pitch, -S.hdg, -S.roll);
  acQuat.setFromEuler(acEuler);
  // engine + buffet shake
  const shake = (S.rpm/2400)*0.0011 + S.buffet*0.011;
  const shP = (vnoise(S.time*31.7, 1.3)-0.5)*shake, shR = (vnoise(S.time*27.1, 9.1)-0.5)*shake;
  acGroup.position.copy(S.pos);
  acGroup.quaternion.copy(acQuat);
  // control surfaces
  ctrl.ailL.rotation.x = -S.ail*0.45; ctrl.ailR.rotation.x = S.ail*0.45;
  ctrl.elev.rotation.x = -(S.elev*0.5 + S.trim*0.22);   // surface extends aft of the hinge
  ctrl.rud.rotation.y = -S.rud*0.5;
  const flapAng = -S.flap*0.75;
  ctrl.flapL.rotation.x = flapAng; ctrl.flapR.rotation.x = flapAng;
  // prop
  propBlades.rotation.z -= S.rpm/60*2*Math.PI*dt;
  propBlades.visible = S.rpm < 1350;
  propDisc.material.opacity = THREE.MathUtils.clamp(S.rpm/2400*0.48, 0.10, 0.52);
  propDisc.rotation.z += S.rpm/60*2*Math.PI*dt*0.35;
  const gp = gltfAC.userData.prop;
  const pn = gltfAC.userData.propNode;
  if(pn) pn.rotation.z -= S.rpm/60*2*Math.PI*dt;
  if(gp){
    gp.rotation.z -= S.rpm/60*2*Math.PI*dt;
    gp.userData.blades.visible = S.rpm < 1350;
    gp.userData.discMat.opacity = propDisc.material.opacity;
    gp.userData.disc.rotation.z = propDisc.rotation.z - gp.rotation.z;
  }
  // yoke & pedals & levers
  yokeGroup.rotation.z = -S.ail*1.05;
  yokeGroup.position.z = -0.300 + S.elev*0.05;
  levers.pedL.position.z = -0.60 + S.rud*0.05;
  levers.pedR.position.z = -0.60 - S.rud*0.05;
  levers.throttle.rotation.x = 0.30 - S.throttle*0.62;
  levers.mixture.rotation.x = 0.30 - S.mixture*0.62;
  levers.carb.rotation.x = 0.30 - (S.carbHeat?0.55:0);
  levers.trim.rotation.z = S.trim*16;
  levers.flap.rotation.x = 0.30 - S.flap*0.62;
  levers.bat.rotation.x = S.master? -0.35:0.35;
  levers.alt.rotation.x = S.master? -0.35:0.35;
  levers.magKey.rotation.z = [-0.9,-0.45,0,0.45,0.85][S.mags];
  // sun patches inside cockpit
  const relAz = wrapPi(SUN_AZ - S.hdg);
  sunPatchA.position.x = -Math.tan(THREE.MathUtils.clamp(relAz,-1.2,1.2))*0.55;
  sunPatchA.material.opacity = Math.max(0, 0.5 - Math.abs(relAz)*0.42)*(0.5+0.5*Math.cos(S.roll*2));
  sunPatchB.position.x = -Math.tan(THREE.MathUtils.clamp(relAz,-1.2,1.2))*0.75;
  sunPatchB.material.opacity = Math.max(0, 0.34 - Math.abs(relAz)*0.3);
  // cockpit sun light follows aircraft
  sunLightC.position.copy(S.pos).addScaledVector(sunDir, 60);
  sunLightC.target.position.copy(S.pos);
  // visibility sets
  const inCockpit = S.view <= 3;
  extHide.visible = !inCockpit && !useGltf;
  extShow.visible = !useGltf;
  gltfAC.visible = useGltf;
  interior.visible = inCockpit;
  // our panel rides forward into the model's dash when the glTF cabin is the one showing
  interior.position.set(useGltf ? 0.08 : 0, useGltf ? 0.15 : 0, useGltf ? -1.20 : 0);

  // smoothing on look
  lookSmooth.yaw += (look.yaw - lookSmooth.yaw)*Math.min(1, dt*9);
  lookSmooth.pitch += (look.pitch - lookSmooth.pitch)*Math.min(1, dt*9);

  if(S.view <= 3){
    const ge = useGltf ? gltfAC.userData.eye : null;
    if(ge){
      if(S.view===1) eyeLocal.copy(ge);
      else if(S.view===2) eyeLocal.set(ge.x-0.14, ge.y, ge.z+0.08);
      else eyeLocal.set(ge.x+0.02, ge.y+0.02, ge.z-0.12);
    }
    else if(S.view===1) eyeLocal.set(-0.32, 0.52, 0.22);
    else if(S.view===2) eyeLocal.set(-0.46, 0.52, 0.30);
    else eyeLocal.set(-0.30, 0.53, 0.10);
    const eye = eyeLocal.clone().applyQuaternion(acQuat).add(S.pos);
    camWorld.position.copy(eye);
    camEuler.set(lookSmooth.pitch + shP, -lookSmooth.yaw, shR);
    const q = new THREE.Quaternion().setFromEuler(camEuler);
    camWorld.quaternion.copy(acQuat).multiply(q);
    camPanel.position.copy(camWorld.position);
    camPanel.quaternion.copy(camWorld.quaternion);
  } else if(S.view===4){
    const back = new THREE.Vector3(0, 3.4, 12.8);
    const yawQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(S.pitch*0.35, -S.hdg, -S.roll*0.3, 'YXZ'));
    back.applyQuaternion(yawQ);
    const target = S.pos.clone().add(back);
    chaseSm.lerp(target, 1-Math.exp(-dt*2.6));
    camWorld.position.copy(chaseSm);
    camWorld.up.set(0,1,0);
    camWorld.lookAt(S.pos.x, S.pos.y+0.8, S.pos.z);
  } else {
    const o = photoOrb;
    const p = new THREE.Vector3(
      Math.sin(o.az)*Math.cos(o.el), Math.sin(o.el), Math.cos(o.az)*Math.cos(o.el)
    ).multiplyScalar(o.d).add(S.pos);
    camWorld.position.lerp(p, 1-Math.exp(-dt*8));
    camWorld.up.set(0,1,0);
    camWorld.lookAt(S.pos);
  }
  updateRings(camWorld.position.x, camWorld.position.z);
}

/* ============================== AUDIO ============================== */
let AC = null, audioOn = false, eng = {};
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    eng.master = master;
    // engine: two saws through lowpass
    const o1 = AC.createOscillator(); o1.type = 'sawtooth';
    const o2 = AC.createOscillator(); o2.type = 'sawtooth';
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 520; lp.Q.value = 0.8;
    const eg = AC.createGain(); eg.gain.value = 0.16;
    o1.connect(lp); o2.connect(lp); lp.connect(eg); eg.connect(master);
    o1.start(); o2.start();
    eng.o1 = o1; eng.o2 = o2; eng.eg = eg;
    // wind noise
    const nb = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const nd = nb.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 700; bp.Q.value = 0.6;
    const wg = AC.createGain(); wg.gain.value = 0;
    ns.connect(bp); bp.connect(wg); wg.connect(master); ns.start();
    eng.wg = wg;
    // stall horn
    const ho = AC.createOscillator(); ho.type='square'; ho.frequency.value = 820;
    const hg = AC.createGain(); hg.gain.value = 0;
    ho.connect(hg); hg.connect(master); ho.start();
    eng.hg = hg;
    audioOn = false;
    document.getElementById('bSnd').textContent = 'SND OFF';
  }catch(err){ AC = null; }
}
function toggleAudio(){
  if(!AC){ initAudio(); }
  if(!AC) return;
  audioOn = !audioOn;
  document.getElementById('bSnd').textContent = audioOn? 'SND ON':'SND OFF';
}
function updateAudio(dt){
  if(!AC || !eng.master) return;
  const tgt = audioOn ? 0.55 : 0;
  eng.master.gain.value += (tgt - eng.master.gain.value)*Math.min(1, dt*4);
  if(!audioOn) return;
  const f = S.rpm/60*2.0;
  eng.o1.frequency.value = f;
  eng.o2.frequency.value = f*1.505 + 2;
  eng.eg.gain.value = S.engineOn? 0.10 + S.throttle*0.10 : 0.03;
  eng.wg.gain.value = Math.min(0.22, Math.pow(S.v/62, 2)*0.16) + S.buffet*0.10;
  eng.hg.gain.value = (S.stall && !S.onGround && (S.time*7%1)<0.55) ? 0.05 : 0;
}

/* ============================== QUALITY ============================== */
function applyQuality(silent){
  const q = S.quality;
  const pr = q===0? 1 : q===1? Math.min(devicePixelRatio,1.5) : Math.min(devicePixelRatio,2);
  renderer.setPixelRatio(pr);
  if(composer){ composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight); }
  if(bloomPass) bloomPass.enabled = q > 0;
  if(gtaoPass) gtaoPass.enabled = q > 1;
  treeMesh.count = Math.floor(treeMesh.userData.full * (q===0?0.22 : q===1?0.55 : 1));
  terrainUniforms.uDetail.value = q===0? 0 : q===1? 1 : 2;
  terrainUniforms.uCloudSh.value = q===0? 0 : 1;
  cloudGeo.instanceCount = q===0? 10 : q===1? 20 : 32;
  document.getElementById('bQual').textContent = 'Q: '+['LOW','MED','HIGH'][q];
  if(!silent) toast('QUALITY '+['LOW','MEDIUM','HIGH'][q]);
}
document.getElementById('bQual').addEventListener('click', ()=>{ S.quality = (S.quality+1)%3; applyQuality(); });
document.getElementById('bReal').addEventListener('click', ()=>{ S.realism = !S.realism; S.assist = !S.realism; document.getElementById('bReal').textContent = S.realism?'REALISM':'ASSIST'; });
document.getElementById('bSnd').addEventListener('click', ()=>{ initAudio(); toggleAudio(); });
let helpShown = true;
function toggleHelp(){
  helpShown = !helpShown;
  const h = document.getElementById('help');
  h.style.display = helpShown? 'block':'none';
  h.style.opacity = helpShown? 1 : 0;
}
document.getElementById('bHelp').addEventListener('click', toggleHelp);
setTimeout(()=>{ if(helpShown){ document.getElementById('help').style.opacity = 0.0; setTimeout(()=>{ if(!helpShown) return; document.getElementById('help').style.display='none'; helpShown = false; }, 700); } }, 14000);

/* ============================== RESIZE / LOOP ============================== */
addEventListener('resize', ()=>{
  camWorld.aspect = camPanel.aspect = innerWidth/innerHeight;
  camWorld.updateProjectionMatrix(); camPanel.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(composer){ composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight); }
  if(bloomPass) bloomPass.setSize(innerWidth, innerHeight);
  if(gtaoPass) gtaoPass.setSize(innerWidth, innerHeight);
});
document.getElementById('stall').style.transition = 'opacity 0.15s';

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.001, (now-last)/1000));
  last = now;
  S.time += dt;
  pollControls(dt);
  if(!document.hidden) updateFlight(dt);
  tickWorld(dt);
  updateInstruments(dt);
  updateCameras(dt);
  updateAudio(dt);
  document.getElementById('stall').style.opacity = (S.stall && (S.time*5%1)<0.6) ? 1 : 0;
  const cockpitCam = S.view<=3 ? camPanel : camWorld;
  if(composer){
    rpCockpit.camera = cockpitCam;
    if(gtaoPass) gtaoPass.camera = cockpitCam;
    composer.render();
  } else {
    renderer.clear();
    renderer.render(worldScene, camWorld);
    renderer.clearDepth();
    renderer.render(cockpitScene, cockpitCam);
  }
}
/* ============================== POST PROCESSING ==============================
   Materials already tone-map and encode to sRGB, so the chain runs on display-referred
   values -- which is also exactly what a film LUT expects as input. */
let composer = null, rpCockpit = null, bloomPass = null, lutPass = null, gtaoPass = null;
// Teal-shadow / warm-highlight grade, built as a real 3D LUT so it runs through LUTPass
// like any film LUT. Used when no .CUBE is reachable, and as the guaranteed baseline.
function cinematicLUT(size){
  const d = new Uint8Array(size*size*size*4);
  // gentle contrast only -- a hard S-curve on top of ACES crushes the cabin to black
  const S = v => { v = Math.min(1, Math.max(0, v)); return v*v*(3-2*v)*0.10 + v*0.90; };
  let p = 0;
  for(let bi=0;bi<size;bi++) for(let gi=0;gi<size;gi++) for(let ri=0;ri<size;ri++){
    let r = ri/(size-1), g = gi/(size-1), b = bi/(size-1);
    const l = 0.2126*r + 0.7152*g + 0.0722*b;
    const sh = Math.pow(1 - Math.min(1, l*1.6), 2);
    const hi = Math.pow(Math.max(0, (l-0.5)/0.5), 1.4);
    const lift = 0.034*sh;                       // film black point, keeps shadows readable
    r += lift - 0.020*sh + 0.052*hi;
    g += lift + 0.004*sh + 0.019*hi;
    b += lift + 0.038*sh - 0.034*hi;
    d[p++] = S(r)*255; d[p++] = S(g)*255; d[p++] = S(b)*255; d[p++] = 255;
  }
  const t = new THREE.Data3DTexture(d, size, size, size);
  t.format = THREE.RGBAFormat; t.type = THREE.UnsignedByteType;
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = t.wrapR = THREE.ClampToEdgeWrapping;
  t.unpackAlignment = 1; t.needsUpdate = true;
  return t;
}
(async ()=>{
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(worldScene, camWorld));
  rpCockpit = new RenderPass(cockpitScene, camPanel);
  rpCockpit.clear = false; rpCockpit.clearDepth = true;
  composer.addPass(rpCockpit);
  // AO runs on the cockpit only. The terrain is displaced in its vertex shader, and the
  // pass's depth prepass swaps in its own material, so terrain depth would come back flat
  // and the AO would be meaningless. The cabin is where contact shading shows anyway.
  try{
    const m = await import('three/addons/postprocessing/GTAOPass.js');
    gtaoPass = new m.GTAOPass(cockpitScene, camPanel, innerWidth, innerHeight);
    gtaoPass.updateGtaoMaterial({radius:0.11, distanceExponent:1.6, thickness:0.35, scale:0.65, samples:12});
    composer.addPass(gtaoPass);
    console.log('[post] GTAO enabled');
    // GTAO's depth/normal prepass redraws the cabin with an override material, which writes
    // depth for EVERY mesh -- including the transparent window glass. The AO then treats the
    // glass as a solid surface, finds the cabin structure crowding around it, and multiplies
    // that occlusion onto the sky seen THROUGH it: a hard black mass across the windshield,
    // and only on HIGH because HIGH is the only quality that runs AO. The beauty pass has
    // already drawn by the time this pass runs, so dropping transparent meshes for the
    // duration of the AO pass alone costs nothing on screen. Done by traversal rather than a
    // captured list so it keeps working as the glTF cabin streams in and materials change.
    const aoRender = gtaoPass.render.bind(gtaoPass);
    gtaoPass.render = function(...args){
      const hidden = [];
      cockpitScene.traverse(o=>{
        if(!o.isMesh || !o.visible || !o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        if(mats.some(m => m && m.transparent)){ o.visible = false; hidden.push(o); }
      });
      aoRender(...args);
      for(const o of hidden) o.visible = true;
    };
  }catch(e){ console.warn('[post] GTAO unavailable: '+e.message); }
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.26, 0.72, 0.90);
  composer.addPass(bloomPass);
  const cube = await firstThatLoads(new LUTCubeLoader(), [
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/luts/Bourbon%2064.CUBE',
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/luts/Cubicle%2099.CUBE',
    CDN3 + 'luts/Bourbon%2064.CUBE'
  ], 'colour LUT');
  lutPass = new LUTPass({lut: cube ? cube.texture3D : cinematicLUT(32), intensity: cube ? 0.5 : 0.8});
  ASSETS.lut = lutPass.lut; ASSETS.lutSource = cube ? cube.__src : 'procedural teal/orange';
  composer.addPass(lutPass);
  lutPass.renderToScreen = true;
  console.log('[assets] report', {env: ASSETS.envSource, lut: ASSETS.lutSource});
})();

applyQuality(true);
updateRings(S.pos.x, S.pos.z);
requestAnimationFrame(loop);
</script>
