{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { SSRPass } from 'three/addons/postprocessing/SSRPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { Lensflare, LensflareElement } from 'three/addons/objects/Lensflare.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ============================================================
   CONFIG
   ============================================================ */
const LOOP_T   = 24.0;
const OMG      = Math.PI * 2 / LOOP_T;
const BASE     = { speed: 6.0 };

const WHIRL = { x: 0.0, z: 0.0, s: 20.0, R: 18.0, dip: 10.0, dipR: 12.0, inflow: 4.5 };
const WAVES = [
  { a: 0.35, kx: 0.4, kz: 0.15, w: 2.5, p: 0.0 }, 
  { a: 0.20, kx: 0.8, kz: -0.2, w: 4.5, p: 1.7 },
  { a: 0.15, kx: 1.2, kz: 0.5, w: 7.0, p: 4.2 },
  { a: 0.12, kx: -0.6, kz: 0.9, w: 3.5, p: 2.1 } 
];

const FOG = { color: 0x8ab3cc, density: 0.00025 }; 
const SUN_DIR = new THREE.Vector3(-0.6, 0.3, -0.8).normalize(); 
const SHORE_BOUNDS = 1500.0;

let tide = 1.0;
let whirlK = 8;
let oceanTime = 0; 

/* ---------------- helpers ---------------- */
const fn = x => { const s = String(x); return (s.includes('.') || s.includes('e')) ? s : s + '.0'; };
const clamp01 = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);

function smoothstep(min, max, value) {
  const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
  return x * x * (3 - 2 * x);
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(1337);

function hash2(ix, iz) { const s = Math.sin(ix * 127.1 + iz * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return ((a + (b - a) * ux) * (1 - uz) + (c + (d - c) * ux) * uz) * 2 - 1;
}
function n2(x, z) { return vnoise(x, z) * 0.5 + vnoise(x * 2.5 + 1.2, z * 2.5 + 3.4) * 0.25; }

function fbm(x, z) {
    let t = 0, a = 1, f = 1, maxValue = 0;
    for(let i=0; i<4; i++){
        t += n2(x * f, z * f) * a;
        maxValue += a;
        f *= 2.0; 
        a *= 0.5;
    }
    return t / maxValue;
}

/* ---------------- Terrain Generation (CACHED ARRAY + EARLY EXIT) ---------------- */
const islandsData = [];
let r_island = mulberry32(111);

for(let i=0; i<100; i++) {
    let cx = -5000 + r_island() * 10000;
    let cz = -5000 + r_island() * 10000;
    let rx = 50 + r_island() * 150;
    let rz = 50 + r_island() * 150;
    let rot = r_island() * Math.PI;
    let height = 40 + r_island() * 90;

    let distToCenter = Math.hypot(cx, cz);
    if(distToCenter < 450) continue; 

    islandsData.push({cx, cz, rx, rz, rot, h: height, noiseFac: 0.2});
}
// Headlands movidas levemente para o centro (de 350 para 290) para fechar mais o canal
islandsData.push({cx: -290, cz: 10, rx: 200, rz: 300, rot: 0.1, h: 140.0, noiseFac: 0.15});
islandsData.push({cx:  290, cz: -10, rx: 190, rz: 290, rot: -0.1, h: 135.0, noiseFac: 0.15});

function createLODGrid(size, segments, power) {
    let geo = new THREE.PlaneGeometry(size, size, segments, segments);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i) / (size / 2);
        let z = pos.getZ(i) / (size / 2);
        x = Math.sign(x) * Math.pow(Math.abs(x), power) * (size / 2);
        z = Math.sign(z) * Math.pow(Math.abs(z), power) * (size / 2);
        pos.setX(i, x);
        pos.setZ(i, z);
    }
    geo.computeVertexNormals();
    return geo;
}

function island(x, z, cx, cz, rx, rz, rot, h, noiseFac) {
  const dx = x - cx, dz = z - cz;
  const cosR = Math.cos(rot), sinR = Math.sin(rot);
  const nx = dx * cosR - dz * sinR, nz = dx * sinR + dz * cosR;
  
  const d2_base = (nx * nx) / (rx * rx) + (nz * nz) / (rz * rz);
  if (d2_base > 5.0) return 0.0;

  const radMod = 1.0 - fbm(x * noiseFac, z * noiseFac) * 0.3;
  const radX = rx * radMod, radZ = rz * radMod;
  const d2 = (nx * nx) / (radX * radX) + (nz * nz) / (radZ * radZ);
  let val = h * Math.exp(-d2 * 2.0); 
  
  if (val > h * 0.4) {
    val = h * 0.4 + (val - h * 0.4) * 0.3;
  }
  return val;
}

function terrainHeight(x, z) {
  let distToCenter = Math.hypot(x, z);

  let noiseMult = smoothstep(80.0, 150.0, distToCenter);
  let h = -35.0 + fbm(x * 0.05, z * 0.05) * 12.0 * noiseMult;

  const channelRadius = 150.0;
  const distFromX = Math.abs(x);
  if (distFromX < channelRadius) {
      const carve = Math.pow(1.0 - (distFromX / channelRadius), 1.5);
      h -= carve * 25.0; 
  }

  // Fundo liso a profundidade segura constante de -25 metros para não engolir a luz da câmera nem as algas
  if (distToCenter < 140.0) {
      let plateau = 1.0 - Math.pow(distToCenter / 140.0, 2.0);
      plateau = Math.max(0.0, plateau);
      h += plateau * 35.0; 
  }

  for(let i=0; i<islandsData.length; i++) {
      const isl = islandsData[i];
      h += island(x, z, isl.cx, isl.cz, isl.rx, isl.rz, isl.rot, isl.h, isl.noiseFac);
  }

  return h;
}

/* ============================================================
   RENDERER / SCENE
   ============================================================ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.setClearColor(FOG.color);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG.color, FOG.density); 

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1.0, 15000);
// Altura e distância intermediárias perfeitas para copiar a foto de referência
camera.position.set(0, 180, 310); 

const controls = new OrbitControls(camera, renderer.domElement);
// Alvo centralizado ligeiramente à frente para enquadrar o vortex e as ilhas no centro exato da tela
controls.target.set(0, -5, -40);controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxDistance = 1500;
controls.maxPolarAngle = 1.8; 
controls.update();

const sun = new THREE.DirectionalLight(0xfffaed, 6.0); 
sun.position.copy(SUN_DIR).multiplyScalar(500);
const textureLoader = new THREE.TextureLoader();
const textureFlare0 = textureLoader.load('https://unpkg.com/three@0.160.0/examples/textures/lensflare/lensflare0.png');
const textureFlare3 = textureLoader.load('https://unpkg.com/three@0.160.0/examples/textures/lensflare/lensflare3.png');
const lensflare = new Lensflare();
lensflare.addElement(new LensflareElement(textureFlare0, 700, 0, sun.color));
lensflare.addElement(new LensflareElement(textureFlare3, 60, 0.6));
lensflare.addElement(new LensflareElement(textureFlare3, 70, 0.7));
lensflare.addElement(new LensflareElement(textureFlare3, 120, 0.9));
lensflare.addElement(new LensflareElement(textureFlare3, 70, 1.0));
sun.add(lensflare);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xe0f4ff, 0x1a332d, 2.0)); 

/* ============================================================
   TERRAIN MESH (PATCH SYSTEM)
   ============================================================ */
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);
const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0.0 });

function createTerrainPatch(cx, cz, width, depth, segX, segZ, isGlobal) {
  let geo = new THREE.PlaneGeometry(width, depth, segX, segZ);
  geo.rotateX(-Math.PI / 2);
  geo.translate(cx, 0, cz);

  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let z = pos.getZ(i);
    let y = terrainHeight(x, z);
    
    if (isGlobal) y -= 1.0; 
    
    if (!isGlobal) {
        let edgeDistX = Math.abs(x - cx) / (width / 2);
        let edgeDistZ = Math.abs(z - cz) / (depth / 2);
        let maxEdge = Math.max(edgeDistX, edgeDistZ);
        if (maxEdge > 0.8) {
            let fade = (maxEdge - 0.8) / 0.2; 
            y -= fade * 1.0; 
        }
    }
    
    pos.setY(i, y);
  }
  
  geo.computeVertexNormals();
  const p2 = geo.attributes.position;
  const colors = new Float32Array(p2.count * 3);
  
  const cRockGrey = new THREE.Color(0x5a5c5a); 
  const cRockBrown = new THREE.Color(0x5d5245); 
  const cRockMossy = new THREE.Color(0x4a604a); 
  const cWet = new THREE.Color(0x1a1c1a);  
  const cSand = new THREE.Color(0x4a5f50); 
  const cGrass = new THREE.Color(0x5a7b3f); 
  const cMoss = new THREE.Color(0x485a2d);  
  const tmp = new THREE.Color();
  const upVec = new THREE.Vector3(0,1,0);
  const normal = new THREE.Vector3();
  const norms = geo.attributes.normal;

  for (let f = 0; f < p2.count; f++) {
    const cx_v = p2.getX(f), cy_v = p2.getY(f), cz_v = p2.getZ(f);
    normal.set(norms.getX(f), norms.getY(f), norms.getZ(f));
    const slope = 1.0 - normal.dot(upVec);
    
    const biomeNoise = n2(cx_v * 0.02, cz_v * 0.02);
    const localNoise = n2(cx_v * 0.8, cz_v * 0.8);
    const highFreqNoise = vnoise(cx_v * 3.5, cz_v * 3.5) * 0.5 + vnoise(cx_v * 7.0, cz_v * 7.0) * 0.25;

    const localRock = new THREE.Color();
    if(biomeNoise < -0.1) localRock.copy(cRockBrown);
    else if(biomeNoise > 0.2) localRock.copy(cRockMossy);
    else localRock.copy(cRockGrey);
    
    localRock.offsetHSL(highFreqNoise * 0.08, highFreqNoise * 0.15, highFreqNoise * 0.22);

    if (cy_v < -2.0) tmp.copy(cSand).offsetHSL(0, 0, localNoise * 0.05);
    else if (cy_v < 0.5) tmp.copy(cSand).lerp(cWet, clamp01((cy_v + 2.0) / 2.5));
    else if (cy_v < 3.5) tmp.copy(cWet).lerp(localRock, clamp01((cy_v - 0.5) / 3.0));
    else {
        if (slope > 0.35) tmp.copy(localRock);
        else tmp.copy(cGrass).lerp(cMoss, clamp01(localNoise + 0.5));
    }
    
    const jitter = 0.85 + hash2(Math.floor(cx_v), Math.floor(cz_v)) * 0.25;
    colors[f * 3] = tmp.r * jitter;
    colors[f * 3 + 1] = tmp.g * jitter;
    colors[f * 3 + 2] = tmp.b * jitter;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  terrainGroup.add(new THREE.Mesh(geo, terrainMat));
}

// 1. CHÃO DO OCEANO (Global, Infinito, Low-poly extremo)
// OTIMIZAÇÃO: Segmentos cortados pela metade (de 150 para 75). Quase não se nota perda de qualidade no fundo do mar, mas o carregamento voa.
createTerrainPatch(0, 0, 15000, 15000, 75, 75, true);
for(let i = 0; i < islandsData.length; i++) {
    let isl = islandsData[i];
    let patchWidth = isl.rx * 3.5;
    let patchDepth = isl.rz * 3.5;
    // OTIMIZAÇÃO: Diminui drasticamente os polígonos das ilhas para acelerar a carga
    let segX = Math.max(8, Math.floor(patchWidth / 16));
    let segZ = Math.max(8, Math.floor(patchDepth / 16));
    createTerrainPatch(isl.cx, isl.cz, patchWidth, patchDepth, segX, segZ, false);
}

/* ============================================================
   POST-PROCESSING
   ============================================================ */
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

let ssrPass = null;

const ssaoPass = new SSAOPass(scene, camera, innerWidth, innerHeight);
ssaoPass.kernelRadius = 14;
ssaoPass.minDistance = 0.002;
ssaoPass.maxDistance = 0.1;
composer.addPass(ssaoPass);

const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.5, 0.85);
composer.addPass(bloomPass);

const bokehPass = new BokehPass(scene, camera, {
    focus: 450.0,
    aperture: 0.00001,
    maxblur: 0.005,
    width: innerWidth,
    height: innerHeight
});
composer.addPass(bokehPass);

const CinematicShader = {
    uniforms: {
        tDiffuse: { value: null },
        amount: { value: 0.0030 },        uIsUnderwater: { value: 0.0 },
        uTime: { value: 0.0 }
    },    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float amount;
        uniform float uIsUnderwater;
        uniform float uTime;
        varying vec2 vUv;
        void main() {
            vec2 uv = vUv;
            
            if (uIsUnderwater > 0.0) {
                uv.x += sin(uv.y * 20.0 + uTime * 3.0) * 0.003 * uIsUnderwater;
                uv.y += cos(uv.x * 20.0 + uTime * 2.5) * 0.003 * uIsUnderwater;
            }

            vec2 offset = (uv - 0.5) * amount;
            
            float r = texture2D(tDiffuse, uv - offset).r;
            float g = texture2D(tDiffuse, uv).g;
            float b = texture2D(tDiffuse, uv + offset).b;
            vec3 col = vec3(r, g, b);
            
            col = mix(col, smoothstep(0.0, 1.0, col), 0.05); 
            float lum = dot(col, vec3(0.299, 0.587, 0.114));
            col = mix(vec3(lum), col, 1.10);
            col.r = mix(col.r, col.r * 1.02, lum);
            
            if (uIsUnderwater > 0.0) {
                vec3 underwaterTint = vec3(0.04, 0.22, 0.38);
                col = mix(col, underwaterTint * (lum * 1.2 + 0.3), uIsUnderwater * 0.85);
            }
            
            gl_FragColor = vec4(col, 1.0);
        }
    `
};
const cinematicPass = new ShaderPass(CinematicShader);
composer.addPass(cinematicPass);

/* ============================================================
   TEXTURES
   ============================================================ */
function makeStreakTexture() {
  const S = 256, cells1 = 16, cells2 = 48; 
  const mk = (c, seed) => {
    const r = mulberry32(seed), g = new Float32Array(c * c);
    for (let i = 0; i < c * c; i++) g[i] = r();
    return g;
  };
  const g1 = mk(cells1, 11), g2 = mk(cells2, 22), g3 = mk(32, 33);
  
  const sample = (g, c, u, v) => {
    const x = ((u % 1) + 1) * 1 * c, y = ((v % 1) + 1) * 1 * c;
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const x0 = ix % c, x1 = (ix + 1) % c, y0 = iy % c, y1 = (iy + 1) % c;
    const a = g[y0 * c + x0], b = g[y0 * c + x1], cc = g[y1 * c + x0], d = g[y1 * c + x1];
    return (a + (b - a) * ux) * (1 - uy) + (cc + (d - cc) * ux) * uy;
  };
  
  const data = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    data[i]   = (sample(g1, cells1, u, v) * 0.6 + sample(g2, cells2, u, v) * 0.4) * 255;
    data[i+1] = sample(g3, 32, u, v) * 255;
    data[i+2] = sample(g1, 8, u, v) * 255; 
    data[i+3] = 255;
  }
  const tex = new THREE.DataTexture(data, S, S);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = 4;
  tex.needsUpdate = true;
  return tex;
}

function makeShoreMask() {
  // OTIMIZAÇÃO: Máscara reduzida de 512px para 256px. Acelera a geração de colisão 4 vezes.
  const W = 256, H = 256; 
  const data = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const wx = -SHORE_BOUNDS + (x / (W - 1)) * (SHORE_BOUNDS * 2); 
    const wz = -SHORE_BOUNDS + (y / (H - 1)) * (SHORE_BOUNDS * 2);
    const h = terrainHeight(wx, wz);
    const shore = clamp01((h + 2.2) / 2.2) * (1 - clamp01((h - 0.5) / 1.5));
    const i = (y * W + x) * 4;
    data[i] = shore * 255;
    data[i + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, W, H);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

uniform float uWhirlDip;

  vec2 de = p - EPOS; float re2 = dot(de, de);
  h -= EDIP * exp(-re2 / (EDR * EDR));
  
  return h;
}
`;

  float ripple = sin(v * 15.0 + uTime * 3.0 + phase) * 0.1 * v;

};
{
  const fishGeo = new THREE.ConeGeometry(0.5, 2.0, 4);
  fishGeo.rotateX(Math.PI / 2);
  const fishInstGeo = new THREE.InstancedBufferGeometry();
  fishInstGeo.index = fishGeo.index;
  fishInstGeo.setAttribute('position', fishGeo.attributes.position);
  fishInstGeo.setAttribute('normal', fishGeo.attributes.normal);
  
  const fishCount = 120;
  const fPos = [], fParams = [], fColor = [];
  for(let i=0; i<fishCount; i++) {
      const r = 10.0 + rng() * 120.0;
      const theta = rng() * Math.PI * 2;
      const x = WHIRL.x + r * Math.cos(theta);
      const z = WHIRL.z + r * Math.sin(theta);
      const h = terrainHeight(x, z);
      const maxDepth = Math.min(-1.0, h + 1.0);
      const y = maxDepth < -1.0 ? maxDepth + rng() * (-1.0 - maxDepth) : -2.0;
      fPos.push(x, y, z);
      fParams.push(rng() * Math.PI * 2, 0.5 + rng() * 1.5, rng() * 100.0);
      const cType = rng();
      if(cType < 0.3) fColor.push(0.1, 0.4, 0.6);
      else if(cType < 0.6) fColor.push(0.5, 0.5, 0.6);
      else fColor.push(0.2, 0.3, 0.4);
  }
  fishInstGeo.instanceCount = fishCount;
  fishInstGeo.setAttribute('iPos', new THREE.InstancedBufferAttribute(new Float32Array(fPos), 3));
  fishInstGeo.setAttribute('iParams', new THREE.InstancedBufferAttribute(new Float32Array(fParams), 3));
  fishInstGeo.setAttribute('iColor', new THREE.InstancedBufferAttribute(new Float32Array(fColor), 3));

  const fishMat = new THREE.ShaderMaterial({
    uniforms: fishUniforms,
    vertexShader: `
uniform float uTime;
attribute vec3 iPos;
attribute vec3 iParams;
attribute vec3 iColor;
varying vec3 vColor;
varying vec3 vWorld;
void main() {
  vColor = iColor;
  float angle = iParams.x + uTime * 0.2 * iParams.y;
  float speed = iParams.y;
  float offset = iParams.z;
  
  float moveX = cos(angle) * speed * uTime;
  float moveZ = sin(angle) * speed * uTime;
  
  vec3 worldPos = vec3(iPos.x + moveX, iPos.y + sin(uTime * 2.0 + offset) * 0.5, iPos.z + moveZ);
  
  float swimWiggle = sin(uTime * 8.0 + offset) * 0.2;
  float s = sin(angle + swimWiggle);
  float c = cos(angle + swimWiggle);
  
  vec3 p = position;
  vec3 rotP = vec3(p.x * c - p.z * s, p.y, p.x * s + p.z * c);
  
  worldPos += rotP;
  vWorld = worldPos;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(worldPos, 1.0);
}`,
    fragmentShader: `
uniform vec3 uFogColor;
uniform float uFogDensity;
varying vec3 vColor;
varying vec3 vWorld;
void main() {
  vec3 col = vColor;
  float fogDist = length(cameraPosition - vWorld);
  float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDist * fogDist);
  col = mix(col, uFogColor, clamp(fogFactor, 0.0, 1.0));
  if(vWorld.y > 0.0) discard;
  gl_FragColor = vec4(col, 1.0);
}`
  });
  const fishMesh = new THREE.Mesh(fishInstGeo, fishMat);
  scene.add(fishMesh);
}

/* ============================================================
   UI
   ============================================================ */
const tideSlider = document.getElementById('tide');
function applyTide() {
  tide = tideSlider.value / 100;
  whirlK = 4 + Math.max(1, Math.round(4 * tide));
  const dip = WHIRL.dip * (0.55 + 0.45 * tide);
  
  waterUniforms.uWhirlSpin.value = whirlK * OMG;
  waterUniforms.uWhirlDip.value = dip;
  
  document.getElementById('readout-flow').textContent = (6.0 * tide).toFixed(1) + ' kn';
  document.getElementById('readout-tide').textContent = Math.round(tide * 100) + '%';
  document.getElementById('readout-state').textContent =
    tide < 0.7 ? 'EBB' : tide < 0.95 ? 'NEAP' : tide <= 1.2 ? 'FLOOD' : 'SPRING';
}
tideSlider.addEventListener('input', applyTide);
applyTide();

const VIEWS = {
  overview: { p: [0, 180, 310], t: [0, -5, -40] },  whirlpool: { p: [WHIRL.x + 10.0, 40.0, WHIRL.z + 50.0], t: [WHIRL.x, -5.0, WHIRL.z] },
  // Câmera recuada na correnteza, acompanhando a água ser puxada para o vortex
  drift: { p: [0.0, 12.0, -220.0], t: [WHIRL.x, -2.0, WHIRL.z + 50.0] },
  // Câmera underwater mais distante e profunda para não colar no vortex e ver o cenário
  underwater: { p: [60, -12, 80], t: [0, -5, 0] }
};let camTween = null;
function flyTo(name) {
  const v = VIEWS[name];
  camTween = {
    t: 0, dur: 1.8,
    p0: camera.position.clone(), p1: new THREE.Vector3(...v.p),
    t0: controls.target.clone(), t1: new THREE.Vector3(...v.t)
  };
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
}
document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => flyTo(b.dataset.view)));
renderer.domElement.addEventListener('pointerdown', () => { camTween = null; });

/* ============================================================
   SCREENSHOT SHORTCUT (CTRL + X)
   ============================================================ */
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
    e.preventDefault();
    
    composer.render();
    
    const dataURL = renderer.domElement.toDataURL('image/png');
    const link = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    link.download = `Tidal-Race-${date}.png`;
    link.href = dataURL;
    link.click();
  }
});

/* ============================================================
   EXPORT GLB SHORTCUT (CTRL + G)
   ============================================================ */
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g') {
    e.preventDefault();
    
    const exporter = new GLTFExporter();
    exporter.parse(
      scene,
      (gltf) => {
        const blob = new Blob([gltf], { type: 'model/gltf-binary' });
        const link = document.createElement('a');
        const date = new Date().toISOString().slice(0, 10);
        link.href = URL.createObjectURL(blob);
        link.download = `Tidal-Race-Scene-${date}.glb`;
        link.click();
      },
      (error) => {
        console.error('Erro ao exportar GLB:', error);
      },
      { binary: true }
    );
  }
});

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

setTimeout(() => {
  const f = document.getElementById('fadeout');
  if (f) { f.style.opacity = '0'; setTimeout(() => f.remove(), 1200); }
}, 800);

function animate() {
  requestAnimationFrame(animate);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const realTime = clock.elapsedTime;
  
  const dt = rawDt * tide; 
  oceanTime += dt;

  waterUniforms.uTime.value = oceanTime;
  kelpUniforms.uTime.value = realTime;
  fishUniforms.uTime.value = realTime;
  splashMat.uniforms.uTime.value = realTime;
  rockSplashMat.uniforms.uTime.value = realTime;
  cinematicPass.uniforms.uTime.value = realTime;
  
  const cameraHeight = camera.position.y;
  const targetUnderwater = cameraHeight < 0.0 ? clamp01(Math.abs(cameraHeight) / 3.0) : 0.0;
  cinematicPass.uniforms.uIsUnderwater.value += (targetUnderwater - cinematicPass.uniforms.uIsUnderwater.value) * 0.1;
  
  if (camTween) {
    camTween.t += rawDt / camTween.dur; 
    const k = camTween.t >= 1 ? 1 : (camTween.t < 0.5 ? 4 * camTween.t ** 3 : 1 - ((-2 * camTween.t + 2) ** 3) / 2);
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);
    controls.target.lerpVectors(camTween.t0, camTween.t1, k);
    if (camTween.t >= 1) camTween = null;
  }
  
  controls.update();

  const distToVortex = camera.position.distanceTo(new THREE.Vector3(WHIRL.x, 0.0, WHIRL.z));
  bokehPass.uniforms['focus'].value = distToVortex;

  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);

  if (ssrPass) {
    ssrPass.setSize(innerWidth, innerHeight);
  }
});
</script>
