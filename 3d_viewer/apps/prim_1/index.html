  scn:  { bgTop:'#ffffff', bgBot:'#ffffff', ground:true, shadowOp:0.38, contact:0.5, contactSize:1.0,

};
const DEFAULTS = structuredClone(P);

/* ============================== RENDERER ============================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(P.post.scale);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(P.cam.fov, innerWidth/innerHeight, P.cam.near, P.cam.far);
camera.position.set(15.5, 26.5, 51.5);

controls.enableDamping = true; controls.dampingFactor = 0.07;

const stats = new Stats();
stats.dom.style.cssText = 'position:fixed;top:0;left:0;display:none;z-index:30';
document.body.appendChild(stats.dom);

/* ============================== PROCEDURAL STUDIO ENVIRONMENT ============================== */
let seed = 7;
const rnd = () => { seed|=0; seed = seed+0x6D2B79F5|0; let t = Math.imul(seed^seed>>>15, 1|seed);
  t = t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

const envScene = new THREE.Scene();
const domeU = { uTop:{value:new THREE.Color(0.95,0.96,0.985)}, uBot:{value:new THREE.Color(0.09,0.09,0.1)},
                uBright:{value:1}, uContrast:{value:1} };
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(300,32,24), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, uniforms:domeU,
  vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'varying vec3 vP; uniform vec3 uTop,uBot; uniform float uBright,uContrast;\n'+
    'void main(){ float h=normalize(vP).y*0.5+0.5; vec3 c=mix(uBot,uTop,smoothstep(0.25,0.9,h));\n'+
    'c=pow(c,vec3(uContrast))*uBright; gl_FragColor=vec4(c,1.0); }'
})));

const SB = []; // softboxes {mesh, base}
function softbox(w,h,az,el,dist,base){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({ side:THREE.DoubleSide }));
  const ce = Math.cos(rad(el));
  m.position.set(dist*ce*Math.sin(rad(az)), dist*Math.sin(rad(el)), dist*ce*Math.cos(rad(az)));
  m.lookAt(0,0,0);
  envScene.add(m); SB.push({ m, base });
  return m;
}
softbox( 60, 80, -40, 45,  95, 14);   // key softbox
softbox(170, 22,   0, 86,  95, 10);   // overhead strip
softbox( 70, 60,  62, 12, 105, 3.2);  // fill panel
softbox( 30, 95, 160, 30, 105, 9);    // rim strip
softbox( 90, 60, 112, -4,  85, 0.02); // negative fill card
softbox( 90, 60,-135, -8,  85, 0.02); // negative fill card

const sparkGroup = new THREE.Group(); envScene.add(sparkGroup);
const sparkMats = [];
for (let i=0;i<26;i++){
  const m = new THREE.MeshBasicMaterial();
  const s = new THREE.Mesh(new THREE.SphereGeometry(1.1+rnd()*1.2, 8, 6), m);
  const az = rnd()*Math.PI*2, el = rad(-12+rnd()*85), d = 55+rnd()*40;
  s.position.set(d*Math.cos(el)*Math.sin(az), d*Math.sin(el), d*Math.cos(el)*Math.cos(az));
  sparkMats.push({ m, hue:rnd(), base:35+rnd()*45 });
  sparkGroup.add(s);
}
sparkGroup.visible = false;

const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null, cubeRT = null, cubeCam = null;
function makeCube(res){
  if (cubeRT) cubeRT.dispose();
  cubeRT = new THREE.WebGLCubeRenderTarget(res, { type:THREE.HalfFloatType, generateMipmaps:true, minFilter:THREE.LinearMipmapLinearFilter });
  cubeCam = new THREE.CubeCamera(0.5, 700, cubeRT);
  cubeCam.position.set(0, 14, 0);
}
makeCube(P.env.res);

function rebakeEnv(){
  domeU.uBright.value = P.env.bright; domeU.uContrast.value = P.env.contrast;
  SB.forEach(({m,base}) => m.material.color.setScalar(20*Math.pow(base/20, P.env.contrast)*P.env.bright));
  sparkGroup.visible = false;
  if (envRT) envRT.dispose();
  envRT = pmrem.fromScene(envScene, 0.035);
  scene.environment = envRT.texture;
  scene.environmentIntensity = P.env.int;
  scene.environmentRotation.y = rad(P.env.rot);
  // gem cube: same studio + HDR sparkle points for scintillation
  if (P.env.sparkle > 0.001){
    sparkGroup.visible = true;
    sparkMats.forEach(({m,hue,base}) => m.color.setHSL(hue, 0.06, 0.58).multiplyScalar(base*P.env.sparkle*P.env.bright));
  }
  cubeCam.update(renderer, envScene);
  sparkGroup.visible = false;
  gemU.uEnv.value = cubeRT.texture;
  gemU.uRot.value = rad(P.env.rot);
}

/* ============================== MATERIALS ============================== */
const metalMat = new THREE.MeshPhysicalMaterial({ metalness:1, roughness:0.16 });
const gemPhys = new THREE.MeshPhysicalMaterial({ metalness:0, transmission:1, roughness:0, ior:2.417, thickness:4.5 });

const gemU = {
  uEnv:{value:null}, uIor:{value:2.417}, uDisp:{value:0.55}, uFres:{value:4}, uBounce:{value:3},
  uSpark:{value:1.1}, uFire:{value:0.4}, uBoost:{value:1.25}, uRefl:{value:1}, uRot:{value:0},
  uInt:{value:1}, uRough:{value:0}, uTint:{value:new THREE.Color('#ffffff')}
};
const gemShader = new THREE.ShaderMaterial({
  uniforms: gemU,
  vertexShader: `
    varying vec3 vW; varying vec3 vN;
    void main(){
      vec3 p = position; vec3 n = normal;
      #ifdef USE_INSTANCING
        p = (instanceMatrix * vec4(p,1.0)).xyz;
        n = mat3(instanceMatrix) * n;
      #endif
      vec4 w = modelMatrix * vec4(p,1.0);
      vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * n);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform samplerCube uEnv;
    uniform float uIor,uDisp,uFres,uSpark,uFire,uBoost,uRefl,uRot,uInt,uRough;
    uniform int uBounce;
    uniform vec3 uTint;
    varying vec3 vW; varying vec3 vN;
    vec3 rotY(vec3 d, float a){ float c=cos(a),s=sin(a); return vec3(c*d.x+s*d.z, d.y, -s*d.x+c*d.z); }
    vec3 env(vec3 d, float l){ return textureCubeLodEXT(uEnv, rotY(d,uRot), l).rgb; }
    void main(){
      vec3 V = normalize(vW - cameraPosition);
      vec3 N = normalize(vN);
      float lod = uRough*5.0;
      float c0 = clamp(dot(N,-V), 0.0, 1.0);
      float F0 = pow((uIor-1.0)/(uIor+1.0), 2.0);
      float F = F0 + (1.0-F0)*pow(1.0-c0, uFres);
      vec3 refl = env(reflect(V,N), lod);
      vec3 B[4];
      B[0]=vec3( 0.62, 0.22,-0.45); B[1]=vec3(-0.45, 0.38, 0.55);
      B[2]=vec3( 0.31,-0.58, 0.42); B[3]=vec3(-0.52,-0.16,-0.60);
      vec3 body = vec3(0.0);
      for (int c=0;c<3;c++){
        float eta = 1.0/(uIor + uDisp*0.08*(float(c)-1.0));
        vec3 T = refract(V, N, eta);
        if (dot(T,T) < 1e-5) T = reflect(V,N);
        vec3 acc = env(T, lod+1.0); float wsum = 1.0;
        vec3 d = T; float w = uSpark;
        for (int b=0;b<4;b++){
          if (b >= uBounce) break;
          d = normalize(reflect(d, normalize(N*0.9 + B[b])));
          acc += env(d, lod+1.0)*w; wsum += w; w *= 0.75;
        }
        body[c] = acc[c]/wsum;
      }
      float lum = dot(body, vec3(0.3333));
      body = max(vec3(0.0), lum + (body-lum)*(1.0+uFire));
      body = pow(body, vec3(uBoost));
      vec3 col = body*uTint*(1.0-F) + refl*clamp(F,0.0,1.0)*uRefl;
      gl_FragColor = vec4(col*uInt, 1.0);
    }`
});

function updateMaterials(){
  const m = P.metal;
  metalMat.color.set(m.color); metalMat.metalness = m.metalness; metalMat.roughness = m.roughness;
  metalMat.envMapIntensity = m.envInt; metalMat.clearcoat = m.clearcoat; metalMat.clearcoatRoughness = m.ccRough;
  metalMat.reflectivity = m.reflectivity; metalMat.specularIntensity = m.specInt; metalMat.specularColor.set(m.specColor);
  metalMat.sheen = m.sheen; metalMat.sheenRoughness = m.sheenRough; metalMat.sheenColor.set(m.sheenColor);

  gemPhys.thickness = gp.thickness; gemPhys.dispersion = gp.dispersion;
  gemPhys.attenuationColor.set(gp.attColor); gemPhys.attenuationDistance = Math.max(0.1, gp.attDist);
  gemPhys.clearcoat = gp.clearcoat; gemPhys.envMapIntensity = gp.envInt; gemPhys.specularIntensity = gp.specInt;
  const g = P.gem;
  gemU.uIor.value=g.ior; gemU.uDisp.value=g.dispersion; gemU.uFres.value=g.fresnel;
  gemU.uBounce.value=Math.round(g.bounces); gemU.uSpark.value=g.sparkle; gemU.uFire.value=g.fire;
  gemU.uBoost.value=g.boost; gemU.uRefl.value=g.refl; gemU.uInt.value=g.envInt; gemU.uRough.value=g.rough;
  gemU.uTint.value.set(g.tint);
  const gm = (P.gemMode === 'Physical (transmission)') ? gemPhys : gemShader;
  gemSurfaces.forEach(o => o.material = gm);
  [metalMat, gemPhys, gemShader, groundMat].forEach(x => x.wireframe = P.scn.wire);
}

/* ============================== GEOMETRY ============================== */
function brilliantGeo({ r=1, table=0.57, crown=0.15, pavilion=0.435, girdle=0.03, star=0.5, lower=0.8, mains=8 }){
  const M = Math.max(5, Math.round(mains)), D = 2*r;
  const yGT = girdle*D/2, yGB = -girdle*D/2;
  const yT = yGT + crown*D, yC = yGB - pavilion*D;
  const rt = Math.min(0.95, table)*r;
  const A = i => i*2*Math.PI/M, H = i => (i+0.5)*2*Math.PI/M;
  const T=[], S=[], Pv=[], GT=[], GB=[];
  for (let i=0;i<M;i++){
    T.push([Math.cos(A(i))*rt, yT, Math.sin(A(i))*rt]);
    const rs = lerp(rt, r, star);
    S.push([Math.cos(H(i))*rs, lerp(yT, yGT, star), Math.sin(H(i))*rs]);
    const rp = Math.max(0.03*r, r*(1 - lower*0.96));
    Pv.push([Math.cos(H(i))*rp, lerp(yGB, yC, lower), Math.sin(H(i))*rp]);
  }
  for (let j=0;j<2*M;j++){
    const a = j*Math.PI/M;
    GT.push([Math.cos(a)*r, yGT, Math.sin(a)*r]);
    GB.push([Math.cos(a)*r, yGB, Math.sin(a)*r]);
  }
  const C = [0, yC, 0], ctr = [0, (yT+yC)/2, 0], tris = [];
  function tri(a,b,c){
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2], vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const cx=(a[0]+b[0]+c[0])/3-ctr[0], cy=(a[1]+b[1]+c[1])/3-ctr[1], cz=(a[2]+b[2]+c[2])/3-ctr[2];
    if (nx*cx+ny*cy+nz*cz < 0) tris.push(...a,...c,...b); else tris.push(...a,...b,...c);
  }
  for (let i=1;i<M-1;i++) tri(T[0], T[i], T[i+1]);
  for (let i=0;i<M;i++){
    const i2=(i+1)%M, im=(i-1+M)%M, j0=2*i, j1=2*i+1, j2=(2*i+2)%(2*M);
    tri(T[i], T[i2], S[i]);
    tri(T[i], S[im], GT[j0]); tri(T[i], GT[j0], S[i]);
    tri(S[i], GT[j0], GT[j1]); tri(S[i], GT[j1], GT[j2]);
    tri(Pv[i], GB[j0], GB[j1]); tri(Pv[i], GB[j1], GB[j2]);
    tri(GB[j0], Pv[im], C); tri(GB[j0], C, Pv[i]);
  }
  for (let j=0;j<2*M;j++){
    const j2=(j+1)%(2*M);
    tri(GT[j], GT[j2], GB[j2]); tri(GT[j], GB[j2], GB[j]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(tris, 3));
  geo.computeVertexNormals();
  return geo;
}

function shankGeo({ innerR, width, thick, square, taper, segs=180, cs=26 }){
  segs = Math.round(segs);
  const pos = new Float32Array(segs*cs*3), idx = [];
  const e = 2/square;
  const sp = (c,p) => Math.sign(c)*Math.pow(Math.abs(c), p);
  for (let i=0;i<segs;i++){
    const th = i/segs*Math.PI*2;
    const ts = 1 - taper*(0.5+0.5*Math.cos(th));
    const a = thick/2*ts, b = width/2*ts, Rm = innerR + a;
    const rx = Math.sin(th), ry = Math.cos(th);
    for (let j=0;j<cs;j++){
      const u = j/cs*Math.PI*2;
      const cx = sp(Math.cos(u), e)*a, cz = sp(Math.sin(u), e)*b;
      const k = (i*cs+j)*3;
      pos[k] = rx*(Rm+cx); pos[k+1] = ry*(Rm+cx); pos[k+2] = cz;
    }
  }
  for (let i=0;i<segs;i++) for (let j=0;j<cs;j++){
    const i2=(i+1)%segs, j2=(j+1)%cs;
    const a=i*cs+j, b=i2*cs+j, c=i2*cs+j2, d=i*cs+j2;
    idx.push(a,c,b, a,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _up = new THREE.Vector3(0,1,0);
function cylBetween(p1, p2, r, capsule){
  const d = new THREE.Vector3().subVectors(p2, p1), len = d.length();
  const geo = capsule ? new THREE.CapsuleGeometry(r, len, 4, 12) : new THREE.CylinderGeometry(r, r, len, 14);
  const mesh = new THREE.Mesh(geo, metalMat);
  mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(_up, d.normalize());
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

const ringGroup = new THREE.Group();
scene.add(ringGroup);
let gemSurfaces = [], centerStone = null;

function rebuildRing(){
  ringGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.isInstancedMesh) o.dispose(); });
  ringGroup.clear();
  gemSurfaces = [];
  const B=P.band, H=P.head, S=P.stone;
  const gm = (P.gemMode === 'Physical (transmission)') ? gemPhys : gemShader;
  const sD=S.diameter, sR=sD/2, g=H.haloGem;
  const cut = { table:S.table, crown:S.crown, pavilion:S.pavilion, girdle:S.girdle, star:S.star, lower:S.lower, mains:S.mains };
  const ts = t => 1 - B.taper*(0.5+0.5*Math.cos(t));
  const outerAt = t => B.innerR + B.thick*ts(t);

  // shank
  const shank = new THREE.Mesh(shankGeo(B), metalMat);
  shank.castShadow = shank.receiveShadow = true;
  ringGroup.add(shank);

  // pavé gems + beads on band
  const melee = brilliantGeo({ r:0.5, ...cut });
  const nPave = Math.round(B.paveCount);
  if (nPave > 0){
    const pave = new THREE.InstancedMesh(melee, gm, nPave*2);
    pave.castShadow = true;
    const beadGeo = new THREE.SphereGeometry(1, 10, 8);
    const beads = B.paveBeads ? new THREE.InstancedMesh(beadGeo, metalMat, nPave*2*4) : null;
    let bi = 0;
    for (let side=0; side<2; side++){
      const sgn = side ? -1 : 1;
      for (let i=0;i<nPave;i++){
        const th = sgn * rad(lerp(B.paveStart, B.paveEnd, nPave>1 ? i/(nPave-1) : 0));
        const rdir = _p.set(Math.sin(th), Math.cos(th), 0).clone();
        const tdir = new THREE.Vector3(Math.cos(th), -Math.sin(th), 0);
        _q.setFromUnitVectors(_up, rdir);
        _m.compose(rdir.clone().multiplyScalar(outerAt(th) - B.paveInset*B.paveSize), _q, _s.setScalar(B.paveSize));
        pave.setMatrixAt(side*nPave+i, _m);
        if (beads){
          const br = B.beadSize*B.paveSize*0.5;
          for (const [u,v] of [[0.5,0.55],[-0.5,0.55],[0.5,-0.55],[-0.5,-0.55]]){
            const bp = rdir.clone().multiplyScalar(outerAt(th) - br*0.35)
              .add(tdir.clone().multiplyScalar(u*B.paveSize))
              .add(new THREE.Vector3(0,0,v*B.paveSize));
            _m.compose(bp, _q, _s.setScalar(br));
            beads.setMatrixAt(bi++, _m);
          }
        }
      }
    }
    pave.instanceMatrix.needsUpdate = true;
    ringGroup.add(pave); gemSurfaces.push(pave);
    if (beads){ beads.instanceMatrix.needsUpdate = true; beads.castShadow = true; ringGroup.add(beads); }
  }

  // head
  const head = new THREE.Group();
  head.position.y = outerAt(0) + H.lift;
  ringGroup.add(head);
  const cirR = sR + H.haloGap + g/2;

  // halo metal: seat torus + under rail
  const tube = 0.75*g*H.rim;
  const seat = new THREE.Mesh(new THREE.TorusGeometry(cirR, tube, 18, 72).rotateX(Math.PI/2), metalMat);
  seat.position.y = -0.18*g - tube*0.8;
  seat.castShadow = seat.receiveShadow = true;
  head.add(seat);
  const under = new THREE.Mesh(new THREE.TorusGeometry(cirR*0.88, 0.28, 12, 60).rotateX(Math.PI/2), metalMat);
  under.position.y = -1.15*g;
  under.castShadow = under.receiveShadow = true;
  head.add(under);

  // halo gems
  const nH = Math.round(H.haloCount);
  const haloGems = new THREE.InstancedMesh(melee, gm, nH);
  haloGems.castShadow = true;
  const hBeads = H.beads ? new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8), metalMat, nH*2) : null;
  for (let i=0;i<nH;i++){
    const ph = i/nH*Math.PI*2 + Math.PI/nH;
    const pos = new THREE.Vector3(Math.cos(ph)*cirR, 0.12*g, Math.sin(ph)*cirR);
    const tan = new THREE.Vector3(-Math.sin(ph), 0, Math.cos(ph));
    _q.setFromAxisAngle(tan, rad(H.haloTilt));
    _m.compose(pos, _q, _s.setScalar(g));
    haloGems.setMatrixAt(i, _m);
    if (hBeads){
      const ph2 = (i+0.5)/nH*Math.PI*2 + Math.PI/nH;
      const br = 0.16*g;
      [[cirR+0.36*g],[cirR-0.36*g]].forEach(([rr], k) => {
        _m.compose(new THREE.Vector3(Math.cos(ph2)*rr, 0.14*g, Math.sin(ph2)*rr), _q.identity(), _s.setScalar(br));
        hBeads.setMatrixAt(i*2+k, _m);
      });
    }
  }
  haloGems.instanceMatrix.needsUpdate = true;
  head.add(haloGems); gemSurfaces.push(haloGems);
  if (hBeads){ hBeads.instanceMatrix.needsUpdate = true; hBeads.castShadow = true; head.add(hBeads); }

  // center stone
  const stone = new THREE.Mesh(brilliantGeo({ r:sR, ...cut }), gm);
  stone.position.y = H.stoneLift;
  stone.castShadow = true;
  centerStone = stone;
  head.add(stone); gemSurfaces.push(stone);

  // basket rail + prongs
  const rail = new THREE.Mesh(new THREE.TorusGeometry(sR*0.62, 0.3, 10, 48).rotateX(Math.PI/2), metalMat);
  rail.position.y = H.stoneLift - H.basketDrop;
  rail.castShadow = rail.receiveShadow = true;
  head.add(rail);
  const nP = Math.round(H.prongs);
  const crownTop = H.stoneLift + S.crown*sD*0.7;
  for (let i=0;i<nP;i++){
    const ph = (i+0.5)/nP*Math.PI*2;
    const dir = new THREE.Vector3(Math.cos(ph), 0, Math.sin(ph));
    const p1 = dir.clone().multiplyScalar(sR*0.72); p1.y = H.stoneLift - H.basketDrop;
    const p2 = dir.clone().multiplyScalar(sR + H.prongFlare); p2.y = crownTop;
    head.add(cylBetween(p1, p2, H.prongDia/2, true));
  }

  // shoulder posts: shank → halo underside
  const thp = Math.asin(Math.min(0.9, (cirR*0.82)/outerAt(0)));
  for (const sgn of [1,-1]){
    const t2 = sgn*thp;
    const p1 = new THREE.Vector3(Math.sin(t2), Math.cos(t2), 0).multiplyScalar(outerAt(t2) - 0.25);
    const p2 = new THREE.Vector3(sgn*cirR*0.82, head.position.y - 1.0*g, 0);
    ringGroup.add(cylBetween(p1, p2, 0.5));
  }

  ringGroup.position.y = B.innerR + B.thick;
  ringGroup.rotation.y = -0.55;
  ringGroup.rotation.x = 0.21;
}

function makeSpot(shadow){
  const l = new THREE.SpotLight(0xffffff, 1);

  if (shadow){

  }
  return l;
}

function placeSpherical(l, c){
  const ce = Math.cos(rad(c.el));
  l.position.set(c.dist*ce*Math.sin(rad(c.az)), 12 + c.dist*Math.sin(rad(c.el)), c.dist*ce*Math.cos(rad(c.az)));
}
function updateLights(){

    l.angle = rad(Math.min(89, c.angle)); l.penumbra = c.pen;
    placeSpherical(l, c);
  }
  const k = P.lights.key;
  keyL.castShadow = k.shadow;
  keyL.shadow.radius = k.radius; keyL.shadow.blurSamples = Math.round(k.blur);
  keyL.shadow.bias = k.bias; keyL.shadow.normalBias = k.normalBias;

/* ============================== POST ============================== */
const GradeShader = {
  uniforms: { tDiffuse:{value:null}, uVig:{value:0.35}, uVigSoft:{value:0.6}, uGrain:{value:0.045},
              uCon:{value:1.02}, uSat:{value:1.0}, uCA:{value:0.0012}, uTime:{value:0} },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uVig,uVigSoft,uGrain,uCon,uSat,uCA,uTime;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)) + uTime)*43758.5453); }
    void main(){
      vec2 d = vUv - 0.5;
      float r = length(d);
      vec2 off = d*r*r*uCA*3.0;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv+off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv-off).b;
      col = (col-0.5)*uCon + 0.5;
      float l = dot(col, vec3(0.2126,0.7152,0.0722));
      col = mix(vec3(l), col, uSat);
      float f = smoothstep(1.0-uVigSoft, 1.15, r*1.4142);
      col *= 1.0 - uVig*f;
      col += (hash(vUv*913.0)-0.5)*uGrain;
      gl_FragColor = vec4(col, 1.0);
    }`
};
const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type:THREE.HalfFloatType, samples:4 }));
composer.addPass(new RenderPass(scene, camera));

const TONES = { 'None':THREE.NoToneMapping, 'Linear':THREE.LinearToneMapping, 'Reinhard':THREE.ReinhardToneMapping,
                'Cineon':THREE.CineonToneMapping, 'ACES':THREE.ACESFilmicToneMapping, 'AgX':THREE.AgXToneMapping,
                'Neutral':THREE.NeutralToneMapping };
function updatePost(){
  renderer.toneMapping = TONES[P.post.tone];
  renderer.toneMappingExposure = P.cam.exposure;
  bloomPass.enabled = P.post.bloom;
  bloomPass.threshold = P.post.bloomTh; bloomPass.strength = P.post.bloomStr; bloomPass.radius = P.post.bloomRad;
  const u = gradePass.uniforms;
  u.uVig.value = P.post.vig; u.uVigSoft.value = P.post.vigSoft; u.uGrain.value = P.post.grain;
  u.uCon.value = P.post.contrast; u.uSat.value = P.post.sat; u.uCA.value = P.post.ca;
  bokehPass.enabled = P.post.dofOn;
  bokehPass.uniforms.focus.value = P.post.dofFocus;
  bokehPass.uniforms.aperture.value = P.post.dofAperture;

}

bind(fDof, P.post, 'dofMaxblur', 0, 0.02, 0.001, 'Max blur', UP);

const fShad = gui.addFolder('Shaders — diamond');
bind(fShad, P.gem, 'ior', 1.2, 3.2, 0.005, 'IOR', UM);
bind(fShad, P.gem, 'dispersion', 0, 3, 0.01, 'Dispersion', UM);
bind(fShad, P.gem, 'fresnel', 0.5, 12, 0.1, 'Fresnel power', UM);
bind(fShad, P.gem, 'bounces', 0, 4, 1, 'Internal bounces', UM);
bind(fShad, P.gem, 'sparkle', 0, 4, 0.02, 'Sparkle intensity', UM);
bind(fShad, P.gem, 'fire', 0, 3, 0.02, 'Fire (chroma)', UM);
bind(fShad, P.gem, 'boost', 0.4, 3, 0.02, 'Contrast boost', UM);
bind(fShad, P.gem, 'refl', 0, 3, 0.02, 'Surface reflection', UM);
fShad.addColor(P.gem, 'tint').name('Body tint').onChange(UM);
bind(fShad, P.gem, 'envInt', 0, 4, 0.02, 'Gem env intensity', UM);
bind(fShad, P.gem, 'rough', 0, 1, 0.01, 'Facet blur', UM);

const fScn = gui.addFolder('Scene');
fScn.addColor(P.scn, 'bgTop').name('Background top').onChange(US);
fScn.addColor(P.scn, 'bgBot').name('Background bottom').onChange(US);
fScn.add(P.scn, 'ground').name('Ground').onChange(US);
bind(fScn, P.scn, 'shadowOp', 0, 1, 0.01, 'Shadow opacity', US);
bind(fScn, P.scn, 'contact', 0, 1, 0.01, 'Contact shadow', US);
bind(fScn, P.scn, 'contactSize', 0.3, 3, 0.05, 'Contact size', US);
fScn.add(P.scn, 'phys').name('Physical floor').onChange(US);
fScn.addColor(P.scn, 'gColor').name('Floor color').onChange(US);
bind(fScn, P.scn, 'gRough', 0, 1, 0.01, 'Floor roughness', US);
fScn.add(P.scn, 'wire').name('Wireframe').onChange(US);
fScn.add(P.scn, 'stats').name('FPS stats').onChange(US);

/* presets */
function deepSet(dst, src){ for (const k in src){
  if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])){ if (!dst[k]) dst[k] = {}; deepSet(dst[k], src[k]); }
  else dst[k] = src[k]; } }
const BUILTINS = {
  'Platinum Studio': {},
  'Champagne Gold': {
    metal:{ color:'#e7c079', roughness:0.2, envInt:1.1 },
    scn:{ bgTop:'#eae3d7', bgBot:'#9e9385' },
    lights:{ key:{ color:'#fff3e0' } },
    gem:{ fire:0.55, tint:'#fffaf0' },
    post:{ vig:0.4 }
  },
  'Noir Editorial': {
    scn:{ bgTop:'#1a1b20', bgBot:'#050507', shadowOp:0.55 },
    lights:{ key:{ int:1.6 }, fill:{ int:0.3 }, rim:{ int:4.5, color:'#dfe8ff' } },
    env:{ bright:0.6, contrast:1.3, sparkle:1.6 },
    metal:{ roughness:0.12 },
    gem:{ fire:0.65, boost:2.2 },
    post:{ bloomStr:0.3, bloomTh:1.25, vig:0.52, grain:0.06 }
  }
};
function refreshGUI(){ gui.controllersRecursive().forEach(c => c.updateDisplay()); }
function applyAll(){ updateMaterials(); rebuildRing(); updateLights(); updateCamera(); updatePost(); updateScene(); rebakeEnv(); }
const presetCtl = {
  preset: 'Platinum Studio',
  copy(){
    const json = JSON.stringify(P, null, 2);
    (navigator.clipboard?.writeText(json) || Promise.reject()).then(
      () => toast('State copied to clipboard'),
      () => { window.prompt('Copy preset JSON:', json); });
  },
  paste(){
    const t = window.prompt('Paste preset JSON:');
    if (!t) return;
    try { deepSet(P, JSON.parse(t)); applyAll(); refreshGUI(); toast('Preset loaded'); }
    catch(e){ toast('Invalid JSON'); }
  },
  reset(){ deepSet(P, structuredClone(DEFAULTS)); applyAll(); refreshGUI(); toast('Reset to defaults'); }
};
const fPre = gui.addFolder('Presets');
fPre.add(presetCtl, 'preset', Object.keys(BUILTINS)).name('Built-in').onChange(name => {
  const base = structuredClone(DEFAULTS);
  deepSet(base, BUILTINS[name]);
  deepSet(P, base);
  applyAll(); refreshGUI(); toast(name);
});
fPre.add(presetCtl, 'copy').name('Copy state (JSON)');
fPre.add(presetCtl, 'paste').name('Paste state (JSON)');
fPre.add(presetCtl, 'reset').name('Reset');

fMat.close(); fLight.close(); fCam.close(); fPost.close(); fDof.close(); fShad.close(); fScn.close();
gui.hide();

/* ============================== BOOT / LOOP ============================== */
applyAll();
const _stoneW = new THREE.Vector3();
function syncFocus(){
  if (centerStone) centerStone.getWorldPosition(_stoneW); else _stoneW.copy(controls.target);
  P.post.dofFocus = camera.position.distanceTo(_stoneW);
  bokehPass.uniforms.focus.value = P.post.dofFocus;
  dofFocusCtl.updateDisplay();
}
syncFocus();
controls.addEventListener('change', syncFocus);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

let t = 0;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  t += clock.getDelta();
  gradePass.uniforms.uTime.value = t % 100;
  controls.update();
  if (controls.autoRotate) syncFocus();
  composer.render();
  if (P.scn.stats) stats.update();
});
window.__ok = true;
</script>
</body>
</html>
