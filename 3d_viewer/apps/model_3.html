<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Night Well - Pixar Horror</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
  #stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0b1220 0%,#000000 70%)}
  #frame{position:relative;height:95vh;aspect-ratio:9/16;max-width:95vw;background:#050810;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.9),inset 0 0 0 1px rgba(150,180,255,0.08)}
  canvas{display:block;width:100%;height:100%}
  #frame::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.85) 100%),linear-gradient(to bottom,rgba(10,20,40,0.3)0%,transparent 20%,transparent 80%,rgba(0,0,0,0.6)100%);mix-blend-mode:multiply;z-index:3}
  #frame::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.015)0px,transparent 2px,transparent 4px);opacity:0.3;z-index:4;mix-blend-mode:soft-light}
  .ui{position:absolute;left:20px;right:20px;z-index:5;color:#b9d0ff;text-shadow:0 2px 10px #000,0 0 20px rgba(100,150,255,0.3);pointer-events:none}
  #title{top:22px;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;opacity:0.85;font-weight:600}
  #hint{bottom:20px;text-align:center;font-size:11px;letter-spacing:0.12em;opacity:0.6}
  #vignette{position:absolute;inset:-10%;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(5,10,25,0.4) 70%,rgba(0,0,0,0.8) 100%);pointer-events:none;z-index:2}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage">
  <div id="frame">
    <div id="vignette"></div>
    <div class="ui" id="title">THE WELL • 02:17 AM</div>
    <div class="ui" id="hint">tap to flicker flashlight • move to look around</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const frame = document.getElementById('frame');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080f);
scene.fog = new THREE.FogExp2(0x0a1428, 0.028);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
frame.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(32, 9/16, 0.1, 100);
camera.position.set(1.6, 1.25, 4.6);

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
const bokehPass = new BokehPass(scene, camera, {
  focus: 4.2,
  aperture: 0.00015,
  maxblur: 0.006
});
const outputPass = new OutputPass();
composer.addPass(renderPass);
composer.addPass(bokehPass);
composer.addPass(outputPass);

// Toon gradient
function makeToonMap() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 1;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,256,0);
  g.addColorStop(0,'#222'); g.addColorStop(0.3,'#444'); g.addColorStop(0.5,'#777'); g.addColorStop(1,'#fff');
  ctx.fillStyle = g; ctx.fillRect(0,0,256,1);
  const t = new THREE.CanvasTexture(c); t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter;
  return t;
}
const toonMap = makeToonMap();

// Lights
scene.add(new THREE.HemisphereLight(0x6b88c8, 0x05070a, 0.4));
const moon = new THREE.DirectionalLight(0xa8c3ff, 1.6);
moon.position.set(-4, 12, -6);
moon.castShadow = true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.near = 1; moon.shadow.camera.far = 30;
moon.shadow.camera.left = -8; moon.shadow.camera.right = 8; moon.shadow.camera.top = 8; moon.shadow.camera.bottom = -8;
moon.shadow.bias = -0.0005;
scene.add(moon);

const moonFill = new THREE.PointLight(0x7da0ff, 0.8, 20);
moonFill.position.set(-3,9,-5); scene.add(moonFill);

// Moon mesh
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8,32,32), new THREE.MeshBasicMaterial({color:0xd8e4ff}));
moonMesh.position.set(-7,11,-14); scene.add(moonMesh);
const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({color:0xb3c9ff, transparent:true, opacity:0.15, blending:THREE.AdditiveBlending}));
moonGlow.scale.setScalar(6); moonGlow.position.copy(moonMesh.position); scene.add(moonGlow);

// Ground
const groundMat = new THREE.MeshToonMaterial({color:0x0c1220, gradientMap:toonMap});
const ground = new THREE.Mesh(new THREE.CircleGeometry(22,64), groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// grass patches
for(let i=0;i<80;i++){
  const g = new THREE.Mesh(new THREE.ConeGeometry(0.05+Math.random()*0.08,0.15+Math.random()*0.2,4), new THREE.MeshToonMaterial({color:0x122038, gradientMap:toonMap}));
  const a = Math.random()*Math.PI*2, r = 1.5+Math.random()*12;
  g.position.set(Math.cos(a)*r,0,Math.sin(a)*r); g.rotation.y = Math.random();
  scene.add(g);
}

// Village silhouettes
const houseMat = new THREE.MeshToonMaterial({color:0x060a14, gradientMap:toonMap});
[ [-5, -4, 1.2], [4.5,-5,1.5], [-6,2,0.9], [5.5,3,1.1], [0,-8,1.4] ].forEach(([x,z,s])=>{
  const h = new THREE.Mesh(new THREE.BoxGeometry(1.5*s,1.2*s,1.8*s), houseMat);
  h.position.set(x,0.6*s,z); h.castShadow=true; scene.add(h);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(1.2*s,0.7*s,4), new THREE.MeshToonMaterial({color:0x04060c, gradientMap:toonMap}));
  roof.position.set(x,1.2*s+0.35*s,z); roof.rotation.y=Math.PI/4; scene.add(roof);
  if(Math.random()>0.3){ const w = new THREE.Mesh(new THREE.PlaneGeometry(0.15,0.15), new THREE.MeshBasicMaterial({color:0xffd899, side:2})); w.position.set(x+0.76*s,0.7*s,z); scene.add(w); }
});

// Well
const well = new THREE.Group(); scene.add(well);
const stoneMat = new THREE.MeshToonMaterial({color:0x5e6777, gradientMap:toonMap});
for(let i=0;i<6;i++){
  const r = 0.92 - i*0.01;
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(r, r*1.05, 0.22, 16), stoneMat);
  ring.position.y = 0.11 + i*0.21; ring.castShadow=true; ring.receiveShadow=true; well.add(ring);
}
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.92,0.12,12,24), stoneMat); rim.position.y=1.34; rim.rotation.x=Math.PI/2; rim.castShadow=true; well.add(rim);
const woodMat = new THREE.MeshToonMaterial({color:0x3a2e25, gradientMap:toonMap});
const post1 = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,1.6,8), woodMat); post1.position.set(-0.75,1.9,0); post1.castShadow=true; well.add(post1);
const post2 = post1.clone(); post2.position.x=0.75; well.add(post2);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.8,8), woodMat); beam.rotation.z=Math.PI/2; beam.position.y=2.65; beam.castShadow=true; well.add(beam);
const bucket = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.15,0.22,12), new THREE.MeshToonMaterial({color:0x2a211b, gradientMap:toonMap}));
bucket.position.set(0,1.9,0.2); well.add(bucket);
const rope = new THREE.Line(new THREE.BufferGeometry().setFromPoints([ new THREE.Vector3(0,2.65,0), new THREE.Vector3(0,2.0,0.2) ]), new THREE.LineBasicMaterial({color:0x2b221a})); well.add(rope);
const water = new THREE.Mesh(new THREE.CircleGeometry(0.78,32), new THREE.MeshBasicMaterial({color:0x050a12, transparent:true, opacity:0.95}));
water.rotation.x=-Math.PI/2; water.position.y=0.3; well.add(water);

// Fog particles
const fogGeo = new THREE.BufferGeometry();
const fogCount = 250; const fogPos = new Float32Array(fogCount*3);
for(let i=0;i<fogCount;i++){ fogPos[i*3]=(Math.random()-0.5)*14; fogPos[i*3+1]=Math.random()*3+0.1; fogPos[i*3+2]=(Math.random()-0.5)*14-2; }
fogGeo.setAttribute('position', new THREE.BufferAttribute(fogPos,3));
const fogMat = new THREE.PointsMaterial({size:0.4, color:0x9db8ff, transparent:true, opacity:0.07, depthWrite:false, blending:THREE.AdditiveBlending});
const fogPoints = new THREE.Points(fogGeo, fogMat); scene.add(fogPoints);

// Boy
const boy = new THREE.Group(); scene.add(boy);
boy.position.set(0.5,0,3.8);

const skinMat = new THREE.MeshToonMaterial({color:0xf0c6a6, gradientMap:toonMap});
const shirtMat = new THREE.MeshToonMaterial({color:0x2c6bff, gradientMap:toonMap});
const pantsMat = new THREE.MeshToonMaterial({color:0x0b0e14, gradientMap:toonMap});
const hairMat = new THREE.MeshToonMaterial({color:0x070709, gradientMap:toonMap});
const shoeMat = new THREE.MeshToonMaterial({color:0x1a1f28, gradientMap:toonMap});

const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.26,0.52,4,12), shirtMat); torso.position.y=1.02; torso.castShadow=true; boy.add(torso);
const hips = new THREE.Mesh(new THREE.CapsuleGeometry(0.24,0.14,4,10), pantsMat); hips.position.y=0.7; hips.castShadow=true; boy.add(hips);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.255,24,24), skinMat); head.position.y=1.56; head.castShadow=true; boy.add(head);
const hair = new THREE.Mesh(new THREE.SphereGeometry(0.27,24,18,0,Math.PI*2,0,Math.PI*0.63), hairMat); hair.position.y=1.59; hair.scale.y=0.85; boy.add(hair);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.09,0.12,12), skinMat); neck.position.y=1.32; boy.add(neck);

// face scared
const eyeW = new THREE.MeshBasicMaterial({color:0xffffff});
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.045,16,16), eyeW); eyeL.position.set(-0.08,1.58,0.22); boy.add(eyeL);
const eyeR = eyeL.clone(); eyeR.position.x=0.08; boy.add(eyeR);
const pupilMat = new THREE.MeshBasicMaterial({color:0x0a0c12});
const pL = new THREE.Mesh(new THREE.SphereGeometry(0.02,12,12), pupilMat); pL.position.set(-0.08,1.60,0.26); boy.add(pL);
const pR = pL.clone(); pR.position.x=0.08; boy.add(pR);
const browMat = new THREE.MeshBasicMaterial({color:0x050507});
const browL = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.012,0.012), browMat); browL.position.set(-0.08,1.66,0.23); browL.rotation.z=0.35; boy.add(browL);
const browR = browL.clone(); browR.position.x=0.08; browR.rotation.z=-0.35; boy.add(browR);
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.03,0.006,8,16, Math.PI), new THREE.MeshBasicMaterial({color:0x5a3a2e}));
mouth.position.set(0,1.48,0.24); mouth.rotation.x=0.2; mouth.rotation.z=Math.PI; boy.add(mouth);

// limbs
function limb(col, len){ const m=new THREE.Mesh(new THREE.CapsuleGeometry(0.07,len,4,8), col); m.castShadow=true; return m; }
const legL = limb(pantsMat,0.5); legL.position.set(-0.11,0.38,0); boy.add(legL);
const legR = legL.clone(); legR.position.x=0.11; boy.add(legR);
const shoeL = new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.12,4,8), shoeMat); shoeL.rotation.x=Math.PI/2; shoeL.position.set(-0.11,0.08,0.05); boy.add(shoeL);
const shoeR = shoeL.clone(); shoeR.position.x=0.11; boy.add(shoeR);
const armL = limb(shirtMat,0.45); armL.position.set(-0.33,1.0,0); boy.add(armL);
const armR = limb(shirtMat,0.45); armR.position.set(0.33,1.0,0); boy.add(armR);

// flashlight
const flashGroup = new THREE.Group(); boy.add(flashGroup);
const flash = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.04,0.18,12), new THREE.MeshToonMaterial({color:0x222831, gradientMap:toonMap}));
flash.rotation.x=Math.PI/2; flashGroup.add(flash);
const flashHead = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.04,0.05,12), new THREE.MeshBasicMaterial({color:0x9fb4ff})); flashHead.position.z=0.11; flashHead.rotation.x=Math.PI/2; flashGroup.add(flashHead);
flashGroup.position.set(0.33,0.78,0.22);

const spot = new THREE.SpotLight(0xffe9b0, 3.2, 12, Math.PI/7, 0.4, 1.2);
spot.castShadow = true; spot.shadow.mapSize.set(1024,1024);
spot.position.set(0,0,0); flashGroup.add(spot); spot.target.position.set(0,0,-1); flashGroup.add(spot.target);

// interaction
let mouse = {x:0,y:0}, targetLook = new THREE.Vector3(0,1.1,0);
window.addEventListener('pointermove', e=>{ const r=frame.getBoundingClientRect(); mouse.x = ((e.clientX-r.left)/r.width-0.5)*2; mouse.y = ((e.clientY-r.top)/r.height-0.5)*-2; });
frame.addEventListener('click', ()=>{ spot.intensity = spot.intensity>1?0.3:3.5; });

// animate
const clock = new THREE.Clock();
function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const cycle = t % 11;

  // walk toward well
  let walkPhase = Math.min(cycle/3.2,1);
  boy.position.z = THREE.MathUtils.lerp(3.6, 1.05, ease(walkPhase));
  boy.position.x = THREE.MathUtils.lerp(0.6, 0.15, ease(walkPhase));

  if(cycle < 3.2){
    const s = Math.sin(t*7)*0.25;
    legL.rotation.x = s; legR.rotation.x = -s;
    armL.rotation.x = -s*0.7; armR.rotation.x = s*0.7;
    torso.position.y = 1.02 + Math.abs(Math.sin(t*7))*0.03;
    head.rotation.x = 0.05;
  } else {
    legL.rotation.x *=0.9; legR.rotation.x*=0.9; armL.rotation.x*=0.9; armR.rotation.x*=0.9;
  }

  // lean to listen
  const lean = THREE.MathUtils.clamp((cycle-3.2)/1.4,0,1);
  torso.rotation.x = lean * 0.62;
  head.rotation.x = lean * 0.35 + 0.05;
  neck.rotation.x = lean*0.2;
  armR.rotation.x = -0.9 - lean*0.6;
  armR.rotation.z = -0.2;
  flashGroup.position.y = 0.78 - lean*0.15;
  flashGroup.position.z = 0.22 + lean*0.35;
  flashGroup.rotation.x = -lean*0.7;

  // scared tremble
  const trem = (cycle>4) ? 0.003 : 0.001;
  boy.rotation.z = Math.sin(t*22)*trem;
  head.rotation.z = Math.sin(t*18)*trem*1.5;
  pL.position.y = 1.60 + Math.sin(t*3)*0.003;
  pR.position.y = pL.position.y;

  // flashlight flicker after lean
  if(cycle>4.5){
    spot.intensity = 2.8 + Math.random()*0.5 + Math.sin(t*40)*0.15;
    spot.angle = Math.PI/7 + Math.random()*0.01;
  }
  // point at well
  const wellTarget = new THREE.Vector3(0,0.5,0);
  spot.target.position.lerp(wellTarget.clone().sub(flashGroup.getWorldPosition(new THREE.Vector3())),0.1);

  // fog drift
  const pos = fogGeo.attributes.position;
  for(let i=0;i<fogCount;i++){ pos.array[i*3+1] += 0.0015; if(pos.array[i*3+1]>3.2) pos.array[i*3+1]=0.1; pos.array[i*3] += Math.sin(t*0.2+i)*0.0008; }
  pos.needsUpdate=true;

  // camera low cinematic + mouse parallax
  const camX = 1.6 + mouse.x*0.25;
  const camY = 1.25 + mouse.y*0.15;
  camera.position.x += (camX - camera.position.x)*0.03;
  camera.position.y += (camY - camera.position.y)*0.03;
  targetLook.x = mouse.x*0.1; targetLook.y = 1.1 + mouse.y*0.05;
  camera.lookAt(targetLook);

  // subtle DOF focus towards boy
  bokehPass.uniforms['focus'].value = THREE.MathUtils.lerp(bokehPass.uniforms['focus'].value, 3.8 - lean*0.6, 0.02);

  // moon godrays subtle pulse
  moon.intensity = 1.6 + Math.sin(t*0.5)*0.05;

  composer.render();
}
animate();

// resize
function resize(){
  const w = frame.clientWidth, h = frame.clientHeight;
  renderer.setSize(w,h); composer.setSize(w,h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(frame); resize();
</script>
</body>
</html>
