<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levitating Lava</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(circle at 50% 28%, #2a1204 0%, #120703 35%, #050308 65%, #000000 100%);}
canvas{display:block}
.ui{
  position:absolute;top:24px;left:24px;z-index:10;
  width:300px;padding:22px 22px 18px;
  background:rgba(12,8,6,0.55);
  border:1px solid rgba(255,90,30,0.18);
  border-radius:18px;
  backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  color:#ffe9d5;
}
.ui h1{
  font-size:16px;letter-spacing:0.18em;font-weight:600;
  color:#ff8a4a;margin-bottom:18px;text-transform:uppercase;
}
.control{margin:14px 0 18px}
.control label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;letter-spacing:0.04em;color:#ffcab1;opacity:0.9;margin-bottom:10px
}
.control label span{
  font-variant-numeric:tabular-nums;color:#ff7a32;font-weight:600;
  background:rgba(255,90,30,0.12);padding:2px 8px;border-radius:8px;
  border:1px solid rgba(255,90,30,0.25)
}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:3px;
  background:linear-gradient(to right,#ff4500 0%,#ff4500 50%,rgba(255,255,255,0.12) 50%,rgba(255,255,255,0.12) 100%);
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle,#ff9a62 0%,#ff5a1a 60%,#c23a00 100%);
  border:2px solid rgba(0,0,0,0.6);box-shadow:0 0 12px rgba(255,90,20,0.8),0 0 24px rgba(255,60,0,0.4);
  cursor:pointer;transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#ff5a1a;border:2px solid #000;
  box-shadow:0 0 12px rgba(255,90,20,0.8);cursor:pointer;
}
button{
  width:100%;padding:11px 12px;margin-top:4px;
  background:linear-gradient(180deg,rgba(255,90,30,0.22),rgba(255,60,10,0.16));
  border:1px solid rgba(255,100,40,0.35);color:#ffd1b8;
  border-radius:12px;font-size:13px;letter-spacing:0.06em;font-weight:600;
  cursor:pointer;backdrop-filter:blur(6px);transition:all .2s;
}
button:hover{background:linear-gradient(180deg,rgba(255,100,40,0.32),rgba(255,70,15,0.22));box-shadow:0 0 20px rgba(255,80,20,0.25);transform:translateY(-1px)}
button:active{transform:translateY(0)}
.hint{margin-top:14px;font-size:11px;line-height:1.5;color:#d9b8a5;opacity:0.7}
@media (max-width:600px){.ui{left:12px;right:12px;top:12px;width:auto}}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div class="ui">
  <h1>Levitating Lava</h1>
  <div class="control">
    <label>Viscosity <span id="viscVal">0.50</span></label>
    <input type="range" id="viscosity" min="1" max="100" value="50">
  </div>
  <button id="reset">Reset Flow</button>
  <p class="hint">Left Click: Rotate • Scroll: Zoom • Slider: Adjust Thickness</p>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

let viscosity = 0.5;
const viscSlider = document.getElementById('viscosity');
const viscVal = document.getElementById('viscVal');
const resetBtn = document.getElementById('reset');

function updateSlider(){
  const p = viscSlider.value;
  viscSlider.style.background = `linear-gradient(to right,#ff4500 0%,#ff4500 ${p}%,rgba(255,255,255,0.12) ${p}%,rgba(255,255,255,0.12) 100%)`;
}
updateSlider();
viscSlider.addEventListener('input', e=>{
  viscosity = e.target.value/100;
  viscVal.textContent = viscosity.toFixed(2);
  updateSlider();
});

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.055);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 6.2);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.5;
controls.maxDistance = 11;
controls.target.set(0,0,0);
controls.autoRotate = false;

const ambient = new THREE.AmbientLight(0x22140f, 0.5);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffc4a3, 1.1);
keyLight.position.set(4,8,5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024,1024);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -7; keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7; keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff4500, 3.5, 12, 2);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

const lavaLight = new THREE.PointLight(0xff6600, 2.2, 8);
lavaLight.position.set(0,3.2,0);
scene.add(lavaLight);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7,64),
  new THREE.MeshStandardMaterial({color:0x0a0604, roughness:0.92, metalness:0, emissive:0x050200, emissiveIntensity:0.2})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -3;
ground.receiveShadow = true;
scene.add(ground);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 64, 64),
  new THREE.MeshStandardMaterial({
    color:0x0b0b0f, 
    metalness:0.95, 
    roughness:0.22,
    envMapIntensity:1
  })
);
sphere.castShadow = true;
sphere.receiveShadow = true;
scene.add(sphere);

const sphereEnv = new THREE.Mesh(
  new THREE.SphereGeometry(1.53, 32, 32),
  new THREE.MeshBasicMaterial({color:0xff3000, transparent:true, opacity:0.04, blending:THREE.AdditiveBlending})
);
scene.add(sphereEnv);

// Composer
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.25, 0.65, 0.55);
composer.addPass(bloom);

// Lava Particles
const MAX = 1400;
const PR = 0.09;
const geo = new THREE.IcosahedronGeometry(1, 2);
const mat = new THREE.MeshPhysicalMaterial({
  color:0xff3a00,
  emissive:0xff4500,
  emissiveIntensity:2.4,
  roughness:0.25,
  metalness:0,
  clearcoat:0.3,
  clearcoatRoughness:0.4,
  transmission:0.0
});
const lava = new THREE.InstancedMesh(geo, mat, MAX);
lava.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
lava.frustumCulled = false;
scene.add(lava);

const positions = new Array(MAX);
const oldPos = new Array(MAX);
for(let i=0;i<MAX;i++){positions[i]=new THREE.Vector3(); oldPos[i]=new THREE.Vector3();}
const active = new Uint8Array(MAX);
const life = new Float32Array(MAX);
let nextIdx = 0;
let activeCount = 0;
const constraints = [];
const lastSpawned = [];
const dummy = new THREE.Object3D();
const tempV = new THREE.Vector3();
const tempV2 = new THREE.Vector3();
const spherePos = new THREE.Vector3();

let emitAcc = 0;

function resetSimulation(){
  for(let i=0;i<MAX;i++) active[i]=0;
  constraints.length=0;
  lastSpawned.length=0;
  nextIdx=0; activeCount=0; emitAcc=0;
}
resetBtn.addEventListener('click', resetSimulation);

function spawnParticle(dt){
  const idx = nextIdx;
  nextIdx = (nextIdx+1)%MAX;
  
  if(active[idx]){ // clean constraints
    for(let i=constraints.length-1;i>=0;i--){
      const c=constraints[i];
      if(c.a===idx || c.b===idx) constraints.splice(i,1);
    }
    activeCount--;
  }
  
  const p = positions[idx];
  const o = oldPos[idx];
  const emitX = (Math.random()-0.5)*0.12;
  const emitZ = (Math.random()-0.5)*0.12;
  p.set(emitX, 3.8, emitZ);
  o.copy(p).addScaledVector(tempV.set((Math.random()-0.5)*0.2, -0.5-Math.random(), (Math.random()-0.5)*0.2), -dt);
  
  active[idx]=1; life[idx]=0; activeCount++;
  
  const cohesionRadius = 0.22 + viscosity*0.08;
  for(let j=0;j<lastSpawned.length;j++){
    const b = lastSpawned[j];
    if(!active[b]) continue;
    const pb = positions[b];
    const d = p.distanceTo(pb);
    if(d>0.001 && d<cohesionRadius){
      constraints.push({a:idx,b:b,rest:d*0.85});
      if(constraints.length>6000) constraints.shift();
    }
  }
  lastSpawned.push(idx);
  if(lastSpawned.length>45) lastSpawned.shift();
}

const gravity = new THREE.Vector3();

function physicsStep(dt){
  spherePos.copy(sphere.position);
  sphereEnv.position.copy(spherePos);
  
  const damp = 0.985 - viscosity*0.28;
  const stiffness = 0.18 + viscosity*0.82;
  const friction = 0.12 + viscosity*0.75;
  const emitRate = 95 - viscosity*65;
  const iterations = viscosity>0.65 ? 3 : 2;
  
  gravity.set(0, -7.5 - viscosity*1.5, 0);
  
  // emit
  emitAcc += dt*emitRate;
  while(emitAcc>1 && activeCount<MAX-10){
    emitAcc-=1;
    spawnParticle(dt);
  }
  
  // verlet
  for(let i=0;i<MAX;i++) if(active[i]){
    const p = positions[i];
    const o = oldPos[i];
    tempV.copy(p).sub(o).multiplyScalar(damp);
    o.copy(p);
    p.add(tempV);
    p.addScaledVector(gravity, dt*dt);
    life[i] += dt;
    if(life[i] > 9 + viscosity*5 || p.y < -4.5){
      active[i]=0; activeCount--;
    }
  }
  
  // constraints
  for(let it=0; it<iterations; it++){
    for(let k=0;k<constraints.length;k++){
      const c = constraints[k];
      if(!active[c.a] || !active[c.b]) continue;
      const pa = positions[c.a];
      const pb = positions[c.b];
      tempV.copy(pb).sub(pa);
      const d = tempV.length();
      if(d<0.0001) continue;
      const diff = (d - c.rest) / d;
      const corr = diff * 0.5 * stiffness;
      tempV.multiplyScalar(corr);
      pa.add(tempV);
      pb.sub(tempV);
    }
  }
  
  // collisions
  const minDist = 1.5 + PR*0.9;
  for(let i=0;i<MAX;i++) if(active[i]){
    const p = positions[i];
    const o = oldPos[i];
    
    // sphere
    tempV.copy(p).sub(spherePos);
    const dist = tempV.length();
    if(dist < minDist){
      tempV.divideScalar(dist || 1);
      p.copy(spherePos).addScaledVector(tempV, minDist);
      tempV2.copy(p).sub(o);
      const vn = tempV.dot(tempV2);
      tempV2.addScaledVector(tempV, -vn*(1.4));
      tempV2.multiplyScalar(1 - friction*0.6);
      // stickiness for high viscosity on lower half
      if(viscosity>0.6 && tempV.y < -0.15){
        tempV2.multiplyScalar(0.65);
      }
      o.copy(p).sub(tempV2);
    }
    
    // ground
    if(p.y < -2.92){
      p.y = -2.92;
      tempV.copy(p).sub(o);
      tempV.y *= -0.2;
      tempV.x *= 0.7; tempV.z *= 0.7;
      o.copy(p).sub(tempV);
      if(viscosity>0.7) { // flatten
        life[i] += dt*2;
      }
    }
    
    // drip acceleration
    if(dist > minDist+0.05 && p.y < 0){
      p.y -= dt*viscosity*0.3;
    }
  }
}

function updateInstances(){
  const scaleBase = PR * (0.85 + viscosity*0.35);
  for(let i=0;i<MAX;i++){
    if(active[i]){
      dummy.position.copy(positions[i]);
      const v = tempV.copy(positions[i]).sub(oldPos[i]).length();
      const s = scaleBase * (1 + Math.min(v*2, 0.4));
      dummy.scale.setScalar(s);
      dummy.rotation.x += 0.01; dummy.rotation.z += 0.008;
    }else{
      dummy.position.set(0,-10,0);
      dummy.scale.setScalar(0.001);
    }
    dummy.updateMatrix();
    lava.setMatrixAt(i, dummy.matrix);
  }
  lava.instanceMatrix.needsUpdate = true;
  mat.emissiveIntensity = 1.8 + viscosity*1.2;
  rimLight.intensity = 2.5 + viscosity*1.5;
}

const clock = new THREE.Clock();
let t = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  t += dt;
  
  sphere.position.y = Math.sin(t*0.7)*0.08;
  sphere.rotation.y += dt*0.15;
  
  lavaLight.position.y = 3.2 + Math.sin(t*1.3)*0.1;
  lavaLight.intensity = 1.8 + Math.sin(t*5)*0.15 + viscosity*0.6;
  
  physicsStep(dt);
  if(Math.random()<0.5) physicsStep(dt); // substep for stability when viscous
  
  updateInstances();
  controls.update();
  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// init fill
resetSimulation();
</script>
</body>
</html>
