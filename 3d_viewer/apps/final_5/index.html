// === CAMERA FRAMING HELPER (pure) ===
// Given a bounding sphere radius, a vertical FOV (deg) and the viewport
// aspect ratio, returns a camera distance that fits the sphere with 10%
// padding. The horizontal FOV is derived from the aspect so the sphere is
// fully visible on both axes; the smaller (more constraining) FOV wins.
function computeFrameDistance(radius, fovDeg, aspect) {
  const fovV = (fovDeg * Math.PI) / 180;
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * aspect);
  const fov = Math.min(fovV, fovH);
  return (radius / Math.sin(fov / 2)) * 1.1;
}
// === END CAMERA FRAMING HELPER ===

const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const cat = new THREE.Group();
scene.add(cat);

let catSphere = null;

loader.load(
  CAT_GLB_DATA_URI,
  (gltf) => {
    const model = gltf.scene;
    // Normalize: recenter to origin, scale to a comfortable hero size, rest on floor
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const targetHeight = 2.0;
    const scale = targetHeight / size.y;
    model.scale.setScalar(scale);
    model.position.x = -center.x * scale;
    model.position.y = -box.min.y * scale; // sit on the floor
    model.position.z = -center.z * scale;
    // Default front-facing pose: no Y rotation, model faces the camera.
    model.traverse((o) => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });
    cat.add(model);

    // Compute the framing sphere from the normalized cat
    const fBox = new THREE.Box3().setFromObject(cat);
    const fCenter = fBox.getCenter(new THREE.Vector3());
    catSphere = fBox.getBoundingSphere(new THREE.Sphere());

    // Aim orbit controls at the cat's mid-height
    controls.target.copy(fCenter);

    // Auto-frame the camera around the cat
    frameCameraAroundCat();

    // Hide loader
    const load = document.getElementById('load');
    load.classList.add('hide');
    setTimeout(() => load.remove(), 700);
  },
  undefined,
  (err) => {
    console.error('Failed to load embedded cat model', err);
    document.getElementById('load').textContent = 'Failed to load model';
  }
);

function frameCameraAroundCat() {
  if (!catSphere) return;
  const aspect = innerWidth / innerHeight;
  const dist = computeFrameDistance(catSphere.radius, camera.fov, aspect);
  // Hero 3/4 angle: slightly above, off to the side
  const dir = new THREE.Vector3(0.55, 0.32, 1.0).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, dist);
  camera.near = Math.max(0.05, dist / 100);
  camera.far = dist * 50;
  camera.updateProjectionMatrix();
}

// === ANIMATION ===
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();
  // gentle idle bob
  cat.position.y = Math.sin(t * 1.2) * 0.012;
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  frameCameraAroundCat();
});
</script>
