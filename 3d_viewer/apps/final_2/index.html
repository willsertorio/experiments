<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levitating Lava</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(circle at 50% 34%, #3a1c08 0%, #1d0d04 38%, #0a0502 68%, #050201 100%);}
canvas{display:block}
.ui{
  position:absolute;top:24px;left:24px;z-index:10;
  width:300px;padding:24px 24px 20px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 16%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 64%, rgba(255,255,255,0.025) 84%, rgba(255,255,255,0.07) 100%),
    rgba(22,13,8,0.78);
  border:1px solid rgba(230,190,150,0.22);
  border-radius:20px;
  backdrop-filter:blur(18px) saturate(1.15);
  -webkit-backdrop-filter:blur(18px) saturate(1.15);
  box-shadow:0 14px 44px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10), inset 0 -1px 0 rgba(255,255,255,0.07);
  color:#f2e3d3;
}
.ui-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.ui-header h1{
  font-size:15px;letter-spacing:0.16em;font-weight:600;
  color:#e79a5f;text-transform:uppercase;margin:0;
}
.ui-header .visc-live{
  display:none;font-variant-numeric:tabular-nums;color:#f0955a;font-weight:600;font-size:13px;
  background:rgba(30,14,8,0.5);padding:2px 10px;border-radius:999px;
  border:1px solid rgba(240,150,90,0.4);white-space:nowrap;
}
.chevron{
  display:none;width:22px;height:22px;flex-shrink:0;cursor:pointer;
  color:#e79a5f;opacity:0.8;transition:transform .2s;
}
.chevron svg{width:100%;height:100%}
.ui-body{display:block}
.ui.collapsed .ui-body{display:none}
.ui.collapsed .chevron{transform:rotate(-90deg)}
.ui h1{
  font-size:15px;letter-spacing:0.16em;font-weight:600;
  color:#e79a5f;margin-bottom:18px;text-transform:uppercase;
}
.control{margin:18px 0 20px}
.control label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;letter-spacing:0.02em;color:#ecd9c3;margin-bottom:12px
}
.control label span{
  font-variant-numeric:tabular-nums;color:#f0955a;font-weight:600;font-size:12px;
  background:rgba(30,14,8,0.5);padding:3px 12px;border-radius:999px;
  border:1px solid rgba(240,150,90,0.4)
}
input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:3px;
  background:linear-gradient(to right,#ff7a1f 0%,#ff7a1f 50%,rgba(24,12,7,0.65) 50%,rgba(24,12,7,0.65) 100%);
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffa14e 0%,#ff8126 55%,#f06a10 100%);
  border:none;box-shadow:0 0 10px rgba(255,122,31,0.55),0 1px 3px rgba(0,0,0,0.4);
  cursor:pointer;transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{
  width:17px;height:17px;border-radius:50%;background:#ff8126;border:none;
  box-shadow:0 0 10px rgba(255,122,31,0.55);cursor:pointer;
}
button{
  width:100%;padding:12px;margin-top:2px;
  background:linear-gradient(180deg,rgba(84,42,22,0.55),rgba(52,24,12,0.6));
  border:1px solid rgba(240,150,90,0.4);color:#f4e6d6;
  border-radius:12px;font-size:14px;letter-spacing:0.04em;font-weight:600;
  cursor:pointer;backdrop-filter:blur(6px);transition:all .2s;
}
button:hover{background:linear-gradient(180deg,rgba(104,54,30,0.6),rgba(66,32,17,0.65));box-shadow:0 0 18px rgba(255,122,31,0.2);transform:translateY(-1px)}
button:active{transform:translateY(0)}
.hint{margin-top:14px;font-size:11.5px;line-height:1.6;color:#dcc0a6;opacity:0.75}
@media (max-width:600px),(max-height:500px){
  .ui{
    left:10px;right:10px;top:10px;width:auto;
    padding:8px 12px;border-radius:14px;
  }
  .ui-header h1{font-size:12px;letter-spacing:0.12em}
  .ui-header .visc-live{display:inline-block;font-size:11px;padding:1px 6px}
  .chevron{display:flex;align-items:center;justify-content:center}
  .control{margin:8px 0 10px}
  .control label{font-size:11px;margin-bottom:6px}
  button{padding:7px 10px;font-size:12px;border-radius:10px}
  .hint{margin-top:8px;font-size:10px;line-height:1.4}
}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<div class="ui" id="uiPanel">
  <div class="ui-header">
    <h1>Levitating Lava</h1>
    <span class="visc-live" id="viscLive">0.50</span>
    <div class="chevron" id="chevron" aria-label="Toggle panel" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>
  <div class="ui-body">
    <div class="control">
      <label>Viscosity <span id="viscVal">0.50</span></label>
      <input type="range" id="viscosity" min="1" max="100" value="50">
    </div>
    <button id="reset">Reset Flow</button>
    <p class="hint">Left Click: Rotate • Scroll: Zoom • Slider: Adjust Thickness</p>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

let viscosity = 0.5;
const viscSlider = document.getElementById('viscosity');
const viscVal = document.getElementById('viscVal');
const viscLive = document.getElementById('viscLive');
const resetBtn = document.getElementById('reset');
const uiPanel = document.getElementById('uiPanel');
const chevron = document.getElementById('chevron');

function updateSlider(){
  const p = viscSlider.value;
  viscSlider.style.background = `linear-gradient(to right,#ff7a1f 0%,#ff7a1f ${p}%,rgba(24,12,7,0.65) ${p}%,rgba(24,12,7,0.65) 100%)`;
}
function syncViscLive(){ viscLive.textContent = viscosity.toFixed(2); }
updateSlider();
syncViscLive();
viscSlider.addEventListener('input', e=>{
  viscosity = e.target.value/100;
  viscVal.textContent = viscosity.toFixed(2);
  syncViscLive();
  updateSlider();
});

// Collapsible panel on small screens: collapsed by default under 600px wide
// or 500px tall (short landscape), expanded on desktop. Tap the header row
// (title / live value / chevron) to toggle. Desktop stays fully expanded.
function isSmallScreen(){
  return window.innerWidth < 600 || window.innerHeight < 500;
}
function applyInitialCollapse(){
  if(isSmallScreen()) uiPanel.classList.add('collapsed');
}
applyInitialCollapse();
function togglePanel(){
  if(!isSmallScreen()) return; // no toggle on desktop
  uiPanel.classList.toggle('collapsed');
}
// The whole header row is tappable; the chevron is the visual affordance.
const uiHeader = uiPanel.querySelector('.ui-header');
uiHeader.addEventListener('click', togglePanel);
uiHeader.addEventListener('touchend', e=>{ if(isSmallScreen()){ e.preventDefault(); togglePanel(); } }, {passive:false});
// Re-apply collapsed state on resize across the breakpoint.
addEventListener('resize', ()=>{ if(!isSmallScreen()) uiPanel.classList.remove('collapsed'); });

// Protocol-aware texture source: real files over http(s), inline base64 on file://
// (Chrome blocks file:// texture requests with CORS errors, so we embed copies.)
const isFileProtocol = location.protocol === 'file:';
function texSource(key, file){
  return isFileProtocol
    ? 'data:image/jpeg;base64,' + window.__TEX_BASE64[key]
    : 'assets/' + file;
}

const scene = new THREE.Scene();
// Warm, subtle fog so the slab edges dissolve into the amber void rather than a hard cut.
scene.fog = new THREE.FogExp2(0x26140a, 0.034);

// Backdrop: warm brown-amber radial glow behind the sphere.
const bgTex = new THREE.TextureLoader().load(texSource('gradient','RadialGradient.jpg'));
bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.0, 8.0);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Black-chrome sphere: a PMREM-processed RoomEnvironment gives real warm
// reflections on a near-black, highly metallic surface instead of a flat tint.
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
const envMap = pmrem.fromScene(envScene, 0.04).texture;
scene.environment = envMap;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.5;
controls.maxDistance = 13;
controls.target.set(0,0.2,0);
controls.autoRotate = false;

// Lighting tuned so the slab's reddish rocky texture actually reads on screen.
const ambient = new THREE.AmbientLight(0x3a2418, 1.15);
scene.add(ambient);

// Warm hemispheric fill to lift the slab out of the void.
const hemi = new THREE.HemisphereLight(0xffb27a, 0x2a1208, 0.7);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffd0a8, 2.4);
keyLight.position.set(4,9,5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024,1024);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 24;
keyLight.shadow.camera.left = -9; keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 9; keyLight.shadow.camera.bottom = -9;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff4500, 3.2, 14, 2);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

const lavaLight = new THREE.PointLight(0xff9430, 1.7, 8);
lavaLight.position.set(0,3.2,0);
scene.add(lavaLight);

// Volcanic rock slab textures (reddish albedo + OpenGL tangent-space normals).
const rockAlbedo = new THREE.TextureLoader().load(texSource('albedo','lava-rock2_albedo.jpg'));
rockAlbedo.colorSpace = THREE.SRGBColorSpace;
rockAlbedo.wrapS = rockAlbedo.wrapT = THREE.RepeatWrapping;
rockAlbedo.repeat.set(2, 2);
rockAlbedo.anisotropy = 8;
const rockNormal = new THREE.TextureLoader().load(texSource('normal','lava-rock2_normal-ogl.jpg'));
rockNormal.wrapS = rockNormal.wrapT = THREE.RepeatWrapping;
rockNormal.repeat.set(2, 2);

// Big square rock slab (~14x14) with visible thickness, floating in the void.
const ground = new THREE.Mesh(
  new THREE.BoxGeometry(14, 0.8, 14),
  new THREE.MeshStandardMaterial({
    map: rockAlbedo,
    normalMap: rockNormal,
    normalScale: new THREE.Vector2(1.4, 1.4),
    color: 0xffffff,
    roughness: 0.88,
    metalness: 0.05,
    emissive: 0x180600,
    emissiveIntensity: 0.3
  })
);
ground.position.y = -1.92;
ground.receiveShadow = true;
scene.add(ground);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 64, 64),
  new THREE.MeshStandardMaterial({
    color:0x070708,
    metalness:0.95,
    roughness:0.12,
    envMapIntensity:2.0
  })
);
sphere.castShadow = true;
sphere.receiveShadow = true;
scene.add(sphere);

const reflRT = new THREE.WebGLCubeRenderTarget(256, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
const reflCam = new THREE.CubeCamera(0.5, 60, reflRT);
reflCam.position.set(0, 0, 0);
scene.add(reflCam);
sphere.material.envMap = reflRT.texture;
let reflTick = 0;
function updateReflection(){
  if(reflTick++ % 3 !== 0) return;
  sphere.visible = false;
  sphereEnv.visible = false;
  reflCam.position.copy(sphere.position);
  reflCam.update(renderer, scene);
  sphere.visible = true;
  sphereEnv.visible = true;
}

const sphereEnv = new THREE.Mesh(
  new THREE.SphereGeometry(1.53, 32, 32),
  new THREE.MeshBasicMaterial({color:0xff5510, transparent:true, opacity:0.025, blending:THREE.AdditiveBlending})
);
scene.add(sphereEnv);

// Composer
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// Half-resolution bloom buffer — the blur is visually indistinguishable but
// cuts the bloom pass cost ~4x on software-rendered targets.
const bloomRes = new THREE.Vector2(Math.floor(innerWidth/2), Math.floor(innerHeight/2));
const bloom = new UnrealBloomPass(bloomRes, 0.95, 0.55, 0.62);
composer.addPass(bloom);

// Lava Particles
const MAX = 1400;
const PR = 0.09;
const geo = new THREE.IcosahedronGeometry(1, 2);
const mat = new THREE.MeshPhysicalMaterial({
  color:0xff3a00,
  emissive:0xff4500,
  emissiveIntensity:2.4,
  roughness:0.25,
  metalness:0,
  clearcoat:0.3,
  clearcoatRoughness:0.4,
  transmission:0.0
});
const lava = new THREE.InstancedMesh(geo, mat, MAX);
lava.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
lava.frustumCulled = false;
lava.castShadow = true;
scene.add(lava);

// --- MarchingCubes isosurface for the liquid look ---
// Field bounds cover the whole flow: emitter (y~3.8) down to the slab top (y~-2.08).
const FIELD_RES = 64;
const FIELD_MIN = new THREE.Vector3(-3, -2.4, -3);
const FIELD_SIZE = new THREE.Vector3(6, 7.0, 6);
const fluidMat = new THREE.MeshPhysicalMaterial({
  color:0xff7a10,
  emissive:0xffc050,
  emissiveIntensity:2.0,
  roughness:0.4,
  metalness:0,
  clearcoat:0.5,
  clearcoatRoughness:0.3,
  transmission:0.0
});
const fluid = new MarchingCubes(FIELD_RES, fluidMat, false, false, 180000);
fluid.scale.set(FIELD_SIZE.x/2, FIELD_SIZE.y/2, FIELD_SIZE.z/2);
fluid.position.set(
  FIELD_MIN.x + FIELD_SIZE.x/2,
  FIELD_MIN.y + FIELD_SIZE.y/2,
  FIELD_MIN.z + FIELD_SIZE.z/2
);
fluid.castShadow = false; // glowing lava doesn't cast dark shadows — saves a shadow pass
fluid.receiveShadow = true;
scene.add(fluid);

// Hide the old per-particle instanced beads — only the fluid surface renders.
lava.visible = false;

const positions = new Array(MAX);
const oldPos = new Array(MAX);
for(let i=0;i<MAX;i++){positions[i]=new THREE.Vector3(); oldPos[i]=new THREE.Vector3();}
const active = new Uint8Array(MAX);
const life = new Float32Array(MAX);
const resting = new Uint8Array(MAX);   // drops lingering on the slab
const restT = new Float32Array(MAX);    // how long a drop has been resting
const onSphere = new Uint8Array(MAX);
let nextIdx = 0;
let activeCount = 0;
const constraints = [];
const lastSpawned = [];
const dummy = new THREE.Object3D();
const tempV = new THREE.Vector3();
const tempV2 = new THREE.Vector3();
const tempV3 = new THREE.Vector3();
const spherePos = new THREE.Vector3();

let emitAcc = 0;

function resetSimulation(){
  for(let i=0;i<MAX;i++){ active[i]=0; resting[i]=0; restT[i]=0; onSphere[i]=0; }
  constraints.length=0;
  lastSpawned.length=0;
  nextIdx=0; activeCount=0; emitAcc=0;
}
resetBtn.addEventListener('click', resetSimulation);

function spawnParticle(dt){
  const idx = nextIdx;
  nextIdx = (nextIdx+1)%MAX;

  if(active[idx]){ // clean constraints
    for(let i=constraints.length-1;i>=0;i--){
      const c=constraints[i];
      if(c.a===idx || c.b===idx) constraints.splice(i,1);
    }
    activeCount--;
  }

  const p = positions[idx];
  const o = oldPos[idx];
  const emitX = (Math.random()-0.5)*0.12;
  const emitZ = (Math.random()-0.5)*0.12;
  p.set(emitX, 3.8, emitZ);
  o.copy(p).addScaledVector(tempV.set((Math.random()-0.5)*0.15, -0.7-Math.random()*0.2, (Math.random()-0.5)*0.15), -dt);

  active[idx]=1; life[idx]=0; resting[idx]=0; restT[idx]=0; activeCount++;

  const cohesionRadius = 0.22 + viscosity*0.08;
  let links = 0;
  for(let j=lastSpawned.length-1; j>=0 && links<2; j--){
    const b = lastSpawned[j];
    if(!active[b]) continue;
    const pb = positions[b];
    const d = p.distanceTo(pb);
    if(d>0.001 && d<cohesionRadius){
      constraints.push({a:idx,b:b,rest:d*0.85});
      links++;
      if(constraints.length>6000) constraints.shift();
    }
  }
  lastSpawned.push(idx);
  if(lastSpawned.length>45) lastSpawned.shift();
}

const gravity = new THREE.Vector3();
let crownLoad = 0;

function physicsStep(dt){
  spherePos.copy(sphere.position);
  sphereEnv.position.copy(spherePos);

  const dampAir = 0.985;
  const dampContact = 0.985 - viscosity*0.28;
  const stiffness = 0.12 + viscosity*0.55;
  const friction = 0.12 + viscosity*0.75;
  const emitRate = 45;
  const iterations = 3;

  gravity.set(0, -7.5 - viscosity*1.5, 0);

  // emit
  emitAcc += dt*emitRate;
  while(emitAcc>1){
    emitAcc-=1;
    spawnParticle(dt);
  }

  // verlet
  let crownCount = 0;
  for(let i=0;i<MAX;i++) if(active[i]){
    const p = positions[i];
    const o = oldPos[i];
    if(p.y > 1.3 && p.x*p.x + p.z*p.z < 1.2) crownCount++;
    if(resting[i]){
      restT[i] += dt;
      tempV.copy(p).sub(o).multiplyScalar(0.96);
      tempV.y = 0;
      o.copy(p);
      p.add(tempV);
      p.y = -1.52;
      if(restT[i] > 3.5){
        active[i]=0; resting[i]=0; restT[i]=0; activeCount--;
      }
      continue;
    }
    tempV.copy(p).sub(o).multiplyScalar(onSphere[i] ? dampContact : dampAir);
    o.copy(p);
    p.add(tempV);
    p.addScaledVector(gravity, dt*dt);
    life[i] += dt;
    if(life[i] > 12 + viscosity*15 || p.y < -2.2){
      active[i]=0; activeCount--;
    }
  }
  crownLoad = crownCount;

  // constraints
  const tearAt = 1.6 + viscosity*0.4;
  for(let it=0; it<iterations; it++){
    for(let k=constraints.length-1;k>=0;k--){
      const c = constraints[k];
      if(!active[c.a] || !active[c.b]) continue;
      const pa = positions[c.a];
      const pb = positions[c.b];
      tempV.copy(pb).sub(pa);
      const d = tempV.length();
      if(d<0.0001) continue;
      if(d > c.rest*tearAt || (onSphere[c.a] && pa.y < -0.35) || (onSphere[c.b] && pb.y < -0.35)
        || (pa.y < 1.2 && !onSphere[c.a] && !resting[c.a]) || (pb.y < 1.2 && !onSphere[c.b] && !resting[c.b])){
        constraints[k] = constraints[constraints.length-1];
        constraints.pop();
        continue;
      }
      const diff = (d - c.rest) / d;
      let corr = diff * 0.5 * stiffness;
      if(onSphere[c.a] && onSphere[c.b]) corr *= 0.18;
      else if(onSphere[c.a] || onSphere[c.b]) corr *= 0.45;
      else corr *= 0.25 + 0.75*viscosity;
      tempV.multiplyScalar(corr);
      pa.add(tempV);
      pb.sub(tempV);
    }
  }

  // collisions
  const minDist = 1.5 + PR*0.9;
  for(let i=0;i<MAX;i++) if(active[i]){
    const p = positions[i];
    const o = oldPos[i];

    // sphere
    tempV.copy(p).sub(spherePos);
    const dist = tempV.length();
    onSphere[i] = 0;
    if(dist < minDist){
      tempV.divideScalar(dist || 1);          // normal n (pointing outward)
      if(tempV.y < 0.45 - viscosity*0.55){
        p.copy(spherePos).addScaledVector(tempV, minDist + 0.05);
        tempV2.copy(p).sub(o);
        const vnr = tempV.dot(tempV2);
        if(vnr < 0) tempV2.addScaledVector(tempV, -vnr);
        const kick = (0.4 + 0.9*Math.abs(Math.sin(i*7.13))) * (1 - viscosity*0.6) * dt;
        tempV2.x += tempV.x * kick;
        tempV2.z += tempV.z * kick;
        o.copy(p).sub(tempV2);
        continue;
      }
      onSphere[i] = 1;
      p.copy(spherePos).addScaledVector(tempV, minDist);
      tempV2.copy(p).sub(o);
      const vn = tempV.dot(tempV2);
      tempV2.addScaledVector(tempV, -vn*(1.6 - viscosity*0.2));
      tempV2.multiplyScalar(1 - friction*0.6);

      // Tangential drainage: project gravity onto the sphere's tangent plane so a
      // particle in contact always has a downhill slide. The contact normal tempV
      // points outward from the sphere centre; gravity points down. The tangent
      // component of gravity = gravity - (gravity·n)·n, which never vanishes
      // except exactly at the top dead centre — so lava always crawls downhill.
      const gDotN = gravity.y * tempV.y;          // gravity=(0,g,0), so gravity·n = g*ny
      tempV3.set(gravity.x - gDotN*tempV.x, gravity.y - gDotN*tempV.y, gravity.z - gDotN*tempV.z);
      const ny = Math.max(tempV.y, 0);
      const capHold = 1 - (0.62 - 0.3*viscosity)*ny*ny;
      tempV3.multiplyScalar(capHold);
      const az = Math.atan2(p.z - spherePos.z, p.x - spherePos.x);
      const azT = i * 2.399963 + simTime * (0.15 + viscosity*viscosity*0.25);
      const mix = ny;
      const spread = (0.9 + 0.9*Math.min(crownLoad/70, 1.5)) * (1.05 - viscosity*0.25) * 6.0;
      tempV3.x += (Math.cos(azT)*mix + Math.cos(az)*(1-mix)) * spread;
      tempV3.z += (Math.sin(azT)*mix + Math.sin(az)*(1-mix)) * spread;
      const crawlStrength = 2.1 + (1 - viscosity)*0.8;
      p.addScaledVector(tempV3, crawlStrength * dt * dt);

      // Release stickiness once a particle is below the sphere's equator so
      // gravity can peel it off and let it drip down.
      const belowEquator = tempV.y < 0;           // normal.y < 0 ⇒ lower hemisphere
      if(viscosity>0.6 && tempV.y < -0.15 && !belowEquator){
        tempV2.multiplyScalar(0.65);
      }

      // Crawl speed floor: friction/stickiness can slow the crawl drastically
      // but never to a complete standstill — guarantee a minimum downhill nudge
      // along the tangent drainage direction.
      if(!belowEquator){
        const minCrawl = 0.05 * dt;
        tempV3.normalize().multiplyScalar(minCrawl);
        p.add(tempV3);
      }

      o.copy(p).sub(tempV2);
    }

    if(p.y < -1.52){
      p.y = -1.52;
      tempV.copy(p).sub(o);
      tempV.y *= -0.1;
      tempV.x *= 0.8; tempV.z *= 0.8;
      o.copy(p).sub(tempV);
      if(!resting[i]){
        resting[i] = 1;
        restT[i] = 0;
      }
    }

    // drip acceleration zone: pull falling drops down toward the new slab surface
    if(dist > minDist+0.05 && p.y < 0){
      p.y -= dt*viscosity*0.3;
    }
  }
}

// Feed particle positions into the MarchingCubes field every frame so nearby
// particles fuse into one continuous molten rope. Viscosity subtly fattens the
// surface so high values read thicker/smoother while low values stay thin/splashy.
function updateFluid(alpha){
  fluid.reset();
  // Strength ~0.08 (down ~6x from 0.45): each particle fuses only with close
  // neighbors so the stream reads as a molten rope ~half a unit thick, not a
  // balloon. Viscosity nudges it slightly — thicker/smoother at high visc,
  // thin/splashy at low visc. addBall cost scales with radius^3, so the
  // smaller balls also restore performance to ~60fps.
  const strength = 0.026 + viscosity*0.010;
  const subtract = 12;
  const lifeLimit = 12 + viscosity*15;
  for(let i=0;i<MAX;i++){
    if(!active[i]) continue;
    const p = positions[i];
    const o = oldPos[i];
    const ix = o.x + (p.x - o.x)*alpha;
    const iy = o.y + (p.y - o.y)*alpha;
    const iz = o.z + (p.z - o.z)*alpha;
    const nx = (ix - FIELD_MIN.x) / FIELD_SIZE.x;
    const ny = (iy - FIELD_MIN.y) / FIELD_SIZE.y;
    const nz = (iz - FIELD_MIN.z) / FIELD_SIZE.z;
    if(nx < 0 || nx > 1 || ny < 0 || ny > 1 || nz < 0 || nz > 1) continue;
    let s = strength;
    if(iy > 1.35 && iy < 3.9 && ix*ix + iz*iz < 0.4) s *= 1.25;
    if(resting[i]) s *= 2.2;
    else {
      const ddx = ix - spherePos.x, ddy = iy - spherePos.y, ddz = iz - spherePos.z;
      const dd = ddx*ddx + ddy*ddy + ddz*ddz;
      if(dd < 4.2 && iy < 1.45) s *= 1.35 + viscosity*0.5;
      else if(dd >= 4.2 && iy < 1.2) s *= 3.0;
    }
    if(life[i] < 0.25) s *= 0.2 + 0.8*(life[i]/0.25);
    else if(!resting[i] && life[i] > lifeLimit - 0.5) s *= Math.max(0.05, (lifeLimit - life[i])/0.5);
    if(resting[i] && restT[i] > 2.6){
      s *= Math.max(0, 1 - (restT[i] - 2.6)/0.9);
      if(s < 0.005) continue;
    }
    fluid.addBall(nx, ny, nz, s, subtract);
  }
  fluid.update();
}

const clock = new THREE.Clock();
let t = 0;
let physAcc = 0;
const PHYS_DT = 1/60;
let simTime = 0; // accumulated clamped dt — deterministic test clock (independent of wall-clock/fps)
let frameCount = 0;
let startTime = performance.now();
// Per-frame CPU timing for the physics+fluid update (for tests).
let _updateTimes = [];
const _UPDATE_WINDOW = 60;

function animate(){
  requestAnimationFrame(animate);
  frameCount++;
  let frameDt = clock.getDelta();
  if(frameDt > 0.1) frameDt = 0.1;
  t += frameDt;

  sphere.position.y = Math.sin(t*0.7)*0.02;
  sphere.rotation.y += frameDt*0.15;

  lavaLight.position.y = 3.2 + Math.sin(t*1.3)*0.1;
  lavaLight.intensity = 1.7 + Math.sin(t*5)*0.12;

  const _t0 = performance.now();
  physAcc += frameDt;
  while(physAcc >= PHYS_DT){
    physicsStep(PHYS_DT);
    simTime += PHYS_DT;
    physAcc -= PHYS_DT;
  }
  updateFluid(physAcc / PHYS_DT);
  const _t1 = performance.now();
  _updateTimes.push(_t1 - _t0);
  if(_updateTimes.length > _UPDATE_WINDOW) _updateTimes.shift();

  updateReflection();
  controls.update();
  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

resetSimulation();

// Expose scene state for Playwright/end-to-end inspection.
window.__lava = {
  get scene(){ return scene; },
  get renderer(){ return renderer; },
  get camera(){ return camera; },
  get sphere(){ return sphere; },
  get ground(){ return ground; },
  get lava(){ return lava; },
  get fluid(){ return fluid; },
  get bloom(){ return bloom; },
  get lights(){ return { rim: rimLight, lava: lavaLight, key: keyLight, amb: ambient, hemi: hemi }; },
  get particles(){ return { positions, oldPos, active, life, resting, restT, activeCount, MAX }; },
  get viscosity(){ return viscosity; },
  get isFileProtocol(){ return isFileProtocol; },
  get fps(){ const elapsed = (performance.now() - startTime)/1000; return elapsed > 0 ? frameCount / elapsed : 0; },
  get frameCount(){ return frameCount; },
  get simTime(){ return simTime; },
  get avgUpdateTimeMs(){ if(!_updateTimes.length) return 0; return _updateTimes.reduce((a,b)=>a+b,0) / _updateTimes.length; }
};

</script>
