import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.setClearColor(0xffffff, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(22, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(0, 0.65, 2.85);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.enableZoom = false;
controls.minDistance = 1.8;
controls.maxDistance = 4.5;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

let targetZoomDistance = camera.position.distanceTo(controls.target);
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetZoomDistance += e.deltaY * 0.005;
  targetZoomDistance = THREE.MathUtils.clamp(targetZoomDistance, controls.minDistance, controls.maxDistance);
}, { passive: false });

RectAreaLightUniformsLib.init();

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

new RGBELoader()
  .load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_03_1k.hdr', (hdr) => {
    const env = pmrem.fromEquirectangular(hdr).texture;
    scene.environment = env;
    hdr.dispose();
    pmrem.dispose();
  });

// Lights — subtle ambient, one golden key, soft fill, soft shadow caster.
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const keyLight = new THREE.RectAreaLight(0xffff66, 2, 3, 3);
keyLight.position.set(-2.2, 2.5, 1.8);
keyLight.lookAt(0,0,0);
scene.add(keyLight);

const fillLight = new THREE.RectAreaLight(0xe8f4ff, 1, 2, 2);
fillLight.position.set(2.0, 1.5, 1.5);
fillLight.lookAt(0,0,0);
scene.add(fillLight);

const shadowLight = new THREE.DirectionalLight(0xffffff, 0.6);
shadowLight.position.set(0.5, 2.5, -2.5);
shadowLight.castShadow = true;
shadowLight.shadow.mapSize.set(2048, 2048);
shadowLight.shadow.camera.near = 0.5;
shadowLight.shadow.camera.far = 8;
shadowLight.shadow.camera.left = -2;
shadowLight.shadow.camera.right = 2;
shadowLight.shadow.camera.top = 2;
shadowLight.shadow.camera.bottom = -2;
shadowLight.shadow.bias = -0.0005;
shadowLight.shadow.radius = 8.0;
shadowLight.shadow.blurSamples = 16;
scene.add(shadowLight);

// PBR physical materials for the three GLB material slots.
const whiteMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x666666,
  metalness: 0.0,
  roughness: 0.35,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  reflectivity: 0.5,
  envMapIntensity: 1.0
});

const platinumMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf2f4f7,
  metalness: 1.0,
  roughness: 0.07,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  reflectivity: 0.9,
  envMapIntensity: 1.2
});

const diamondMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  roughness: 0.0,
  metalness: 0.0,
  transmission: 1.0,
  ior: 2.417,
  thickness: 0.6,
  dispersion: 6.0,
  specularIntensity: 1.0,
  specularColor: 0xffffff,
  envMapIntensity: 4.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  attenuationDistance: Infinity,
  attenuationColor: 0xffffff
});

function materialFor(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('diamond')) return diamondMaterial;
  if (n.includes('platinum')) return platinumMaterial;
  if (n.includes('white')) return whiteMaterial;
  return null;
}

function findMeshByName(model, regex) {
  let found = null;
  model.traverse((obj) => {
    if (obj.isMesh && regex.test(obj.name)) found = obj;
  });
  return found;
}

const loader = new GLTFLoader();

function processModel(model) {
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  const scale = 1.6 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(scale);
  model.updateWorldMatrix(true, true);

  const cylinderMesh = findMeshByName(model, /cylinder/i);
  const cylCenter = new THREE.Vector3();
  if (cylinderMesh) {
    new THREE.Box3().setFromObject(cylinderMesh).getCenter(cylCenter);
  } else {
    box.getCenter(cylCenter);
  }
  model.position.sub(cylCenter);
  model.updateWorldMatrix(true, true);

  model.traverse((obj) => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
      const assigned = materialFor(obj.material && obj.material.name);
      if (assigned) obj.material = assigned;
    }
  });

  diamondMesh = findMeshByName(model, /trilliant001/i);
}

function onModelLoaded(model) {
  processModel(model);
  ring.add(model);
}

function loadFromBase64() {
  const binaryString = atob(RING_GLB_BASE64);
  const bytes = new Uint8Array(binaryString.length);
  for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
  loader.parse(bytes.buffer, '', (gltf) => onModelLoaded(gltf.scene), (e) => console.error('Embedded GLB parse failed', e));
}

// Primary: load from ./assets/ring.glb (works over http://).
// Fallback: parse embedded base64 (works on file:// drag-drop, no CORS).
loader.load(
  './assets/ring.glb',
  (gltf) => onModelLoaded(gltf.scene),
  (xhr) => {},
  (err) => {
    console.log('Falling back to embedded GLB data');
    loadFromBase64();
  }
);

// Moving light for brilliance
const sparkLight = new THREE.PointLight(0xffffff, 2.5, 5, 2);
sparkLight.position.set(1.5,1.8,1.2);
scene.add(sparkLight);

const textureFlare0 = new THREE.TextureLoader().load('data:image/png;base64,' + LENSFLARE0_B64);
const textureFlare3 = new THREE.TextureLoader().load('data:image/png;base64,' + LENSFLARE3_B64);

function addLensLight(h, s, l, x, y, z) {
  const light = new THREE.PointLight(0xffffff, 0.3, 5, 0);
  light.color.setHSL(h, s, l);
  light.position.set(x, y, z);
  scene.add(light);

  const lensflare = new Lensflare();
  lensflare.addElement(new LensflareElement(textureFlare0, 60, 0, light.color));
  lensflare.addElement(new LensflareElement(textureFlare3, 20, 0.6));
  lensflare.addElement(new LensflareElement(textureFlare3, 30, 0.8));
  light.add(lensflare);
}

addLensLight(0.55, 0.9, 0.5, 2.8, 0.0, -0.6);
addLensLight(0.08, 0.8, 0.5, 0.0, 0.0, -0.6);
addLensLight(0.995, 0.5, 0.9, 2.8, 2.8, -0.6);

// Postprocessing — DOF focused on the diamond, gentle bloom, output color.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bokehPass = new BokehPass(scene, camera, {
  focus: 2.85,
  aperture: 0.01,
  maxblur: 0.01
});
composer.addPass(bokehPass);

const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.75, 0.85);
bloom.threshold = 1.2;
bloom.strength = 0.1;
bloom.radius = 0.8;
composer.addPass(bloom);

composer.addPass(new OutputPass());

// Reusable temp vectors.
const _diamondWorld = new THREE.Vector3();
const _zoomDir = new THREE.Vector3();

function smoothstep(edge0, edge1, x) {
  const t = THREE.MathUtils.clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
}

let t = 0;
function animate(){
  requestAnimationFrame(animate);
  t += 0.016;

  ring.position.y = Math.sin(t*0.6)*0.015;
  ring.rotation.y += 0.0015;

  controls.target.set(ORBIT_TARGET.x, ORBIT_TARGET.y + ring.position.y, ORBIT_TARGET.z);

  const currentDist = camera.position.distanceTo(controls.target);
  const easedDist = THREE.MathUtils.lerp(currentDist, targetZoomDistance, 0.08);
  _zoomDir.copy(camera.position).sub(controls.target).normalize();
  camera.position.copy(controls.target).add(_zoomDir.multiplyScalar(easedDist));

  controls.update();

  if (diamondMesh) {
    diamondMesh.getWorldPosition(_diamondWorld);
    bokehPass.uniforms['focus'].value = camera.position.distanceTo(_diamondWorld);
  } else {
    bokehPass.uniforms['focus'].value = camera.position.distanceTo(controls.target);
  }

  const distToTarget = camera.position.distanceTo(controls.target);
  const blurFactor = 1 - smoothstep(controls.minDistance, controls.maxDistance, distToTarget);
  bokehPass.uniforms['aperture'].value = 0.01 * blurFactor;
  bokehPass.uniforms['maxblur'].value = 0.01 * blurFactor;

  sparkLight.position.x = Math.cos(t*0.7)*1.8;
  sparkLight.position.z = Math.sin(t*0.9)*1.6;
  sparkLight.position.y = 1.4 + Math.sin(t*1.2)*0.3;
  sparkLight.intensity = 2.0 + Math.sin(t*3)*0.5;

  camera.position.y = 0.65 + Math.sin(t*0.4)*0.02;

  composer.render();
}
animate();

window.addEventListener('resize', ()=>{
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  composer.setSize(w,h);
});
</script>
</body>
</html>
