<html lang="en">
<head>
<meta charset="UTF-8">
<title>Robot – Closed Loop Walk Cycle</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#02040a;overflow:hidden;font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;color:#cfe9ff}
  #c{display:block;width:100vw;height:100vh}
  .ui{position:absolute;top:18px;left:18px;background:rgba(8,12,22,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 16px;border-radius:16px;border:1px solid rgba(0,229,255,.18);box-shadow:0 10px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05)}
  .ui h1{margin:0 0 10px;font-size:13px;letter-spacing:.22em;color:#7deaff;font-weight:700}
  .ui .row{display:flex;gap:6px;flex-wrap:wrap}
  .ui button{background:#0c1422;color:#bfefff;border:1px solid #1b2c46;padding:7px 12px;border-radius:10px;cursor:pointer;font-size:13px;transition:.2s;user-select:none}
  .ui button:hover{border-color:#00e5ff;color:#eaffff;transform:translateY(-1px)}
  .ui button.active{background:#00e5ff;color:#00131a;border-color:#00e5ff;box-shadow:0 0 18px rgba(0,229,255,.35)}
  .controls{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:12px;color:#8eb6d6}
  input[type=range]{width:140px;accent-color:#00e5ff}
  .hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:#6f8aa6;background:rgba(5,10,18,.6);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(8px)}
  .tag{position:absolute;top:18px;right:18px;font-size:11px;letter-spacing:.18em;color:#5d7c99;background:rgba(8,12,22,.6);padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.06)}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <h1>ROBOT MK-IV</h1>
  <div class="row">
    <button data-mode="idle">Idle</button>
    <button data-mode="walk" class="active">Walk</button>
    <button data-mode="run">Run</button>
    <button data-mode="pose">Pose</button>
  </div>
  <div class="controls">
    <span>Speed</span>
    <input id="speed" type="range" min="0.6" max="2.4" step="0.01" value="1.4">
    <span id="speedVal">1.40x</span>
  </div>
</div>
<div class="tag">CLOSED-LOOP GAIT</div>
<div class="hint">Drag to orbit • Scroll to zoom • Double-click robot to wave</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
scene.fog = new THREE.FogExp2(0x05070b, 0.022);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.2, 2.1, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,1.4,0);
controls.minDistance = 1.5;
controls.maxDistance = 8;

const hemi = new THREE.HemisphereLight(0x88ccff, 0x060910, 0.6);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(4.5, 7, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.PointLight(0x00e5ff, 2.0, 12, 2);
rim.position.set(-3, 2.5, -3);
scene.add(rim);

const floorSize = 40;
const gridCanvas = document.createElement('canvas'); gridCanvas.width = gridCanvas.height = 512;
const gtx = gridCanvas.getContext('2d');
gtx.fillStyle = '#060a12'; gtx.fillRect(0,0,512,512);
gtx.strokeStyle = 'rgba(0,229,255,0.08)'; gtx.lineWidth = 2;
for(let i=0;i<=8;i++){const p=i*64; gtx.beginPath(); gtx.moveTo(p,0); gtx.lineTo(p,512); gtx.stroke(); gtx.beginPath(); gtx.moveTo(0,p); gtx.lineTo(512,p); gtx.stroke();}
gtx.strokeStyle = 'rgba(0,229,255,0.22)'; gtx.lineWidth = 3; gtx.strokeRect(1,1,510,510);
const gridTex = new THREE.CanvasTexture(gridCanvas); gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping; gridTex.anisotropy = 8; gridTex.repeat.set(14,14);

const floorMat = new THREE.MeshStandardMaterial({ color:0x070e1a, metalness:0.2, roughness:0.85, map:gridTex });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(floorSize, floorSize), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

const grid = new THREE.GridHelper(20, 40, 0x00e5ff, 0x102233); grid.position.y = 0.002; grid.material.opacity = 0.15; grid.material.transparent = true; scene.add(grid);

// Robot materials
const bodyMat = new THREE.MeshStandardMaterial({ color:0xe6f0ff, metalness:0.92, roughness:0.28 });
const darkMat = new THREE.MeshStandardMaterial({ color:0x162334, metalness:0.85, roughness:0.45 });
const accentMat = new THREE.MeshStandardMaterial({ color:0x00e5ff, metalness:0.5, roughness:0.25, emissive:0x00aacc, emissiveIntensity:0.6 });

function createRobot(){
  const robot = new THREE.Group();

  const torso = new THREE.Mesh(new THREE.BoxGeometry(1,1.2,0.6), bodyMat);
  torso.castShadow = true; torso.receiveShadow = true;
  robot.add(torso);

  const chestPlate = new THREE.Mesh(new THREE.BoxGeometry(0.74,0.54,0.06), darkMat);
  chestPlate.position.set(0,0.22,0.33); torso.add(chestPlate);

  const core = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.05,28), accentMat);
  core.rotation.x = Math.PI/2; core.position.set(0,0.22,0.365); torso.add(core);

  const spine = new THREE.Mesh(new THREE.BoxGeometry(0.12,1.1,0.12), darkMat);
  spine.position.set(0,0,-0.22); torso.add(spine);

  // head
  const head = new THREE.Group(); head.position.y = 0.92; torso.add(head);
  const headBox = new THREE.Mesh(new THREE.BoxGeometry(0.56,0.46,0.46,2,2,2), bodyMat);
  headBox.castShadow = true; head.add(headBox);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.1,0.02), accentMat);
  visor.position.set(0,0.04,0.235); head.add(visor);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055,20,20), new THREE.MeshStandardMaterial({color:0x9ff6ff, emissive:0x00e5ff, emissiveIntensity:1.3, metalness:0, roughness:0.2}));
  eye.position.set(-0.12,0.04,0.24); head.add(eye);
  const eye2 = eye.clone(); eye2.position.x = 0.12; head.add(eye2);
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.22,12), darkMat);
  antenna.position.set(0,0.34,0); head.add(antenna);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.03,12,12), accentMat); tip.position.y = 0.11; antenna.add(tip);

  function arm(side){
    const s = side==='left'?-1:1;
    const shoulder = new THREE.Group(); shoulder.position.set(s*0.66,0.45,0); torso.add(shoulder);
    const up = new THREE.Group(); shoulder.add(up);
    const upMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.11,0.46,6,14), darkMat); upMesh.position.y=-0.27; upMesh.castShadow=true; up.add(upMesh);
    const elbow = new THREE.Group(); elbow.position.y=-0.54; up.add(elbow);
    const loMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.095,0.42,6,12), bodyMat); loMesh.position.y=-0.23; loMesh.castShadow=true; elbow.add(loMesh);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.17,0.19,0.15), darkMat); hand.position.y=-0.48; hand.castShadow=true; elbow.add(hand);
    return {shoulder, up, elbow};
  }
  const L = arm('left'); const R = arm('right');

  function leg(side){
    const s = side==='left'?-1:1;
    const hip = new THREE.Group(); hip.position.set(s*0.29,-0.6,0); torso.add(hip);
    const up = new THREE.Group(); hip.add(up);
    const upMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.145,0.56,6,14), darkMat); upMesh.position.y=-0.33; upMesh.castShadow=true; up.add(upMesh);
    const knee = new THREE.Group(); knee.position.y=-0.66; up.add(knee);
    const loMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.125,0.54,6,12), bodyMat); loMesh.position.y=-0.31; loMesh.castShadow=true; knee.add(loMesh);
    const ankle = new THREE.Group(); ankle.position.y=-0.62; knee.add(ankle);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.13,0.44), darkMat); foot.position.set(0,-0.065,0.09); foot.castShadow=true; ankle.add(foot);
    const toe = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.06,0.1), bodyMat); toe.position.set(0,-0.03,0.26); foot.add(toe);
    return {hip, knee, ankle};
  }
  const LL = leg('left'); const RL = leg('right');

  robot.position.y = 1.62;
  scene.add(robot);

  return { robot, torso, head, core,
    lArm:L.up, rArm:R.up, lElbow:L.elbow, rElbow:R.elbow,
    lLeg:LL.hip, rLeg:RL.hip, lKnee:LL.knee, rKnee:RL.knee, lAnkle:LL.ankle, rAnkle:RL.ankle
  };
}
const bot = createRobot();

// decorative rings
const ringMat = new THREE.MeshBasicMaterial({color:0x00e5ff, transparent:true, opacity:0.08, side:THREE.DoubleSide, wireframe:true});
for(let i=0;i<3;i++){ const r=new THREE.Mesh(new THREE.TorusGeometry(2.2+i*0.9,0.008,8,128), ringMat); r.rotation.x=Math.PI/2; r.position.y=0.01; scene.add(r); }

let mode = 'walk';
let waveTimer = 0;
let walkSpeed = 1.4;
let phase = 0;
const clock = new THREE.Clock();

const buttons = document.querySelectorAll('button[data-mode]');
buttons.forEach(b=> b.onclick = ()=>{ mode = b.dataset.mode; buttons.forEach(x=>x.classList.toggle('active',x===b)); if(mode!=='wave') waveTimer=0; });

const speedEl = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
speedEl.oninput = ()=>{ walkSpeed = parseFloat(speedEl.value); speedVal.textContent = walkSpeed.toFixed(2)+'x'; };

const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('dblclick', (e)=>{
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObject(bot.robot, true);
  if(hits.length){ mode='wave'; waveTimer=2.2; buttons.forEach(x=>x.classList.remove('active')); }
});

function lerp(a,b,t){ return a+(b-a)*t; }

function animate(){
  const dt = Math.min(0.033, clock.getDelta());
  const t = clock.elapsedTime;

  // gait phase advances only in walk/run
  const advancing = (mode==='walk'||mode==='run'||mode==='wave');
  if(advancing){
    const mult = mode==='run'?2.15:1.0;
    phase = (phase + dt * walkSpeed * mult * 1.6) % (Math.PI*2);
  }

  // desired pose
  const d = { lHip:0, rHip:0, lKnee:0, rKnee:0, lAnk:0, rAnk:0, lArm:0, rArm:0, lElb:0.15, rElb:0.15, torsoX:0.03, torsoZ:0, torsoY:0, headY:0, headX:0 };

  if(mode==='walk' || mode==='run'){
    const amp = mode==='run'?0.95:0.68;
    const kneeAmp = mode==='run'?1.65:1.28;
    const armAmp = mode==='run'?0.95:0.62;
    const bob = mode==='run'?0.07:0.035;

    d.lHip = Math.sin(phase) * amp;
    d.rHip = Math.sin(phase+Math.PI) * amp;
    d.lKnee = Math.max(0, Math.sin(phase+0.25)) * kneeAmp;
    d.rKnee = Math.max(0, Math.sin(phase+Math.PI+0.25)) * kneeAmp;
    d.lAnk = -d.lKnee*0.55 - d.lHip*0.22 + 0.24;
    d.rAnk = -d.rKnee*0.55 - d.rHip*0.22 + 0.24;
    d.lArm = Math.sin(phase+Math.PI) * armAmp;
    d.rArm = Math.sin(phase) * armAmp;
    d.lElb = mode==='run'?0.7:0.25;
    d.rElb = d.lElb;
    d.torsoZ = Math.sin(phase)*0.055;
    d.torsoX = 0.09 + Math.sin(phase*2)*0.02;
    d.torsoY = -bob * Math.abs(Math.sin(phase));
    d.headY = Math.sin(phase*0.5)*0.18;
    d.headX = 0.04;
  } else if(mode==='idle'){
    const b = Math.sin(t*1.6)*0.012;
    d.torsoY = b;
    d.torsoX = 0.02 + Math.sin(t*0.8)*0.01;
    d.headY = Math.sin(t*0.6)*0.12;
    d.lArm = 0.08; d.rArm = -0.08;
  } else if(mode==='pose'){
    d.lHip = -0.2; d.rHip = 0.3; d.lKnee=0.5; d.rKnee=0.2; d.lAnk=0.1; d.rAnk=0.1;
    d.lArm = -0.4; d.rArm = -0.6; d.lElb=1.1; d.rElb=0.3; d.torsoZ=-0.08; d.torsoX=0.05; d.headY=0.25;
  } else if(mode==='wave'){
    waveTimer -= dt;
    const w = Math.sin(t*12)*0.4;
    d.lHip = Math.sin(phase*0.5)*0.2; d.rHip = -d.lHip;
    d.lKnee = 0.3; d.rKnee=0.3; d.lAnk=0.2; d.rAnk=0.2;
    d.lArm = 0.1; d.rArm = -1.25 + w*0.15; d.lElb=0.2; d.rElb=1.4 + w*0.3;
    d.torsoZ = Math.sin(t*2)*0.03; d.torsoY = -0.01; d.headY = 0.15;
    if(waveTimer<=0){ mode='walk'; document.querySelector('[data-mode="walk"]').classList.add('active'); }
  }

  // smooth apply
  const s = 0.18;
  bot.lLeg.rotation.x = lerp(bot.lLeg.rotation.x, d.lHip, s);
  bot.rLeg.rotation.x = lerp(bot.rLeg.rotation.x, d.rHip, s);
  bot.lKnee.rotation.x = lerp(bot.lKnee.rotation.x, d.lKnee, s);
  bot.rKnee.rotation.x = lerp(bot.rKnee.rotation.x, d.rKnee, s);
  bot.lAnkle.rotation.x = lerp(bot.lAnkle.rotation.x, d.lAnk, s);
  bot.rAnkle.rotation.x = lerp(bot.rAnkle.rotation.x, d.rAnk, s);
  bot.lArm.rotation.x = lerp(bot.lArm.rotation.x, d.lArm, s);
  bot.rArm.rotation.x = lerp(bot.rArm.rotation.x, d.rArm, s);
  bot.lElbow.rotation.x = lerp(bot.lElbow.rotation.x, d.lElb, s);
  bot.rElbow.rotation.x = lerp(bot.rElbow.rotation.x, d.rElb, s);
  bot.torso.rotation.z = lerp(bot.torso.rotation.z, d.torsoZ, 0.12);
  bot.torso.rotation.x = lerp(bot.torso.rotation.x, d.torsoX, 0.12);
  bot.torso.position.y = lerp(bot.torso.position.y, d.torsoY, 0.15);
  bot.head.rotation.y = lerp(bot.head.rotation.y, d.headY, 0.12);
  bot.head.rotation.x = lerp(bot.head.rotation.x, d.headX, 0.12);

  // core pulse
  bot.core.material.emissiveIntensity = 0.45 + Math.sin(t*3.2)*0.18 + (mode==='run'?0.15:0);

  // moving floor illusion
  const move = (mode==='walk'?0.35: mode==='run'?0.72: 0.05) * walkSpeed * dt;
  gridTex.offset.y -= move;
  floor.material.emissiveIntensity = 0.02;

  // slight robot root bounce to keep feet near ground (closed loop guarantee)
  const baseY = 1.62;
  const footClear = 0.005 * Math.abs(Math.sin(phase*2));
  bot.robot.position.y = baseY + footClear;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
