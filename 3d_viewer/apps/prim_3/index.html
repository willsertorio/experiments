<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Well — night loop</title>
<style>
  html,body{margin:0;height:100%;background:#020409;overflow:hidden}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #stage{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));background:#050810;overflow:hidden}
  #stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;z-index:1}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:
      radial-gradient(130% 90% at 50% 40%, rgba(0,0,0,0) 52%, rgba(1,3,8,.55) 100%),
      linear-gradient(180deg, rgba(2,5,12,.32) 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 84%, rgba(1,3,8,.42) 100%)}
  #fade{position:absolute;inset:0;background:#010207;opacity:1;pointer-events:none;z-index:3}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>

<body>
<div id="wrap"><div id="stage"><div id="vig"></div><div id="fade"></div></div></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {BokehPass} from 'three/addons/postprocessing/BokehPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ---------- tunables ---------- */
const LOOP=16, T_W0=1.2, T_W1=8.6, T_L0=9.6, T_L1=11.2, T_ST=13.6, T_FADE=15.1;
const B0=new THREE.Vector2(1.05,4.4), B1=new THREE.Vector2(1.13,0.46);
const CAM_POS=new THREE.Vector3(1.5,1.05,-4.75), CAM_LOOK=new THREE.Vector3(0.35,1.22,0.8), FOV=62;
const HIP_Y=0.70, L1=0.34, L2=0.34, ANKLE=0.06, HIP_W=0.09;
const STEP_LEN=0.40, STEP_DUR=0.42, STEP_H=0.085;

const clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
const c01=v=>clamp(v,0,1);
const easeIO=u=>u*u*(3-2*u);
const pulse=(t,t0,atk,rel)=>{ if(t<t0) return 0; const u=t-t0; return u<atk? u/atk : Math.max(0,1-(u-atk)/rel); };
function trapz(u,r){ u=c01(u); const vm=1/(1-r);
  if(u<r) return vm*u*u/(2*r); if(u<1-r) return vm*(u-r/2);
  const w=1-u; return 1-vm*w*w/(2*r); }
let seed=11; const rnd=()=>((seed=seed*16807%2147483647)/2147483647);

/* ---------- renderer / stage ---------- */
const stage=document.getElementById('stage'), fadeEl=document.getElementById('fade');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.18;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x060a14);
scene.fog=new THREE.FogExp2(0x0d1626,0.05);
const camera=new THREE.PerspectiveCamera(FOV,9/16,0.1,160);
camera.position.copy(CAM_POS);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.25;

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bokeh=new BokehPass(scene,camera,{focus:5.0,aperture:0.00028,maxblur:0.0045});
composer.addPass(bokeh);
const bloom=new UnrealBloomPass(new THREE.Vector2(540,960),0.38,0.55,0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight,d=Math.min(devicePixelRatio||1,2);
  renderer.setPixelRatio(d); renderer.setSize(w,h,false);
  composer.setPixelRatio(d); composer.setSize(w,h);
  bloom.setSize(w*d,h*d);
}
new ResizeObserver(resize).observe(stage); resize();

/* ---------- procedural sprite textures ---------- */
function radialTex(inner='rgba(255,255,255,1)',outer='rgba(255,255,255,0)'){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'), gr=g.createRadialGradient(64,64,2,64,64,64);
  gr.addColorStop(0,inner); gr.addColorStop(1,outer);
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const softTex=radialTex();

/* procedural surface textures (canvas-generated, self-contained) */
function makeTex(w,h,draw,repX=1,repY=1,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repX,repY);
  t.anisotropy=4; return t;
}
function noiseSpecks(g,w,h,n,alpha,light,dark){
  for(let i=0;i<n;i++){ const r=0.5+rnd()*1.6;
    g.fillStyle=`rgba(${rnd()<0.5?light:dark},${alpha*(0.4+rnd()*0.6)})`;
    g.beginPath(); g.arc(rnd()*w,rnd()*h,r,0,7); g.fill(); }
}
/* stone blocks: staggered courses with mortar lines + speckle */
function drawStone(g,w,h,base,mortar){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  const rows=5, rh=h/rows;
  for(let r=0;r<rows;r++){ let x=(r%2)*-30+rnd()*10; const y=r*rh;
    while(x<w+40){ const bw=55+rnd()*55;
      const sh=8+Math.floor(rnd()*16);
      g.fillStyle=`rgba(255,255,255,${0.05+rnd()*0.07})`;
      g.fillRect(x+2,y+2,bw-6,rh-6);
      g.fillStyle=`rgba(${140+sh},${146+sh},${160+sh},0.35)`;
      g.beginPath();
      g.roundRect(x+3,y+3,bw-8,rh-8,6+rnd()*6); g.fill();
      g.strokeStyle=mortar; g.lineWidth=3.5; g.stroke();
      x+=bw; } }
  noiseSpecks(g,w,h,900,0.10,'220,224,232','40,44,54');
}
const stoneTex=makeTex(512,512,(g,w,h)=>drawStone(g,w,h,'#7b8391','rgba(38,42,52,0.85)'),3,1.6);
const stoneBump=makeTex(512,512,(g,w,h)=>drawStone(g,w,h,'#888888','rgba(20,20,20,1)'),3,1.6,false);
/* wood planks: long grain streaks + plank seams */
function drawWood(g,w,h,base,dark,seams){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<160;i++){ const y=rnd()*h, len=60+rnd()*300, x=rnd()*w;
    g.strokeStyle=`rgba(${dark},${0.06+rnd()*0.12})`; g.lineWidth=1+rnd()*2.2;
    g.beginPath(); g.moveTo(x,y);
    g.bezierCurveTo(x+len*0.3,y+(rnd()-0.5)*6,x+len*0.7,y+(rnd()-0.5)*6,x+len,y+(rnd()-0.5)*3); g.stroke(); }
  for(let i=0;i<10;i++){ const x=rnd()*w,y=rnd()*h,r=3+rnd()*5;   // knots
    g.strokeStyle=`rgba(${dark},0.5)`; g.lineWidth=1.5;
    g.beginPath(); g.ellipse(x,y,r*1.6,r,0,0,7); g.stroke();
    g.beginPath(); g.ellipse(x,y,r*0.7,r*0.4,0,0,7); g.stroke(); }
  if(seams) for(let r=0;r<4;r++){ const y=r*(h/4);
    g.strokeStyle=`rgba(${dark},0.75)`; g.lineWidth=3;
    g.beginPath(); g.moveTo(0,y+2); g.lineTo(w,y+2); g.stroke(); }
}
const woodTex=makeTex(512,512,(g,w,h)=>drawWood(g,w,h,'#6f5138','60,38,20',true),1.6,1.6);
const woodBump=makeTex(512,512,(g,w,h)=>drawWood(g,w,h,'#909090','30,30,30',true),1.6,1.6,false);
const woodDarkTex=makeTex(512,512,(g,w,h)=>drawWood(g,w,h,'#54392a','34,20,10',true),2.2,2.2);
/* grass: mottled patches + blade ticks */
const grassTex=makeTex(512,512,(g,w,h)=>{
  g.fillStyle='#4b6553'; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){ const x=rnd()*w,y=rnd()*h,r=25+rnd()*70;
    const gr=g.createRadialGradient(x,y,2,x,y,r);
    const tone=rnd()<0.5?'58,80,66':'38,56,46';
    gr.addColorStop(0,`rgba(${tone},${0.25+rnd()*0.25})`); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  for(let i=0;i<2600;i++){ const x=rnd()*w,y=rnd()*h,l=2+rnd()*5,a=(rnd()-0.5)*0.9;
    g.strokeStyle=`rgba(${rnd()<0.45?'92,122,96':'26,40,32'},${0.18+rnd()*0.25})`;
    g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.sin(a)*l,y-Math.cos(a)*l); g.stroke(); }
},10,10);
const grassBump=makeTex(256,256,(g,w,h)=>{
  g.fillStyle='#808080'; g.fillRect(0,0,w,h);
  noiseSpecks(g,w,h,2400,0.5,'200,200,200','40,40,40');
},10,10,false);
/* knit fabric: fine diagonal weave */
function drawKnit(g,w,h,base,hi,lo){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=6){ for(let x=0;x<w;x+=6){
    g.fillStyle=((x+y)%12===0)?hi:lo;
    g.globalAlpha=0.16+rnd()*0.1;
    g.beginPath(); g.ellipse(x+3,y+3,2.6,1.5,0.7,0,7); g.fill(); } }
  g.globalAlpha=1;
}
const shirtTex=makeTex(256,256,(g,w,h)=>drawKnit(g,w,h,'#3f6fd8','#7ea2ec','#274b9e'),3,3);
const pantsTex=makeTex(256,256,(g,w,h)=>drawKnit(g,w,h,'#2b2f3a','#4a5164','#171a22'),3,3);

/* ---------- materials ---------- */
const M={
  stone:new THREE.MeshStandardMaterial({color:0xe8edf5,roughness:0.95,map:stoneTex,bumpMap:stoneBump,bumpScale:1.4}),
  stoneDark:new THREE.MeshStandardMaterial({color:0xcdd4e0,roughness:0.95,map:stoneTex,bumpMap:stoneBump,bumpScale:1.2}),
  paving:new THREE.MeshStandardMaterial({color:0x8d95a2,roughness:0.9,map:stoneTex,bumpMap:stoneBump,bumpScale:0.8}),
  wood:new THREE.MeshStandardMaterial({color:0xd9ad7d,roughness:0.55,map:woodTex,bumpMap:woodBump,bumpScale:0.5}),
  woodDark:new THREE.MeshStandardMaterial({color:0xcaa17d,roughness:0.65,map:woodDarkTex,bumpMap:woodBump,bumpScale:0.6}),
  trim:new THREE.MeshStandardMaterial({color:0x6b4a33,roughness:0.5}),
  trunk:new THREE.MeshStandardMaterial({color:0x55402e,roughness:0.85}),
  canopy:new THREE.MeshStandardMaterial({color:0x35513f,roughness:0.9}),
  bush:new THREE.MeshStandardMaterial({color:0x24382e,roughness:0.95}),
  rock:new THREE.MeshStandardMaterial({color:0x6a7280,roughness:0.95}),
  skin:new THREE.MeshStandardMaterial({color:0xeeb894,roughness:0.5,emissive:0x120b07}),
  shirt:new THREE.MeshStandardMaterial({color:0xe4edff,roughness:0.78,map:shirtTex,bumpMap:shirtTex,bumpScale:0.25}),
  pants:new THREE.MeshStandardMaterial({color:0xd4d8e4,roughness:0.88,map:pantsTex,bumpMap:pantsTex,bumpScale:0.2}),
  hair:new THREE.MeshStandardMaterial({color:0x17181d,roughness:0.45}),
  shoe:new THREE.MeshStandardMaterial({color:0x323744,roughness:0.7}),
  sole:new THREE.MeshStandardMaterial({color:0xc9ced8,roughness:0.6}),
  metal:new THREE.MeshStandardMaterial({color:0x3a3f4a,roughness:0.35,metalness:0.6}),
  eyeW:new THREE.MeshStandardMaterial({color:0xf4f6f8,roughness:0.25}),
  eyeB:new THREE.MeshStandardMaterial({color:0x11141a,roughness:0.2}),
  dark:new THREE.MeshStandardMaterial({color:0x0b0e14,roughness:1,side:THREE.BackSide}),
};
function mesh(g,m,x=0,y=0,z=0,cast=true,recv=true){ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=cast; o.receiveShadow=recv; return o; }

/* GLSL procedural stone masonry (keeps StandardMaterial lighting) */
function stoneMat(opts){
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.95});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uMode={value:opts.mode};
    sh.uniforms.uScale={value:new THREE.Vector2(opts.scale[0],opts.scale[1])};
    sh.uniforms.uStoneA={value:new THREE.Color(opts.a)};
    sh.uniforms.uStoneB={value:new THREE.Color(opts.b)};
    sh.uniforms.uMortar={value:new THREE.Color(opts.mortar)};
    sh.uniforms.uBump={value:opts.bump};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>\n uniform float uMode; varying vec3 vObjPos; varying vec3 vTanU; varying vec3 vTanV;`)
      .replace('#include <begin_vertex>',`#include <begin_vertex>\n vObjPos=position;\n vec3 radial=normalize(vec3(position.x,0.0,position.z)+vec3(0.0001,0.0,0.0));\n vec3 tu=(uMode<0.5)?normalize(cross(vec3(0.,1.,0.),radial)):vec3(1.,0.,0.);\n vec3 tv=(uMode<0.5)?vec3(0.,1.,0.):vec3(0.,0.,1.);\n vTanU=normalize(mat3(modelViewMatrix)*tu);\n vTanV=normalize(mat3(modelViewMatrix)*tv);`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
 uniform float uMode; uniform vec2 uScale; uniform vec3 uStoneA,uStoneB,uMortar; uniform float uBump;
 varying vec3 vObjPos; varying vec3 vTanU; varying vec3 vTanV;
 float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
 float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
   return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y); }
 vec2 stoneUV(vec3 p){ if(uMode<0.5){ return vec2(atan(p.z,p.x)/6.2831853*uScale.x, p.y*uScale.y); }
   return vec2(p.x*uScale.x, p.z*uScale.y); }
 vec4 stoneField(vec2 q){
   float row=floor(q.y);
   q.x+=row*0.53+hash21(vec2(row,3.7))*7.0;
   vec2 cell=vec2(floor(q.x),row);
   if(uMode<0.5) cell.x=mod(cell.x,uScale.x);
   vec2 f=fract(q);
   float h1=hash21(cell),h2=hash21(cell+7.31);
   vec2 d=abs(f-0.5);
   vec2 edge=vec2(0.435-0.03*h2,0.40-0.04*h1);
   float rr=0.10+0.10*h2;
   vec2 qq=d-edge+rr;
   float dist=length(max(qq,vec2(0.)))+min(max(qq.x,qq.y),0.)-rr;
   float mask=1.0-smoothstep(-0.045,0.05,dist);
   float dome=1.0-smoothstep(0.0,0.5,length(f-0.5));
   float height=mask*(0.7+0.3*dome)+vnoise(q*9.0)*0.18;
   return vec4(mask,h1,height,h2);
 }`)
      .replace('#include <color_fragment>',`#include <color_fragment>
 { vec2 q=stoneUV(vObjPos); vec4 sf=stoneField(q);
   vec3 sc=mix(uStoneA,uStoneB,sf.y);
   sc*=0.82+0.36*vnoise(q*2.7+sf.w*19.0);
   sc*=1.0-0.22*vnoise(q*13.0);
   vec3 col=mix(uMortar,sc,sf.x);
   diffuseColor.rgb*=col; }`)
      .replace('#include <normal_fragment_begin>',`#include <normal_fragment_begin>
 { vec2 q=stoneUV(vObjPos); float e=0.05;
   float h0=stoneField(q).z,hx=stoneField(q+vec2(e,0.)).z,hy=stoneField(q+vec2(0.,e)).z;
   normal=normalize(normal-vTanU*(hx-h0)*uBump-vTanV*(hy-h0)*uBump); }`);
  };
  return m;
}
const drumStone=stoneMat({mode:0,scale:[18,9],a:0xa8b0bf,b:0xb5a692,mortar:0x3f4652,bump:1.6});
const rimStone=stoneMat({mode:0,scale:[14,5.0],a:0x9aa2b1,b:0xa89a88,mortar:0x3a414d,bump:1.8});
const pavingStone=stoneMat({mode:1,scale:[3.4,3.4],a:0x7e8692,b:0x8a8174,mortar:0x4a505b,bump:0.5});

/* shared GLSL noise */
const NOISE=`
 float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
 float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
   return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y); }`;

/* GLSL wood: planks + grain streaks, normal relief */
function woodMat(o){
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:o.rough??0.6,emissive:o.emissive??0x000000,emissiveIntensity:o.emissiveIntensity??1});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uAlong={value:new THREE.Vector3(...o.along)};
    sh.uniforms.uAcross={value:new THREE.Vector3(...o.across)};
    sh.uniforms.uFreq={value:new THREE.Vector2(o.grain,o.planks)};
    sh.uniforms.uLight={value:new THREE.Color(o.light)};
    sh.uniforms.uDark={value:new THREE.Color(o.dark)};
    sh.uniforms.uBump={value:o.bump??0.6};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\n uniform vec3 uAlong; uniform vec3 uAcross; varying vec3 vObjPos; varying vec3 vTanU; varying vec3 vTanV;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>\n vObjPos=position;\n vTanU=normalize(mat3(modelViewMatrix)*uAlong);\n vTanV=normalize(mat3(modelViewMatrix)*uAcross);`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
 uniform vec2 uFreq; uniform vec3 uLight,uDark; uniform vec3 uAlong,uAcross; uniform float uBump;
 varying vec3 vObjPos; varying vec3 vTanU; varying vec3 vTanV;
 ${NOISE}
 vec4 woodField(vec2 q){
   float plank=floor(q.y*uFreq.y);
   float ph=hash21(vec2(plank,4.7));
   float wig=vnoise(vec2(q.x*2.5,plank*7.0));
   float s=0.5+0.5*sin(q.x*uFreq.x+wig*7.0+ph*40.0);
   s=mix(s,vnoise(q*vec2(6.0,26.0)+ph*9.0),0.4);
   float b=abs(fract(q.y*uFreq.y)-0.5);
   float seam=smoothstep(0.42,0.49,b);
   float height=s*0.35-seam*0.9;
   return vec4(s,seam,height,ph);
 }`)
      .replace('#include <color_fragment>',`#include <color_fragment>
 { vec2 q=vec2(dot(vObjPos,uAlong),dot(vObjPos,uAcross));
   vec4 wf=woodField(q);
   vec3 wc=mix(uDark,uLight,wf.x*(0.75+0.5*wf.w));
   wc*=1.0-wf.y*0.5;
   wc*=0.9+0.2*vnoise(q*vec2(1.3,9.0));
   diffuseColor.rgb*=wc; }`)
      .replace('#include <normal_fragment_begin>',`#include <normal_fragment_begin>
 { vec2 q=vec2(dot(vObjPos,uAlong),dot(vObjPos,uAcross)); float e=0.02;
   float h0=woodField(q).z,hx=woodField(q+vec2(e,0.)).z,hy=woodField(q+vec2(0.,e)).z;
   normal=normalize(normal-vTanU*(hx-h0)*uBump-vTanV*(hy-h0)*uBump); }`);
  };
  return m;
}

/* GLSL grass: patch mottling + blade ticks */
function grassMat(){
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uA={value:new THREE.Color(0x3c5844)};
    sh.uniforms.uB={value:new THREE.Color(0x5f8156)};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\n varying vec3 vObjPos; varying vec3 vTanU; varying vec3 vTanV;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>\n vObjPos=position;\n vTanU=normalize(mat3(modelViewMatrix)*vec3(1.,0.,0.));\n vTanV=normalize(mat3(modelViewMatrix)*vec3(0.,0.,1.));`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
 uniform vec3 uA,uB; varying vec3 vObjPos; varying vec3 vTanU; varying vec3 vTanV;
 ${NOISE}`)
      .replace('#include <color_fragment>',`#include <color_fragment>
 { vec2 q=vObjPos.xz;
   float ptch=clamp(vnoise(q*0.5)*0.7+vnoise(q*2.2)*0.5,0.,1.);
   float ticks=smoothstep(0.55,0.9,vnoise(q*14.0));
   float dk=smoothstep(0.55,0.95,vnoise(q*11.0+31.7));
   vec3 gc=mix(uA,uB,ptch);
   gc=mix(gc,uB*1.25,ticks*0.4);
   gc*=1.0-0.25*dk;
   gc*=mix(1.0,0.38,smoothstep(5.0,40.0,length(q)));
   diffuseColor.rgb*=gc; }`)
      .replace('#include <normal_fragment_begin>',`#include <normal_fragment_begin>
 { vec2 q=vObjPos.xz; float e=0.03;
   float h0=vnoise(q*14.0),hx=vnoise((q+vec2(e,0.))*14.0),hy=vnoise((q+vec2(0.,e))*14.0);
   normal=normalize(normal-vTanU*(hx-h0)*0.4-vTanV*(hy-h0)*0.4); }`);
  };
  return m;
}

/* GLSL cloth: knit ribs / weave (color only, no relief shimmer) */
function clothMat(o){
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:o.rough});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uCol={value:new THREE.Color(o.col)};
    sh.uniforms.uRib={value:o.rib};
    sh.uniforms.uAmp={value:o.amp};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\n varying vec3 vObjPos;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\n vObjPos=position;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
 uniform vec3 uCol; uniform float uRib,uAmp; varying vec3 vObjPos;
 ${NOISE}`)
      .replace('#include <color_fragment>',`#include <color_fragment>
 { vec3 p=vObjPos;
   float ang=atan(p.z,p.x);
   float rib=(uRib>0.5)?(0.5+0.5*sin(ang*uRib)):0.5;
   float fz=vnoise(vec2(ang*4.0,p.y*34.0));
   float fz2=vnoise(vec2(ang*9.0+7.0,p.y*70.0));
   vec3 cc=uCol*(1.0-uAmp*0.5+uAmp*rib)*(0.9+0.14*fz+0.08*fz2);
   diffuseColor.rgb*=cc; }`);
  };
  return m;
}

  rg.translate(0,0,-(d/2+ov));

  g.add(mesh(new RoundedBoxGeometry(0.34,0.6,0.06,2,0.02),M.trim,-w*0.22,0.3,-d/2-0.03));

  const wm=mesh(new RoundedBoxGeometry(0.26,0.34,0.04,2,0.01),win,w*0.2,wy,-d/2-0.02,false,false);

  g.add(mesh(new RoundedBoxGeometry(0.105,0.08,0.21,2,0.03),M.shoe,0,0.068,0.012));
  scene.add(g); return g; }
const footL=footMesh(), footR=footMesh();

/* flashlight */
const flash=new THREE.Group(); scene.add(flash);
{ const b=mesh(new THREE.CylinderGeometry(0.026,0.026,0.13,14),M.metal,0,0,0); b.rotation.x=Math.PI/2; flash.add(b);
  const h=mesh(new THREE.CylinderGeometry(0.036,0.03,0.05,14),M.metal,0,0,0.075); h.rotation.x=Math.PI/2; flash.add(h);
  const lens=mesh(new THREE.CircleGeometry(0.03,14),new THREE.MeshStandardMaterial({color:0xfff2d8,emissive:0xffe9c4,emissiveIntensity:2.6}),0,0,0.101,false,false); flash.add(lens);
  const glint=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex,color:0xffdfae,transparent:true,opacity:0.45,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  glint.scale.setScalar(0.3); glint.position.z=0.11; flash.add(glint); }
function beamCone(r,len,op){ const g=new THREE.ConeGeometry(r,len,26,1,true); g.rotateX(-Math.PI/2); g.translate(0,0,len/2);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffd9a4,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  m.renderOrder=6; flash.add(m); return m; }
const cone1=beamCone(0.34,3.2,0.045), cone2=beamCone(0.14,2.4,0.075);
const spill=new THREE.PointLight(0xffd9a4,0.4,1.4,2); flash.add(spill);
const spot=new THREE.SpotLight(0xffd9a4,30,16,0.30,0.65,1.7);
spot.castShadow=true; spot.shadow.mapSize.set(1024,1024); spot.shadow.bias=-0.0004; spot.shadow.normalBias=0.02;
const beamTarget=new THREE.Object3D(); scene.add(beamTarget);
spot.position.set(0,0,0.02); spot.target=beamTarget; flash.add(spot);
const bounce=new THREE.PointLight(0xffc9a0,0,3.8,2); scene.add(bounce);

/* ---------- IK / gait ---------- */
const _u=new THREE.Vector3(), _p=new THREE.Vector3(), _d=new THREE.Vector3();
function solveLimb(A,Bt,l1,l2,pole,outMid,outEnd){
  _d.subVectors(Bt,A); let d=_d.length(); if(d<1e-5){ d=1e-5; _d.set(0,-1,0);} else _d.divideScalar(d);
  d=clamp(d,Math.abs(l1-l2)+0.02,(l1+l2)*0.999);
  outEnd.copy(A).addScaledVector(_d,d);
  const cos=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1), a=Math.acos(cos);
  _p.copy(pole).addScaledVector(_d,-pole.dot(_d));
  if(_p.lengthSq()<1e-6) _p.set(0,0,1); _p.normalize();
  outMid.copy(A).addScaledVector(_d,Math.cos(a)*l1).addScaledVector(_p,Math.sin(a)*l1);
}
const UPn=new THREE.Vector3(0,-1,0), _q=new THREE.Vector3();
function placeLimb(m,a,b){ m.position.copy(a); _q.subVectors(b,a).normalize(); m.quaternion.setFromUnitVectors(UPn,_q); }

const feet=[{k:-1,plant:new THREE.Vector3(),swing:null,grp:footL},{k:1,plant:new THREE.Vector3(),swing:null,grp:footR}];
let lastStep=1, coolDown=0;
const fwd=new THREE.Vector3(), side=new THREE.Vector3(), home=new THREE.Vector3(), tmpV=new THREE.Vector3();
function gaitUpdate(dt,bodyPos,speed,allow){
  for(const f of feet){ if(f.swing){ f.swing.t+=dt/f.swing.dur;
    if(f.swing.t>=1){ f.plant.copy(f.swing.to); f.swing=null; coolDown=0.09; } } }
  coolDown=Math.max(0,coolDown-dt);
  const anySwing=feet[0].swing||feet[1].swing;
  if(allow&&!anySwing&&coolDown<=0){
    const order=[feet[1-((lastStep+1)/2)],feet[(lastStep+1)/2]].filter(Boolean);
    const cand=[feet[0],feet[1]].sort((a,b)=>(a===feet[(lastStep+1)/2]?1:-1));
    for(const f of cand){
      home.copy(bodyPos).addScaledVector(side,f.k*HIP_W).addScaledVector(fwd,0.02); home.y=0;
      tmpV.subVectors(home,f.plant); const df=tmpV.dot(fwd), dist=tmpV.length();
      if(speed>0.07&&df>STEP_LEN*0.5){
        f.swing={from:f.plant.clone(),to:home.clone().addScaledVector(fwd,STEP_LEN*0.55),t:0,dur:STEP_DUR};
        lastStep=f.k; break;
      } else if(speed<=0.07&&dist>0.085){
        f.swing={from:f.plant.clone(),to:home.clone(),t:0,dur:STEP_DUR*1.35};
        lastStep=f.k; break; } } }
}
function footPos(f,out){ if(!f.swing){ out.copy(f.plant); return 0; }
  const t=c01(f.swing.t), e=easeIO(t);
  out.lerpVectors(f.swing.from,f.swing.to,e); out.y+=Math.sin(Math.PI*t)*STEP_H; return t; }

/* ---------- animation state ---------- */
const walkDir=new THREE.Vector2().subVectors(B1,B0), PATH=walkDir.length(); walkDir.divideScalar(PATH);
const walkYaw=Math.atan2(walkDir.x,walkDir.y);
let wellYaw=Math.atan2(-B1.x,-B1.y);
wellYaw=walkYaw+((wellYaw-walkYaw+Math.PI*3)%(Math.PI*2))-Math.PI;
let simT=0, sPrev=0;
const bodyPos=new THREE.Vector3();
function resetChar(){
  sPrev=0; bodyPos.set(B0.x,0,B0.y);
  fwd.set(walkDir.x,0,walkDir.y); side.set(fwd.z,0,-fwd.x);
  for(const f of feet){ f.swing=null; f.plant.copy(bodyPos).addScaledVector(side,f.k*HIP_W); f.plant.y=0; }
  lastStep=1; coolDown=0;
}
resetChar();

const A=new THREE.Vector3(),Bv=new THREE.Vector3(),K=new THREE.Vector3(),E=new THREE.Vector3(),pole=new THREE.Vector3();
const hipWL=new THREE.Vector3(),hipWR=new THREE.Vector3(),shWL=new THREE.Vector3(),shWR=new THREE.Vector3();
const targ=new THREE.Vector3(), beamT=new THREE.Vector3(), handTL=new THREE.Vector3(), handTR=new THREE.Vector3();
const camP=new THREE.Vector3(), camL=new THREE.Vector3(), viewD=new THREE.Vector3();
const wellC=new THREE.Vector3(0,0,0), rimDir=new THREE.Vector3();

function update(t,dt){
  /* --- body path --- */
  const wu=c01((t-T_W0)/(T_W1-T_W0));
  const s=trapz(wu,0.16);
  bodyPos.set(lerp(B0.x,B1.x,s),0,lerp(B0.y,B1.y,s));
  const speed=(s-sPrev)*PATH/Math.max(dt,1e-4); sPrev=s;
  const walking=speed>0.05;
  /* --- phase scalars --- */
  const leanRaw=easeIO(c01((t-T_L0)/(T_L1-T_L0)));
  const recoil=pulse(t,T_ST,0.14,2.6);
  const lean=leanRaw*(1-0.45*recoil);
  const listen=easeIO(c01((t-11.6)/0.8))*(1-recoil);
  const turn=easeIO(c01((t-8.5)/1.3));
  const yaw=lerp(walkYaw,wellYaw,turn);
  fwd.set(Math.sin(yaw),0,Math.cos(yaw)); side.set(fwd.z,0,-fwd.x);
  /* --- gait --- */
  gaitUpdate(dt,bodyPos,speed,t>0.3&&t<T_L0-0.2);
  let bobY=0,swayX=0,swPh=0;
  for(const f of feet){ if(f.swing){ swPh=Math.sin(Math.PI*c01(f.swing.t));
    bobY=0.024*swPh; swayX=-f.k*0.02*swPh; } }
  /* --- root/pelvis/spine --- */
  boy.position.set(bodyPos.x+fwd.x*0.2*lean,0,bodyPos.z+fwd.z*0.2*lean);
  boy.rotation.y=yaw;
  const idleSway=(t<T_W0?0.008*Math.sin(t*1.3):0);
  pelvis.position.set(swayX+idleSway,HIP_Y-0.03*(walking?1:0)-0.055*lean+bobY,0.0);
  pelvis.rotation.x=0.03+0.05*lean;
  const hunch=0.15+(walking?0.06:0)-0.04*lean;
  spine.rotation.x=hunch+0.6*lean;
  spine.rotation.y=0.04*Math.sin(t*2.1)*(walking?1:0.3);
  torso.scale.setScalar(1+0.015*Math.sin(t*3.4));
  /* --- head --- */
  const scanA=(t<T_W0?1:(walking?0.55:0.2));
  const scanY=0.42*Math.sin(t*0.85+1.9)*scanA;
  head.rotation.y=scanY*(1-lean)+(0.1*Math.sin(t*0.6)-0.18)*listen;
  head.rotation.x=0.08+0.05*Math.sin(t*0.7)*scanA+0.2*lean-0.22*listen-0.55*recoil;
  head.rotation.z=0.35*listen;
  /* --- face --- */
  const blink=[3.1,6.4,9.0,12.3,13.75].reduce((m,b)=>Math.max(m,pulse(t,b,0.06,0.09)),0);
  const wide=1+0.3*recoil+0.08*lean;
  eyeL.scale.set(wide,Math.max(0.1,(1-blink))*wide,1); eyeR.scale.copy(eyeL.scale);
  const braise=0.008*(listen+recoil*1.5);
  browL.position.y=0.19+braise; browR.position.y=0.19+braise;
  mouth.scale.y=0.55+0.25*Math.sin(t*3.4)*0.3+0.5*lean*0+0.9*recoil+0.15*listen;
  /* --- legs IK --- */
  boy.updateMatrixWorld(true);
  hipJL.getWorldPosition(hipWL); hipJR.getWorldPosition(hipWR);
  pole.copy(fwd);
  for(const [f,hip,thigh,shin] of [[feet[0],hipWL,thighL,shinL],[feet[1],hipWR,thighR,shinR]]){
    const ph=footPos(f,targ);
    f.grp.position.copy(targ);
    f.grp.rotation.set(f.swing?-0.32*Math.sin(Math.PI*ph):0,yaw+f.k*0.06,0);
    A.copy(hip); Bv.copy(targ); Bv.y+=ANKLE; Bv.addScaledVector(fwd,-0.015);
    solveLimb(A,Bv,L1,L2,pole,K,E);
    placeLimb(thigh,A,K); placeLimb(shin,K,E);
  }
  /* --- arm targets --- */
  shJL.getWorldPosition(shWL); shJR.getWorldPosition(shWR);
  rimDir.set(bodyPos.x-wellC.x,0,bodyPos.z-wellC.z).normalize();
  const tr=(0.006+0.012*listen+0.02*recoil);
  const trX=Math.sin(t*13.2)*tr+Math.sin(t*7.3)*tr*0.7, trY=Math.cos(t*11.1)*tr;
  /* right hand: flashlight */
  handTR.set(0.20,0.92+0.015*Math.sin(t*3.4),0.34).applyAxisAngle(new THREE.Vector3(0,1,0),yaw).add(boy.position);
  tmpV.copy(wellC).addScaledVector(rimDir,0.33); tmpV.y=1.13;
  handTR.lerp(tmpV,lean); handTR.x+=trX; handTR.y+=trY;
  /* left hand: tucked, then rim */
  handTL.set(-0.20,0.88,0.15).applyAxisAngle(new THREE.Vector3(0,1,0),yaw).add(boy.position);
  tmpV.copy(rimDir).applyAxisAngle(new THREE.Vector3(0,1,0),-0.55).multiplyScalar(0.615).add(wellC); tmpV.y=1.11;
  handTL.lerp(tmpV,lean);
  pole.set(1,-0.3,-0.5).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  solveLimb(shWR,handTR,0.225,0.205,pole,K,E);
  placeLimb(upperR,shWR,K); placeLimb(foreR,K,E); handR.position.copy(E);
  pole.set(-1,-0.3,-0.5).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
  solveLimb(shWL,handTL,0.225,0.205,pole,K,E);
  placeLimb(upperL,shWL,K); placeLimb(foreL,K,E); handL.position.copy(E);
  /* --- flashlight + beam --- */
  const faceYaw=yaw+scanY*0.5*(1-lean);
  beamT.set(bodyPos.x+Math.sin(faceYaw)*2.3,0.04,bodyPos.z+Math.cos(faceYaw)*2.3);
  tmpV.set(wellC.x,1.05-1.8*lean,wellC.z);
  beamT.lerp(tmpV,lean); beamT.x+=trX*2.2; beamT.y+=trY*2.2;
  flash.position.copy(handR.position); flash.position.y+=0.01;
  flash.lookAt(beamT); beamTarget.position.copy(beamT);
  const bd=flash.position.distanceTo(beamT);
  cone1.scale.z=Math.min(1,bd/3.2); cone2.scale.z=Math.min(1,bd/2.4);
  handR.quaternion.copy(flash.quaternion);
  /* flicker at startle */
  let fl=1;
  if(t>T_ST-0.05&&t<T_ST+0.42) fl=(Math.sin(t*46)>0?1:0.22)*(0.7+0.3*Math.sin(t*77));
  spot.intensity=30*fl; cone1.material.opacity=0.055*fl; cone2.material.opacity=0.09*fl;
  /* bounce light: ground hit or well shaft */
  viewD.subVectors(beamT,flash.position).normalize();
  if(lean>0.5){ bounce.position.copy(wellC).addScaledVector(rimDir,0.3); bounce.position.y=1.02; bounce.intensity=5*fl*lean; }
  else{ const dy=Math.max(0.25,-viewD.y); const L=Math.min(4,(flash.position.y-0.05)/dy);
    bounce.position.copy(flash.position).addScaledVector(viewD,L); bounce.position.y=0.14; bounce.intensity=2.4*fl; }
  /* well glow (something below…) */
  wellGlow.position.copy(wellC).addScaledVector(rimDir,0.15); wellGlow.position.y=0.9;
  wellGlow.intensity=(2.0+0.3*Math.sin(t*9.7))*easeIO(c01((t-12.6)/1.0))*(t<13.78?1:Math.max(0,1-(t-13.78)/0.25));
  /* --- ambience --- */
  if(h1.win) h1.win.emissiveIntensity=2.2+0.3*Math.sin(t*7.1)+0.2*Math.sin(t*13.7);
  for(let i=0;i<mists.length;i++){ const m=mists[i];
    m.position.x=m.userData.x0+Math.sin(t*0.06+m.userData.ph)*1.3;
    m.material.opacity=m.userData.o*(0.8+0.3*Math.sin(t*0.33+m.userData.ph)); }
  for(const f of flies){
    f.s.position.set(f.x+Math.sin(t*f.sx+f.p1)*f.ax,
      f.y+Math.sin(t*f.sy+f.p2)*f.ay,
      f.z+Math.sin(t*f.sz+f.p3)*f.az);
    const b=Math.max(0,Math.sin(t*f.bf+f.bp));
    f.s.material.opacity=0.16+0.84*b*b; }
  for(let i=0;i<canopies.length;i++) canopies[i].rotation.z=0.02*Math.sin(t*0.5+i*1.7);
  /* --- camera --- */
  const push=easeIO(t/LOOP)*0.3;
  viewD.subVectors(CAM_LOOK,CAM_POS).normalize();
  camP.copy(CAM_POS).addScaledVector(viewD,push);
  camP.x+=0.014*Math.sin(t*0.31); camP.y+=0.011*Math.sin(t*0.23+1.3);
  camera.position.copy(camP);
  camL.copy(CAM_LOOK); camL.x+=0.02*Math.sin(t*0.17+0.5); camL.y+=0.012*Math.sin(t*0.27);
  camera.lookAt(camL);
  /* focus on boy chest */
  tmpV.set(boy.position.x,1.1,boy.position.z);
  const fdist=camera.position.distanceTo(tmpV);
  bokeh.uniforms['focus'].value=lerp(bokeh.uniforms['focus'].value,fdist*0.92,0.06);
  /* --- fade --- */
  const f=Math.max(c01((t-T_FADE)/0.75),1-c01(t/0.55));
  fadeEl.style.opacity=f.toFixed(3);
}

/* ---------- loop / debug ---------- */
window.__paused=false;
window.__seek=T=>{ resetChar(); simT=0; let acc=0;
  while(acc<T){ const d=Math.min(1/60,T-acc); simT+=d; update(simT,d); acc+=d; }
  window.__paused=true; };
window.__play=()=>{ window.__paused=false; };
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  if(!window.__paused){ simT+=dt; if(simT>=LOOP){ simT-=LOOP; resetChar(); } update(simT,dt); }
  composer.render();
});
update(0.001,0.016);
</script>
